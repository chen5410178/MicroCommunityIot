eureka:
  instance:
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
    preferIpAddress: true
    instanceId: ${spring.cloud.client.ip-address}:${server.port}
  client:
    serviceUrl:
      defaultZone: http://dev.java110.com:8761/eureka/
      #defaultZone: http://localhost:8761/eureka/
server:
  port: 9998
  tomcat:
    uri-encoding: UTF-8

spring:
  profiles:
    active: share
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: iot-access-control
  redis:
    database: 4
    host: 192.168.1.109
    port: 6379
    password: hc12345678
    pool:
      max-active: 300
      max-wait: 10000
      max-idle: 100
      min-idle: 0
      timeout: 0
      maxWaitMillis: 20000

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 20000