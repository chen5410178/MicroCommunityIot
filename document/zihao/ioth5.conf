server {
	listen       80;
	server_name  localhost;

	location / {
	    root   /home/data/web/iotapp;
	}
	location /iot/api
	{
	  add_header 'Access-Control-Allow-Origin' '*';
	  proxy_pass   http://dev.api.java110.com:9999;
	}
	location /app
	{

	  add_header 'Access-Control-Allow-Origin' '*';
	  proxy_pass  http://dev.api.java110.com:9999;
	}
}
