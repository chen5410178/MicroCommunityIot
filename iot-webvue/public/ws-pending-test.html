<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ws-pending-test3</title></head>
<body>
<div id="log">starting</div>
<script>
  const log = document.getElementById('log')
  const boxId = '102026071099080061'
  const results = []
  function test(label, url) {
    results.push(label + ': connecting')
    let ws
    try {
      ws = new WebSocket(url)
      ws.onopen = () => { results.push(label + ': OPEN') }
      ws.onerror = (e) => { results.push(label + ': ERROR ' + (e.message || 'unknown')) }
      ws.onclose = (e) => { results.push(label + ': CLOSE code=' + e.code + ' reason=' + e.reason) }
      ws.onmessage = (m) => { results.push(label + ': MSG ' + m.data) }
    } catch (e) {
      results.push(label + ': EXCEPTION ' + e.message)
    }
    setTimeout(() => {
      results.push(label + ': readyState=' + (ws ? ws.readyState : 'null') + ' (0=CONNECTING,1=OPEN)')
    }, 4000)
  }
  const uid = (crypto.randomUUID) ? crypto.randomUUID() : '87651e3a-db7f-4c50-8456-3612b76f759c'
  test('A-proxy3002', 'ws://localhost:3002/iot/ws/parkingBox/' + boxId + '/' + uid)
  test('B-direct9999', 'ws://192.168.101.109:9999/iot/ws/parkingBox/' + boxId + '/' + uid)
  setTimeout(() => { log.textContent = results.join(' | ') }, 9000)
</script>
</body>
</html>
