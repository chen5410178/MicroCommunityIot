<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>监控视频</title>
		<script src="./jessibuca.js"></script>
	</head>
	<body>
		<div class="container-shell">
			<div id="container" style="width: 100%;height: 300px;"></div>
		</div>


		<script>
			function _play() {
				let image = document.getElementById("container");
				let jessibuca = new Jessibuca({
					container: image,
					videoBuffer: 0.2, // 缓存时长
					isResize: false,
					text: "",
					loadingText: "",
					useMSE: false,
					debug: false,
					isNotMute: false,
					operateBtns: {
						fullscreen: true,
						screenshot: true,
						play: true,
						audio: false,
						recorder: false
					},
				});
				const urlParams = new URLSearchParams(window.location.search);
				const tt = urlParams.get('tt'); // "john"
				jessibuca.play(
					tt
				);
			}

			_play();
		</script>

	</body>
</html>
