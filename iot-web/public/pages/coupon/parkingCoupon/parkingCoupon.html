<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;"></div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择名称','parkingCoupon')"
                                    v-model="parkingCouponInfo.conditions.name" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <select class="custom-select" v-model="parkingCouponInfo.conditions.typeCd">
                                <option selected value="">{{vc.i18n('请选择时长减免','parkingCoupon')}}</option>
                                <option value="1001">{{vc.i18n('时长减免','parkingCoupon')}}</option>
                                <option value="2002">{{vc.i18n('金额减免','parkingCoupon')}}</option>
                                <option value="3003">{{vc.i18n('折扣减免','parkingCoupon')}}</option>
                                <option value="4004">{{vc.i18n('全免','parkingCoupon')}}</option>
                            </select>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryParkingCouponMethod()">
                                    <vc:i18n name="查询"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="停车劵" namespace="parkingCoupon"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddParkingCouponModal()">
                            <vc:i18n name="添加" namespace="parkingCoupon"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='名称' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='类型' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='停车场' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='面值' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='售价（元）' namespace='parkingCoupon'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="parkingCoupon in parkingCouponInfo.parkingCoupons">
                                <td class="text-center">{{parkingCoupon.couponId}}</td>
                                <td class="text-center">{{parkingCoupon.name}}</td>
                                <td class="text-center">{{parkingCoupon.typeCdName}}</td>
                                <td class="text-center">{{parkingCoupon.paName}}</td>
                                <td class="text-center">
                                    <span v-if="parkingCoupon.typeCd == '1001'">{{parkingCoupon.value}}分钟</span>
                                    <span v-if="parkingCoupon.typeCd == '2002'">{{parkingCoupon.value}}元</span>
                                    <span v-if="parkingCoupon.typeCd == '3003'">{{parkingCoupon.value}}折</span>
                                    <span v-if="parkingCoupon.typeCd == '4004'">全免</span>
                                </td>
                                <td class="text-center">{{parkingCoupon.valuePrice}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditParkingCouponModel(parkingCoupon)">
                                                <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteParkingCouponModel(parkingCoupon)">
                                                <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="coupon/addParkingCoupon" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="coupon/editParkingCoupon"></vc:create>
    <vc:create path="coupon/deleteParkingCoupon"></vc:create>
</div>
