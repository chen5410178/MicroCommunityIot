<div>
    <div class="row">
        <div class="col-md-2 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview attendance-staff">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree " v-for="(item,index) in attendanceStaffInfo.machines"
                            :key="index" @click="swatchMachine(item)"
                            :class="{'vc-node-selected':attendanceStaffInfo.conditions.machineId == item.machineId}">
                            {{item.machineName}}({{item.classesName}})
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;"></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择员工名称','attendanceStaff')"
                                            v-model="attendanceStaffInfo.conditions.staffNameLike"
                                            class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryAttendanceStaffMethod()">
                                        <vc:i18n name="查询"></vc:i18n>
                                    </button>
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_resetAttendanceStaffMethod()">
                                        <vc:i18n name="重置"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="考勤员工" namespace="attendanceStaff"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_openAddAttendanceStaffModal()">
                                    <vc:i18n name="添加" namespace="attendanceStaff"></vc:i18n>
                                </button>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='人脸' namespace='attendanceStaff'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='员工编号' namespace='attendanceStaff'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='员工名称' namespace='attendanceStaff'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='创建时间' namespace='attendanceStaff'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <span>
                                                <vc:i18n name='操作'></vc:i18n>
                                            </span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="attendanceStaff in attendanceStaffInfo.staffs">
                                        <td class="text-center">
                                            <div style="position: relative; display: inline-block;"
                                                v-on:click="showImg(attendanceStaff.facePath?attendanceStaff.facePath:'/img/noPhoto.jpg')">
                                                <img width="50" height="50"
                                                    v-bind:src="attendanceStaff.facePath?attendanceStaff.facePath:'/img/noPhoto.jpg'"
                                                    onerror="this.src='/img/noPhoto.jpg';">
                                                <img src="/img/icon-bigimg.png"
                                                    style="position: absolute;right: 0;bottom: 0;" width="50"
                                                    height="50" alt="">
                                            </div>
                                        </td>
                                        <td class="text-center">{{attendanceStaff.staffId}}</td>
                                        <td class="text-center">{{attendanceStaff.staffName}}</td>
                                        <td class="text-center">{{attendanceStaff.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeleteAttendanceStaffModel(attendanceStaff)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="attendance/deleteAttendanceStaff"></vc:create>
    <vc:create path="common/viewImage"></vc:create>
</div>
