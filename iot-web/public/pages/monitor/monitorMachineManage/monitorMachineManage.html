<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-link btn-sm" style="margin-right:10px;" v-on:click="_moreCondition()">
                            {{monitorMachineManageInfo.moreCondition == true?'隐藏':'更多'}}
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入监控名称','monitorMachineManage')"
                                    v-model="monitorMachineManageInfo.conditions.machineName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入监控编号','monitorMachineManage')"
                                    v-model="monitorMachineManageInfo.conditions.machineCode" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorMachineManageInfo.conditions.maId">
                                    <option selected disabled value="">{{vc.i18n('请选择监控区域','monitorMachineManage')}}</option>
                                    <option v-for="(item, index) in monitorAreaList" :key="index" :value="item.maId">
                                        {{item.maName}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryMonitorMachineMethod()">
                                <vc:i18n name="查询" namespace="monitorMachineManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetMonitorMachineMethod()">
                                <vc:i18n name="重置" namespace="monitorMachineManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3" v-if="monitorMachineManageInfo.moreCondition == true">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入监控位置','monitorMachineManage')"
                                    v-model="monitorMachineManageInfo.conditions.locationName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="monitorMachineManageInfo.moreCondition == true">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorMachineManageInfo.conditions.protocol">
                                    <option selected disabled value="">{{vc.i18n('请选择监控协议','monitorMachineManage')}}</option>
                                    <option v-for="(item, index) in protocolList" :key="index" :value="item.statusCd">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="monitorMachineManageInfo.moreCondition == true">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorMachineManageInfo.conditions.state">
                                    <option selected disabled value="">{{vc.i18n('请选择状态','monitorMachineManage')}}</option>
                                    <option value="1001">{{vc.i18n('打开中','monitorMachineManage')}}</option>
                                    <option value="1002">{{vc.i18n('关闭中','monitorMachineManage')}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="监控设备" namespace="monitorMachineManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddMonitorMachineModal()">
                            <vc:i18n name="添加" namespace="monitorMachineManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='监控ID' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控名称' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控编号' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='位置' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='区域' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控协议' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='心跳时间' namespace='monitorMachineManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="monitorMachine in monitorMachineManageInfo.monitorMachines">
                                <td class="text-center">{{monitorMachine.machineId}}</td>
                                <td class="text-center">{{monitorMachine.machineName}}</td>
                                <td class="text-center">{{monitorMachine.machineCode}}</td>
                                <td class="text-center">{{monitorMachine.locationName}}</td>
                                <td class="text-center">{{monitorMachine.maName}}</td>
                                <td class="text-center">{{monitorMachine.protocol}}</td>
                                <td class="text-center">
                                    <label v-if="monitorMachine.state === '1001'">{{vc.i18n('打开中','monitorMachineManage')}}</label>
                                    <label v-if="monitorMachine.state === '1002'">{{vc.i18n('关闭中','monitorMachineManage')}}</label>
                                </td>
                                <td class="text-center">{{monitorMachine.heartbeatTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditMonitorMachineModel(monitorMachine)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteMonitorMachineModel(monitorMachine)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="monitor/addMonitorMachine" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="monitor/editMonitorMachine"></vc:create>
    <vc:create path="monitor/deleteMonitorMachine"></vc:create>

</div>
