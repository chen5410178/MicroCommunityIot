<div class="ibox">
    <div class="ibox-title">
        <h5>
            <vc:i18n name="添加" namespace="addMonitorMachineOwner"></vc:i18n>
        </h5>
        <div class="ibox-tools" style="top:10px;">
            <button type="button" class="btn btn-primary btn-sm" v-on:click="_goBack()">
                <i class="fa fa-times"></i>返回
            </button>
        </div>
    </div>
    <div class="ibox-content">
        <div class="form-group row">
            <label class="col-sm-2 col-form-label text-right">
                <vc:i18n name='业主名称' namespace='addMonitorMachineOwner'></vc:i18n>
            </label>
            <div class="col-sm-8">
                <select class="custom-select" v-model="addMonitorMachineOwnerInfo.role">
                    <option selected disabled value="">授权类型</option>
                    <option value="1">单个业主</option>
                    <option value="2">全部业主</option>
                </select>
            </div>
        </div>
        <div class="form-group row" v-if="addMonitorMachineOwnerInfo.role == '1'">
            <label class="col-sm-2 col-form-label text-right">
                <vc:i18n name='业主名称' namespace='addMonitorMachineOwner'></vc:i18n>
            </label>
            <div class="col-sm-8">
                <input type="text" class="form-control" :placeholder="vc.i18n('必填，请选择业主','itemReleaseDetail')" disabled
                    v-model="addMonitorMachineOwnerInfo.ownerName">
            </div>
            <div class="col-sm-2">
                <button class="btn btn-primary " type="button" v-on:click="openChooseStaff()">
                    <i class="fa fa-search"></i>选择
                </button>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12 text-right">
            <button type="button" class="btn btn-warning " style="margin-right:20px;" @click="_goBack()">
                <vc:i18n name="返回"></vc:i18n>
            </button>
            <button class="btn btn-primary" type="button" v-on:click="saveMonitorMachineOwnerInfo()">
                <i class="fa fa-check"></i>&nbsp;提交
            </button>
        </div>
    </div>

    <vc:create path="property/searchOwner"></vc:create>
</div>
