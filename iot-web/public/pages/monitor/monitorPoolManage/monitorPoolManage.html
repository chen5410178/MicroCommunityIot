<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorPoolManageInfo.conditions.machineId">
                                    <option selected disabled value="">{{vc.i18n('请选择监控设备','monitorPoolManage')}}</option>
                                    <option v-for="(item, index) in monitorMachineList" :key="index" :value="item.machineId">
                                        {{item.machineName}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorPoolManageInfo.conditions.modelId">
                                    <option selected disabled value="">{{vc.i18n('请选择监控模型','monitorPoolManage')}}</option>
                                    <option v-for="(item, index) in monitorModelList" :key="index" :value="item.modelId">
                                        {{item.modelName}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="monitorPoolManageInfo.conditions.monitorType">
                                    <option selected disabled value="">{{vc.i18n('请选择监控类型','monitorPoolManage')}}</option>
                                    <option v-for="(item, index) in monitorTypeList" :key="index" :value="item.statusCd">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryMonitorPoolMethod()">
                                <vc:i18n name="查询" namespace="monitorPoolManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetMonitorPoolMethod()">
                                <vc:i18n name="重置" namespace="monitorPoolManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="监控告警" namespace="monitorPoolManage"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控名称' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控编码' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控模型' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控类型' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='监控图片' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='描述' namespace='monitorPoolManage'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="monitorPool in monitorPoolManageInfo.monitorPools">
                                <td class="text-center">{{monitorPool.mpId}}</td>
                                <td class="text-center">{{monitorPool.machineName}}</td>
                                <td class="text-center">{{monitorPool.machineCode}}</td>
                                <td class="text-center">{{monitorPool.modelName}}</td>
                                <td class="text-center">{{monitorPool.monitorTypeName}}</td>
                                <td class="text-center">
                                    <div style="position: relative; display: inline-block;">
                                        <img width="50" height="50" style="border-radius: 10px;" v-bind:src="monitorPool.monitorPhoto"
                                             onerror="this.src='/img/noPhoto.jpg';">
                                    </div>
                                </td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(monitorPool.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="event/viewData"></vc:create>
</div>
