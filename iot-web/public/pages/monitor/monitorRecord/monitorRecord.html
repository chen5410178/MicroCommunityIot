<div>
    <div class="row">
        <div class="col-md-1 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview ">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree "
                            v-for="(item,index) in monitorRecordInfo.monitors" :key="index"
                            @click="swatchMonitor(item)"
                            :class="{'vc-node-selected':monitorRecordInfo.conditions.machineId == item.machineId}">
                            {{item.machineName}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-11">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择名称','monitorRecord')"
                                    v-model="monitorRecordInfo.conditions.personName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryMonitorMachinePersonMethod()">
                                <vc:i18n name="查询"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="监控录像" namespace="monitorRecord"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                       
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='文件名' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='相机名称' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='相机编号' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='时间段' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='过期时间' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='文件地址' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='monitorRecord'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="monitorRecord in monitorRecordInfo.videoRecords">
                                <td class="text-center">{{monitorRecord.fileName}}</td>
                                <td class="text-center">{{monitorRecord.machineName}}</td>
                                <td class="text-center">{{monitorRecord.machineCode}}</td>
                                <td class="text-center">{{monitorRecord.dateHours}}</td>
                                <td class="text-center">{{monitorRecord.expireTime}}</td>
                                <td class="text-center">{{monitorRecord.filePath}}</td>
                                <td class="text-center">{{monitorRecord.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openPlayVideo(monitorRecord)">
                                            <vc:i18n name='预览'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>

            </div>
        </div>
    </div>

    <vc:create path="monitor/playRecordMonitorVideo"></vc:create>


</div>
