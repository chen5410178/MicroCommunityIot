<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                
            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择厂家名称','monitorManufactor')"
                            v-model="monitorManufactorInfo.conditions.mmName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-1">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryMonitorManufactorMethod()">
                        <i class="glyphicon glyphicon-search"></i> <span>
                            <vc:i18n name="查询"></vc:i18n>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="监控平台" namespace="monitorManufactor"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddMonitorManufactorModal()">
                    <vc:i18n name="添加" namespace="monitorManufactor"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <!-- <th class="text-center">
                            <vc:i18n name='编号' namespace='monitorManufactor'></vc:i18n>
                        </th> -->
                        <th class="text-center">
                            <vc:i18n name='厂家名称' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='系统地址' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='厂家类型' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='APP_ID' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='秘钥' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='monitorManufactor'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="monitorManufactor in monitorManufactorInfo.monitorManufactors">
                        <!-- <td class="text-center">{{monitorManufactor.mmId}}</td> -->
                        <td class="text-center">{{monitorManufactor.mmName}}</td>
                        <td class="text-center">{{monitorManufactor.mmUrl}}</td>
                        <td class="text-center">{{monitorManufactor.mmBeanName}}</td>
                        <td class="text-center">{{monitorManufactor.appId}}</td>
                        <td class="text-center">{{monitorManufactor.appSecure}}</td>
                        <td class="text-center">{{monitorManufactor.remark}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openEditMonitorManufactorModel(monitorManufactor)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteMonitorManufactorModel(monitorManufactor)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>



    <vc:create path="monitor/addMonitorManufactor" ></vc:create>
    <vc:create path="monitor/editMonitorManufactor"></vc:create>
    <vc:create path="monitor/deleteMonitorManufactor"></vc:create>

</div>
