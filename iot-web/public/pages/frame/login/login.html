<div>
    <!-- 账户密码登录 -->
    <div class="log">
        <h3 class="java110-logo"></h3>
        <div>
            <input type="text" v-model="loginInfo.username" :placeholder="vc.i18n('请输入用户名','login')" @keyup.enter="doLogin">
        </div>
        <div>
            <input type="password" v-model="loginInfo.passwd" maxlength="64" :placeholder="vc.i18n('请输入密码','login')" @keyup.enter="doLogin">
        </div>

        <div class="slider-verify-wrap">
            <vc:create path="frame/sliderVerify"></vc:create>
        </div>

        <div class="p-button">
            <button v-on:click="doLogin()">登 录</button>
        </div>
    </div>

    <div class="app tc">
        <img src="../img/logico.png" alt="">
    </div>
    <vc:create path="frame/initData"></vc:create>
</div>
