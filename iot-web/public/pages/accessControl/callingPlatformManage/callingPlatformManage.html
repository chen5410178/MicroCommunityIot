<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择平台名称','callingPlatformManage')"
                            v-model="callingPlatformManageInfo.conditions.platformName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryCallingPlatformMethod()">
                        <vc:i18n name="查询" namespace="callingContactManage"></vc:i18n>
                    </button>
                </div>
            </div>


        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="呼叫平台" namespace="callingPlatformManage"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddCallingPlatformModal()">
                    <vc:i18n name="添加" namespace="callingPlatformManage"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">

            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='平台编号' namespace='callingPlatformManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='平台名称' namespace='callingPlatformManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='平台IP地址' namespace='callingPlatformManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='端口' namespace='callingPlatformManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='callingPlatformManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="callingPlatform in callingPlatformManageInfo.callingPlatforms">
                        <td class="text-center">{{callingPlatform.platformId}}</td>
                        <td class="text-center">{{callingPlatform.platformName}}</td>
                        <td class="text-center">{{callingPlatform.ipAddr}}</td>
                        <td class="text-center">{{callingPlatform.port}}</td>
                        <td class="text-center">{{callingPlatform.remark}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openEditCallingPlatformModel(callingPlatform)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteCallingPlatformModel(callingPlatform)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>


    <vc:create path="accessControl/addCallingPlatform" ></vc:create>
    <vc:create path="accessControl/editCallingPlatform"></vc:create>
    <vc:create path="accessControl/deleteCallingPlatform"></vc:create>

</div>
