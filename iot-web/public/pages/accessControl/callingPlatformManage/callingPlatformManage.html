<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="查询条件"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择平台名称','callingPlatformManage')"
                                       v-model="callingPlatformManageInfo.conditions.platformName"
                                       class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择平台地址','callingPlatformManage')"
                                       v-model="callingPlatformManageInfo.conditions.ipAddr" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_queryCallingPlatformMethod()">
                                <vc:i18n name="查询" namespace="callingContactManage"></vc:i18n>
                            </button>
                            <!--                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetVisitMethod()">-->
                            <!--                                <vc:i18n name="重置" namespace="callingContactManage"></vc:i18n>-->
                            <!--                            </button>-->
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="呼叫平台信息" namespace="callingPlatformManage"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_openAddCallingPlatformModal()">
                            <i class="glyphicon glyphicon-plus"></i>
                            <span><vc:i18n name="添加平台" namespace="callingPlatformManage"></vc:i18n></span>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny"
                           data-page-size="15"
                    >
                        <thead>
                        <tr>
                            <th class="text-center"><span><vc:i18n name='平台ID'
                                                                   namespace='callingPlatformManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='平台名称'
                                                                   namespace='callingPlatformManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='平台IP地址'
                                                                   namespace='callingPlatformManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='端口'
                                                                   namespace='callingPlatformManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='备注'
                                                                   namespace='callingPlatformManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='操作'></vc:i18n></span></th>


                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="callingPlatform in callingPlatformManageInfo.callingPlatforms">
                            <td class="text-center">{{callingPlatform.platformId}}</td>
                            <td class="text-center">{{callingPlatform.platformName}}</td>
                            <td class="text-center">{{callingPlatform.ipAddr}}</td>
                            <td class="text-center">{{callingPlatform.port}}</td>
                            <td class="text-center">{{callingPlatform.remark}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditCallingPlatformModel(callingPlatform)"><span><vc:i18n
                                            name='修改'></vc:i18n></span></button>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteCallingPlatformModel(callingPlatform)"><span><vc:i18n
                                            name='删除'></vc:i18n></span></button>
                                </div>
                            </td>

                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="7">
                                <ul class="pagination float-right"></ul>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>


    <vc:create path="accessControl/addCallingPlatform"
               callBackListener=""
               callBackFunction=""
    ></vc:create>
    <vc:create path="accessControl/editCallingPlatform"></vc:create>
    <vc:create path="accessControl/deleteCallingPlatform"></vc:create>

</div>
