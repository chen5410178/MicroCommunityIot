<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择名称','personFaceQrcode')"
                                    v-model="personFaceQrcodeInfo.conditions.qrcodeName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryPersonFaceQrcodeMethod()">
                                <i class="glyphicon glyphicon-search"></i> <span>
                                    <vc:i18n name="查询"></vc:i18n>
                                </span>
                            </button>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="人脸二维码" namespace="personFaceQrcode"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddPersonFaceQrcodeModal()">
                            <vc:i18n name="添加" namespace="personFaceQrcode"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='名称' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='短信验证' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='手机号验证' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='审核' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='邀请开关' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='邀请码' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='说明' namespace='personFaceQrcode'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="personFaceQrcode in personFaceQrcodeInfo.personFaceQrcodes">
                                <td class="text-center">{{personFaceQrcode.pfqId}}</td>
                                <td class="text-center">{{personFaceQrcode.qrcodeName}}</td>
                                <td class="text-center">{{personFaceQrcode.smsValidate}}</td>
                                <td class="text-center">{{personFaceQrcode.telValidate}}</td>
                                <td class="text-center">{{personFaceQrcode.audit}}</td>
                                <td class="text-center">{{personFaceQrcode.invite}}</td>
                                <td class="text-center">{{personFaceQrcode.inviteCode}}</td>
                                <td class="text-center">{{personFaceQrcode.state}}</td>
                                <td class="text-center">{{personFaceQrcode.remark}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditPersonFaceQrcodeModel(personFaceQrcode)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeletePersonFaceQrcodeModel(personFaceQrcode)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="accessControl/addPersonFaceQrcode" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="accessControl/editPersonFaceQrcode"></vc:create>
    <vc:create path="accessControl/deletePersonFaceQrcode"></vc:create>

</div>
