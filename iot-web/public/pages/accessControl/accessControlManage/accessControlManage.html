<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择设备编码','accessControlManage')"
                                    v-model="accessControlManageInfo.conditions.machineCode" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择设备名称','accessControlManage')"
                                    v-model="accessControlManageInfo.conditions.machineName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择位置名称','accessControlManage')"
                                    v-model="accessControlManageInfo.conditions.locationName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryAccessControlMethod()">
                                <i class="glyphicon glyphicon-search"></i> <span>
                                    <vc:i18n name="查询"></vc:i18n>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="门禁信息" namespace="accessControlManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddAccessControlModal()">
                            <vc:i18n name="添加" namespace="accessControlManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='门禁编码' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='门禁名称' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='IP' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='Mac' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='方向' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='位置' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='在线' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='心跳时间' namespace='accessControlManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="accessControl in accessControlManageInfo.accessControls">
                                <td class="text-center">{{accessControl.machineCode}}</td>
                                <td class="text-center">{{accessControl.machineName}}</td>
                                <td class="text-center">{{accessControl.machineIp || '-'}}</td>
                                <td class="text-center">{{accessControl.machineMac || '-'}}</td>
                                <td class="text-center">{{accessControl.direction == '3306'?'进':'出'}}</td>
                                <td class="text-center">{{accessControl.implBean}}</td>
                                <td class="text-center">{{accessControl.locationName}}</td>
                                <td class="text-center">{{accessControl.stateName}}</td>
                                <td class="text-center">{{accessControl.heartbeatTime}}</td>
                                <td class="text-center">
                                    <div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                @click="_toAccessControlDetail(accessControl)">
                                                <vc:i18n name='详情'></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs" v-on:click="_openDoor(accessControl)">
                                                <vc:i18n name='开门'></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                v-on:click="_restartDoor(accessControl)">
                                                <vc:i18n name='重启'></vc:i18n>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="margin-top-xs">
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                v-on:click="_reSendPersonData(accessControl)">
                                                <vc:i18n name='重新下发'></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                v-on:click="_openEditAccessControlModel(accessControl)">
                                                <vc:i18n name='修改'></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                v-on:click="_openDeleteAccessControlModel(accessControl)">
                                                <vc:i18n name='删除'></vc:i18n>
                                            </button>
                                        </div>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>



    <vc:create path="accessControl/addAccessControl"></vc:create>
    <vc:create path="accessControl/editAccessControl"></vc:create>
    <vc:create path="accessControl/deleteAccessControl"></vc:create>
    <vc:create path="accessControl/reSendAccessControlFace"></vc:create>
    
</div>
