<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>
                    <vc:i18n name="人员授权" namespace="accessControlPerson"></vc:i18n>
                </h5>
                <div class="ibox-tools" style="top:10px;">
                    <button type="button" class="btn btn-white btn-sm" v-on:click="_goBack()">
                        <i class="fa fa-close"></i>返回
                    </button>
                </div>
            </div>
            <div class="ibox-content">
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right"><vc:i18n name='门禁设备' namespace='accessControlPerson'></vc:i18n></label>
                    <div class="col-sm-10 col-form-label">
                        <label class="margin-right" v-for="(item,index) in accessControlPersonInfo.machines">
                                        <input type="checkbox" v-model="accessControlPersonInfo.machineIds" :value="item.machineId"> {{item.machineName}}
                                     </label>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name="开始时间" namespace="accessControlPerson"></vc:i18n>
                    </label>
                    <div class="col-sm-4">
                        <input v-model="accessControlPersonInfo.startDate" type="text" :placeholder="vc.i18n('必填，请选择开始时间','accessControlPerson')" class="form-control startDate">
                    </div>
                    <label class="col-sm-2 col-form-label text-right">
                        <vc:i18n name="结束时间" namespace="accessControlPerson"></vc:i18n>
                    </label>
                    <div class="col-sm-4">
                        <input v-model="accessControlPersonInfo.endDate" type="text" :placeholder="vc.i18n('必填，请选择结束时间','accessControlPerson')" class="form-control endDate">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name="人员" namespace="accessControlPerson"></vc:i18n>
                    </label>
                    <div class="col-sm-3">
                        <input v-model="accessControlPersonInfo.ownerName" disabled type="text" :placeholder="vc.i18n('必填，请选择人员','accessControlPerson')" class="form-control">
                    </div>
                    <div class="col-sm-1">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openChooseOwner()">选择人员
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 text-right">
                <button type="button" class="btn btn-warning " style="margin-right:20px;" @click="_goBack()">
                        <vc:i18n name="返回" namespace="accessControlPerson"></vc:i18n>
                </button>
                <button class="btn btn-primary" type="button" v-on:click="_authorizeAccessControl()"><i
                        class="fa fa-check"></i>&nbsp;提交
                </button>
            </div>
        </div>
    </div>

    <vc:create path="property/searchOwner" emitChooseOwner="accessControlPerson" emitLoadData="accessControlPerson">
    </vc:create>

</div>
