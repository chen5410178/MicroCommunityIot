<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            拜访信息
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="拜访ID：" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.visitId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="姓名：" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.name}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="性别：" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.visitGender == 0 ? '男' : '女'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="电话号码:" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.phoneNumber}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="拜访房屋:" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.roomName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="拜访业主:" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.ownerName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="访客类型:" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.visitTypeName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="审核备注:" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{visitDetailInfo.visitCase || '-'}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="审核状态" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{visitDetailInfo.stateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="审核备注" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{visitDetailInfo.msg || '-'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="添加时间" namespace="visitDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{visitDetailInfo.createTime}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:visitDetailInfo._currentTab == 'visitDetailAccessControlInout'}" v-on:click="changeTab('visitDetailAccessControlInout')">
                    <vc:i18n name="进出记录" namespace="machineDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>

    <div v-if="visitDetailInfo._currentTab == 'visitDetailAccessControlInout'">
        <vc:create path="property/visitDetailAccessControlInout"></vc:create>
    </div>
</div>
