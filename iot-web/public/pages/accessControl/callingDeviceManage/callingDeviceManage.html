<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择设备名称','callingDeviceManage')"
                            v-model="callingDeviceManageInfo.conditions.deviceName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择呼叫号码','callingDeviceManage')"
                            v-model="callingDeviceManageInfo.conditions.callingNum" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryCallingDeviceMethod()">
                        <vc:i18n name="查询" namespace="callingContactManage"></vc:i18n>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="呼叫设备" namespace="callingDeviceManage"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddCallingDeviceModal()">
                    <vc:i18n name="添加" namespace="callingDeviceManage"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='设备ID' namespace='callingDeviceManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备名称' namespace='callingDeviceManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='呼叫号码' namespace='callingDeviceManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='云呼平台' namespace='callingDeviceManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='callingDeviceManage'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="callingDevice in callingDeviceManageInfo.callingDevices">
                        <td class="text-center">{{callingDevice.deviceId}}</td>
                        <td class="text-center">{{callingDevice.deviceName}}</td>
                        <td class="text-center">{{callingDevice.callingNum}}</td>
                        <td class="text-center">{{callingDevice.platformName}}</td>
                        <td class="text-center">{{callingDevice.remark}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openEditCallingDeviceModel(callingDevice)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteCallingDeviceModel(callingDevice)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>
    </div>
    <vc:create path="accessControl/addCallingDevice" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="accessControl/editCallingDevice"></vc:create>
    <vc:create path="accessControl/deleteCallingDevice"></vc:create>

</div>
