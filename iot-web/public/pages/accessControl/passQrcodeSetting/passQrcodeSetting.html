<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择名称','passQrcodeSetting')"
                                    v-model="passQrcodeSettingInfo.conditions.qrcodeName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryPassQrcodeSettingMethod()">
                                <vc:i18n name="查询"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="通行码设置" namespace="passQrcodeSetting"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddPassQrcodeSettingModal()">
                            <vc:i18n name="添加" namespace="passQrcodeSetting"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='名称' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='验证' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='审核' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='失效时间' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='说明' namespace='passQrcodeSetting'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="passQrcodeSetting in passQrcodeSettingInfo.passQrcodeSettings">
                                <td class="text-center">{{passQrcodeSetting.qrcodeName}}</td>
                                <td class="text-center">{{passQrcodeSetting.smsValidate == 'ON'?'是':'否'}}</td>
                                <td class="text-center">{{passQrcodeSetting.audit == 'ON'?'是':'否'}}</td>
                                <td class="text-center">{{passQrcodeSetting.expired}}分钟</td>
                                <td class="text-center">{{passQrcodeSetting.state == 'ON'?'启用':'停用'}}</td>
                                <td class="text-center">{{passQrcodeSetting.createTime}}</td>
                                <td class="text-center">{{passQrcodeSetting.remark || '-'}}</td>

                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="showQrCode(passQrcodeSetting)">
                                            <vc:i18n name='二维码'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditPassQrcodeSettingModel(passQrcodeSetting)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeletePassQrcodeSettingModel(passQrcodeSetting)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>



    <vc:create path="accessControl/addPassQrcodeSetting" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="accessControl/editPassQrcodeSetting"></vc:create>
    <vc:create path="accessControl/deletePassQrcodeSetting"></vc:create>
    <vc:create path="common/viewQrCode"></vc:create>

</div>
