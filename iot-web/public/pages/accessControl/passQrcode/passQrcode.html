<div>
    <div class="row">
        <div class="col-md-1 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview ">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree " v-for="(item, index) in passQrcodeInfo.states"
                            :key="index" @click="_switchState(item)"
                            :class="{'vc-node-selected':passQrcodeInfo.conditions.state == item.statusCd}">
                            {{item.name}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-11">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入名称','passQrcode')"
                                            v-model="passQrcodeInfo.conditions.personName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入手机号','passQrcode')"
                                            v-model="passQrcodeInfo.conditions.personTel" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入开始时间','passQrcode')"
                                            v-model="passQrcodeInfo.conditions.queryStartTime"
                                            class=" form-control queryStartTime">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入结束时间','passQrcode')"
                                            v-model="passQrcodeInfo.conditions.queryEndTime"
                                            class=" form-control queryEndTime">
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryPassQrcodeMethod()">
                                        <vc:i18n name="查询"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="通行码" namespace="passQrcode"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='编号' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='名称' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='手机号' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='openId' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        
                                        <th class="text-center">
                                            <vc:i18n name='刷新时间' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='状态' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='审核说明' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='申请时间' namespace='passQrcode'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="passQrcode in passQrcodeInfo.passQrcodes">
                                        <td class="text-center">{{passQrcode.pqId}}</td>
                                        <td class="text-center">{{passQrcode.personName}}</td>
                                        <td class="text-center">{{passQrcode.personTel}}</td>
                                        <td class="text-center">{{passQrcode.openId}}</td>
                                      
                                        <td class="text-center">{{passQrcode.qrcodeTime}}</td>
                                        <td class="text-center">{{passQrcode.stateName}}</td>
                                        <td class="text-center">{{passQrcode.remark||'-'}}</td>
                                        <td class="text-center">{{passQrcode.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_viewPasscode(passQrcode)">
                                                    <vc:i18n name='通行码'></vc:i18n>
                                                </button>
                                            </div>
                                            <div class="btn-group" v-if="passQrcode.state == 'W'">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openAuditPassQrcodeModel(passQrcode)">
                                                    <vc:i18n name='审核'></vc:i18n>
                                                </button>
                                            </div>
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeletePassQrcodeModel(passQrcode)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="accessControl/auditPassQrcode"></vc:create>
    <vc:create path="accessControl/deletePassQrcode"></vc:create>
    <vc:create path="common/viewQrCode"></vc:create>

</div>
