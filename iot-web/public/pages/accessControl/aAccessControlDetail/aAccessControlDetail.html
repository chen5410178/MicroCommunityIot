<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            门禁详情
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁ID：" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.machineId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁编码：" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.machineCode}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁名称：" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.machineName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="厂家名称:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.implBeanName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="IP:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.machineIp || '-'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="Mac:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.machineMac || '-'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="方向:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.direction == '3306'?'进':'出'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="位置:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{aAccessControlDetailInfo.locationName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="是否在线:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{aAccessControlDetailInfo.stateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="心跳时间:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{aAccessControlDetailInfo.heartbeatTime}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="添加时间:" namespace="aAccessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{aAccessControlDetailInfo.createTime}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:aAccessControlDetailInfo._currentTab == 'aAccessControlDetailFace'}" v-on:click="changeTab('aAccessControlDetailFace')">
                    <vc:i18n name="门禁人员" namespace="aAccessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:aAccessControlDetailInfo._currentTab == 'aAccessControlDetailFloor'}" v-on:click="changeTab('aAccessControlDetailFloor')">
                    <vc:i18n name="楼栋授权" namespace="aAccessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:aAccessControlDetailInfo._currentTab == 'aAccessControlDetailOrg'}" v-on:click="changeTab('aAccessControlDetailOrg')">
                    <vc:i18n name="部门授权" namespace="aAccessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:aAccessControlDetailInfo._currentTab == 'aAccessControlDetailLog'}" v-on:click="changeTab('aAccessControlDetailLog')">
                    <vc:i18n name="下发日志" namespace="aAccessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:aAccessControlDetailInfo._currentTab == 'aAccessControlDetailInout'}" v-on:click="changeTab('aAccessControlDetailInout')">
                    <vc:i18n name="进出记录" namespace="aAccessControlDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>
    <div v-if="aAccessControlDetailInfo._currentTab == 'aAccessControlDetailFace'">
        <vc:create path="accessControl/aAccessControlDetailFace"></vc:create>
    </div>

    <div v-if="aAccessControlDetailInfo._currentTab == 'aAccessControlDetailFloor'">
        <vc:create path="accessControl/aAccessControlDetailFloor"></vc:create>
    </div>

    <div v-if="aAccessControlDetailInfo._currentTab == 'aAccessControlDetailOrg'">
        <vc:create path="accessControl/aAccessControlDetailOrg"></vc:create>
    </div>

    <div v-if="aAccessControlDetailInfo._currentTab == 'aAccessControlDetailLog'">
        <vc:create path="accessControl/aAccessControlDetailLog"></vc:create>
    </div>
               
    <div v-if="aAccessControlDetailInfo._currentTab == 'aAccessControlDetailInout'">
        <vc:create path="accessControl/aAccessControlDetailInout"></vc:create>
    </div> 
</div>
