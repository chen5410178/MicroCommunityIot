<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            拜访信息
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁ID：" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.machineId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁编码：" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.machineCode}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="门禁名称：" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.machineName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="厂家名称:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.implBeanName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="IP:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.machineIp || '-'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="Mac:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.machineMac || '-'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="方向:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.direction == '3306'?'进':'出'}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="位置:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{accessControlDetailInfo.locationName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="是否在线:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{accessControlDetailInfo.stateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="心跳时间:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{accessControlDetailInfo.heartbeatTime}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="添加时间:" namespace="accessControlDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{accessControlDetailInfo.createTime}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlFace'}" v-on:click="changeTab('accessControlDetailAccessControlFace')">
                    <vc:i18n name="门禁人员" namespace="accessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlFloor'}" v-on:click="changeTab('accessControlDetailAccessControlFloor')">
                    <vc:i18n name="楼栋授权" namespace="accessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlOrg'}" v-on:click="changeTab('accessControlDetailAccessControlOrg')">
                    <vc:i18n name="部门授权" namespace="accessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlLog'}" v-on:click="changeTab('accessControlDetailAccessControlLog')">
                    <vc:i18n name="下发日志" namespace="accessControlDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlInout'}" v-on:click="changeTab('accessControlDetailAccessControlInout')">
                    <vc:i18n name="进出记录" namespace="accessControlDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>

    <div v-if="accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlFace'">
        <vc:create path="property/accessControlDetailAccessControlFace"></vc:create>
    </div>
    <div v-if="accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlFloor'">
        <vc:create path="property/accessControlDetailAccessControlFloor"></vc:create>
    </div>
    <div v-if="accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlOrg'">
        <vc:create path="property/accessControlDetailAccessControlOrg"></vc:create>
    </div>
    <div v-if="accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlLog'">
        <vc:create path="property/accessControlDetailAccessControlLog"></vc:create>
    </div>
    <div v-if="accessControlDetailInfo._currentTab == 'accessControlDetailAccessControlInout'">
        <vc:create path="property/accessControlDetailAccessControlInout"></vc:create>
    </div>
</div>
