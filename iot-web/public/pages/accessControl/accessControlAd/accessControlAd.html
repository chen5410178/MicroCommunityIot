<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择广告名称','accessControlAd')"
                            v-model="accessControlAdInfo.conditions.adName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-1">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryAccessControlAdMethod()">
                        <vc:i18n name="查询"></vc:i18n>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="广告" namespace="accessControlAd"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddAccessControlAdModal()">
                    <vc:i18n name="添加" namespace="accessControlAd"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">

            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                       
                        <th class="text-center">
                            <vc:i18n name='广告名称' namespace='accessControlAd'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='状态' namespace='accessControlAd'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='广告类型' namespace='accessControlAd'></vc:i18n>
                        </th>
                        <!-- <th class="text-center">
                            <vc:i18n name='广告地址' namespace='accessControlAd'></vc:i18n>
                        </th> -->
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='accessControlAd'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='创建时间' namespace='accessControlAd'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="accessControlAd in accessControlAdInfo.accessControlAds">
                        <td class="text-center">{{accessControlAd.adName}}</td>
                        <td class="text-center">{{accessControlAd.state == 'Y'?'在用':'停用'}}</td>
                        <td class="text-center">{{accessControlAd.adType == 'IMG'?'图像':'视频'}}</td>
                        <!-- <td class="text-center">{{accessControlAd.url}}</td> -->
                        <td class="text-center">{{accessControlAd.remark}}</td>
                        <td class="text-center">{{accessControlAd.createTime}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openEditAccessControlAdModel(accessControlAd)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteAccessControlAdModel(accessControlAd)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>



    <vc:create path="accessControl/addAccessControlAd" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="accessControl/editAccessControlAd"></vc:create>
    <vc:create path="accessControl/deleteAccessControlAd"></vc:create>

</div>
