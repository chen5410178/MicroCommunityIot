<div>
    <div class="row">
        <div class="col-md-1 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview ">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree "
                            v-for="(item,index) in accessControlLogInfo.accessControls" :key="index"
                            @click="swatchAccessControl(item)"
                            :class="{'vc-node-selected':accessControlLogInfo.conditions.machineId == item.machineId}">
                            {{item.machineName}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-11">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入用户名','accessControlLog')"
                                            v-model="accessControlLogInfo.conditions.userName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择日志动作','accessControlLog')"
                                            v-model="accessControlLogInfo.conditions.logAction" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择状态','accessControlLog')"
                                            v-model="accessControlLogInfo.conditions.state" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryAccessControlLogMethod()">
                                        <i class="glyphicon glyphicon-search"></i> <span>
                                            <vc:i18n name="查询"></vc:i18n>
                                        </span>
                                    </button>
                                </div>
                            </div>


                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="门禁日志" namespace="accessControlLog"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">

                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='编号' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='设备名称' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='设备编码' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='日志动作' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='用户ID' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='用户名称' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='状态' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='下发时间' namespace='accessControlLog'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="accessControlLog in accessControlLogInfo.accessControlLogs">
                                        <td class="text-center">{{accessControlLog.logId}}</td>
                                        <td class="text-center">{{accessControlLog.machineName}}</td>
                                        <td class="text-center">{{accessControlLog.machineCode}}</td>
                                        <td class="text-center">{{accessControlLog.logAction}}</td>
                                        <td class="text-center">{{accessControlLog.userId}}</td>
                                        <td class="text-center">{{accessControlLog.userName}}</td>
                                        <td class="text-center">{{accessControlLog.stateName}}</td>
                                        <td class="text-center">{{accessControlLog.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openViewAccessControlLogModel(accessControlLog)">
                                                    <vc:i18n name='报文'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>

                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <vc:create path="accessControl/showAccessControlLog"></vc:create>

</div>
