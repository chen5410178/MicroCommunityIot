<div>
    <div class="flex justify-start">
        <div style="padding-right:0px;width: 200px;" >
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview ">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree "
                            v-for="(item,index) in accessControlAdRelInfo.ads" :key="index"
                            @click="_swatchAd(item)"
                            :class="{'vc-node-selected':accessControlAdRelInfo.conditions.adId == item.adId}">
                            {{item.adName}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="margin-top-xs margin-left-sm" style="flex-grow: 1;">

            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件" namespace="accessControlAdRel"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写门禁名称','room')"
                                    class="form-control form-control-sm"
                                    v-model="accessControlAdRelInfo.conditions.machineName">
                            </div>
                        </div>

                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryAccessControlAdRelMethod()">
                                <vc:i18n name="查询" namespace="accessControlAdRel"></vc:i18n>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="广告门禁" namespace="accessControlFace"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAuthorizeAccessControlModel()">
                            授权门禁
                        </button>
                    </div>
                </div>
                <div class="ibox-content border-radius ">
                    <div class="">
                        <table class="table table-stripped table-condensed" data-page-size="10">
                            <thead>
                                <tr>
                                    <th data-hide="phone" class="text-center ">
                                        <vc:i18n name="组织" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                    <th data-hide="phone" class="text-center ">
                                        <vc:i18n name="门禁名称" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <vc:i18n name="门禁编号" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <vc:i18n name="人员数" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <vc:i18n name="授权时间" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                    <th class="text-center ">
                                        <vc:i18n name="操作" namespace="accessControlAdRel"></vc:i18n>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="accessControl in accessControlAdRelInfo.accessControls">
                                    <!-- <td>{{room.roomId}}</td> -->
                                    <td class="text-center">
                                        {{accessControl.orgName}}
                                    </td>
                                    <td class="text-center">
                                        {{accessControl.machineName}}
                                    </td>
                                    <td class="text-center">
                                        {{accessControl.machineCode}}
                                    </td>
                                    <td class="text-center">
                                        {{accessControl.personCount}}
                                    </td>
                                    <td class="text-center">
                                        {{accessControl.createTime}}
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs"
                                                v-on:click="_openDelAccessControlAdRelModel(accessControl)">
                                                <vc:i18n name="取消授权" namespace="accessControlAdRel"></vc:i18n>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row margin-top-xs">
                        <div class="col-sm-7">

                        </div>
                        <div class="col-sm-5 float-right">
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- 删除员工权限 -->
    <!-- <vc:create path="accessControl/deleteAccessControlAdRel"></vc:create>

    <vc:create path="accessControl/authorizeAccessControl"></vc:create> -->
</div>
