<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="门锁厂家" namespace="lockMachineFactorySpecManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm" v-on:click="vc.goBack()">
                            <vc:i18n name="返回" namespace="lockMachineFactorySpecManage"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddLockMachineFactorySpecModal()">
                            <vc:i18n name="添加" namespace="lockMachineFactorySpecManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='规格ID' namespace='lockMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='规格名称' namespace='lockMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='规格编号' namespace='lockMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='描述' namespace='lockMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='lockMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="lockMachineFactorySpec in lockMachineFactorySpecManageInfo.lockMachineFactorySpecs">
                                <td class="text-center">{{lockMachineFactorySpec.specId}}</td>
                                <td class="text-center">{{lockMachineFactorySpec.specName}}</td>
                                <td class="text-center">{{lockMachineFactorySpec.specCd}}</td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(lockMachineFactorySpec.remark, '描述')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">{{lockMachineFactorySpec.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                                v-on:click="_openDeleteLockMachineFactorySpecModel(lockMachineFactorySpec)">
                                            <span><vc:i18n name='删除'></vc:i18n></span></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="lock/addLockMachineFactorySpec" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lock/deleteLockMachineFactorySpec"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
