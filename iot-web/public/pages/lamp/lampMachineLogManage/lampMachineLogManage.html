<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <select class="custom-select" v-model="lampMachineLogManageInfo.conditions.machineId">
                                    <option selected value="">{{vc.i18n('请选择路灯设备','lampMachineLogManageInfo')}}</option>
                                    <option v-for="(item, index) in lampMachineLogManageInfo.lampMachineList" :key="index" :value="item.machineId">
                                        {{item.machineName}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <select class="custom-select" v-model="lampMachineLogManageInfo.conditions.logAction">
                                    <option selected  value="">{{vc.i18n('请选择日志动作','lampMachineLogManageInfo')}}</option>
                                    <option v-for="(item, index) in lampMachineLogManageInfo.operateTypes" :key="index" :value="item.statusCd">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <select class="custom-select" v-model="lampMachineLogManageInfo.conditions.state">
                                <option selected value="">{{vc.i18n('请选择请求状态','lampMachineLogManageInfo')}}</option>
                                <option v-for="(item, index) in lampMachineLogManageInfo.reqStateList" :key="index" :value="item.statusCd">
                                    {{item.name}}
                                </option>
                            </select>
                        </div>
                      
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入开始时间','lampMachineLogManageInfo')"
                                    v-model="lampMachineLogManageInfo.conditions.queryStartTime"
                                    class=" form-control queryStartTime">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入结束时间','lampMachineLogManageInfo')"
                                    v-model="lampMachineLogManageInfo.conditions.queryEndTime"
                                    class=" form-control queryEndTime">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryLampMachineLogMethod()">
                                <vc:i18n name="查询" namespace="lampMachineLogManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_resetLampMachineLogMethod()">
                                <vc:i18n name="重置" namespace="lampMachineLogManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                      
                        <div class="col-sm-2">
                            <div class="form-group">
                                <select class="custom-select" v-model="lampMachineLogManageInfo.conditions.personId">
                                    <option selected  value="">{{vc.i18n('请选择操作人员','lampMachineLogManageInfo')}}</option>
                                    <option v-for="(item, index) in lampMachineLogManageInfo.operatePersonList" :key="index" :value="item.userId">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="下发设备日志" namespace="lampMachineLogManage"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='设备名称' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='日志动作' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作人' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作状态' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作时间' namespace='lampMachineLogManage'></vc:i18n>
                                </th>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="lampMachineLog in lampMachineLogManageInfo.lampMachineLogs">
                                <td class="text-center">{{lampMachineLog.logId}}</td>
                                <td class="text-center">{{lampMachineLog.machineName}}</td>
                                <td class="text-center">{{lampMachineLog.logActionName}}</td>
                                <td class="text-center">{{lampMachineLog.personName}}</td>
                                <td class="text-center">{{lampMachineLog.stateName}}</td>
                                <td class="text-center">{{lampMachineLog.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openViewLampMachineLogModel(lampMachineLog)">
                                            <vc:i18n name='报文'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="lamp/showLampMachineLog"></vc:create>
</div>
