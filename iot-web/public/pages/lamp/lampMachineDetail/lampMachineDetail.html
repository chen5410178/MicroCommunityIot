<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            路灯信息
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="路灯ID：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="路灯名称：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="路灯编号：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineCode}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="厂家名称:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.factoryName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="位置:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.locationName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="路灯状态:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.stateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="在线状态:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.isOnlineStateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="心跳时间:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.heartbeatTime}}</label>
                        </div>
                    </div>
                <div class="row">
                </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="添加时间:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.createTime}}</label>
                        </div>
                    </div>
                </div>
                <div v-for="(item,index) in machineDetailInfo.liftMachineParamDtoList">
                    <div class="row" v-if="index % 4 == 0">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label class="col-form-label">{{item.specName}}：</label>
                                <label class="">{{item.value}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.liftMachineParamDtoList.length-1">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.liftMachineParamDtoList[index+1].specName}}：</label>
                                <label class="">{{machineDetailInfo.liftMachineParamDtoList[index+1].value}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.liftMachineParamDtoList.length-2">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.liftMachineParamDtoList[index+2].specName}}：</label>
                                <label class="">{{machineDetailInfo.liftMachineParamDtoList[index+2].value}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.liftMachineParamDtoList.length-3">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.liftMachineParamDtoList[index+3].specName}}：</label>
                                <label class="">{{machineDetailInfo.liftMachineParamDtoList[index+3].value}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:machineDetailInfo._currentTab == 'machineDetailLampOperation'}" v-on:click="changeTab('machineDetailLampOperation')">
                    <vc:i18n name="操作日志" namespace="machineDetail"></vc:i18n>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:machineDetailInfo._currentTab == 'machineDetailLampLog'}" v-on:click="changeTab('machineDetailLampLog')">
                    <vc:i18n name="下发日志" namespace="machineDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>
    <div v-if="machineDetailInfo._currentTab == 'machineDetailLampOperation'">
        <vc:create path="property/machineDetailLampOperation"></vc:create>
    </div>
    <div v-if="machineDetailInfo._currentTab == 'machineDetailLampLog'">
        <vc:create path="property/machineDetailLampLog"></vc:create>
    </div>
</div>
