<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <select class="custom-select" v-model="telTtsInfo.conditions.ttsType">
                        <option selected value="">
                            请选择类型
                        </option>
                        <option value="OWE_FEE">欠费催缴</option>
                    </select>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择语音名称','telTts')"
                            v-model="telTtsInfo.conditions.ttsName" class=" form-control">
                    </div>
                </div>

                <div class="col-sm-1">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryTelTtsMethod()">
                        <i class="glyphicon glyphicon-search"></i> <span>
                            <vc:i18n name="查询"></vc:i18n>
                        </span>
                    </button>
                </div>
            </div>


        </div>
    </div>
    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="话机语音" namespace="telTts"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddTelTtsModal()">
                    <vc:i18n name="添加" namespace="telTts"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">

            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='编号' namespace='telTts'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='类型' namespace='telTts'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='语音名称' namespace='telTts'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='telTts'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='创建时间' namespace='telTts'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="telTts in telTtsInfo.telTtss">
                        <td class="text-center">{{telTts.ttId}}</td>
                        <td class="text-center">{{telTts.ttsType == 'OWE_FEE'?'欠费催缴':'其他'}}</td>
                        <td class="text-center">{{telTts.ttsName}}</td>
                        <td class="text-center">{{telTts.remark}}</td>
                        <td class="text-center">{{telTts.createTime}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs" v-on:click="_openEditTelTtsModel(telTts)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs" v-on:click="_openDeleteTelTtsModel(telTts)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>
    </div>
    <vc:create path="lamp/addTelTts" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lamp/editTelTts"></vc:create>
    <vc:create path="lamp/deleteTelTts"></vc:create>

</div>
