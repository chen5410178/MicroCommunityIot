<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="路灯厂家" namespace="lampMachineFactorySpecManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm"
                            v-on:click="vc.goBack()">
                            <vc:i18n name="返回" namespace="lampMachineFactorySpecManage"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddLampMachineFactorySpecModal()">
                            <vc:i18n name="添加" namespace="lampMachineFactorySpecManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='规格ID' namespace='lampMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='规格名称' namespace='lampMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='描述' namespace='lampMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="lampMachineFactorySpec in lampMachineFactorySpecManageInfo.lampMachineFactorySpecs">
                                <td class="text-center">{{lampMachineFactorySpec.specId}}</td>
                                <td class="text-center">{{lampMachineFactorySpec.specName}}</td>
                                <td class="text-center">{{lampMachineFactorySpec.remark}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteLampMachineFactorySpecModel(lampMachineFactorySpec)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="lamp/addLampMachineFactorySpec" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lamp/deleteLampMachineFactorySpec"></vc:create>

</div>
