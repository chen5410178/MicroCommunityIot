<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>
                    <vc:i18n name="设置" namespace="addLampMachineOpenClose"></vc:i18n>
                </h5>
                <div class="ibox-tools" style="top:10px;">
                    <button type="button" class="btn btn-white btn-sm" v-on:click="vc.goBack()">
                        <i class="fa fa-close"></i>返回
                    </button>
                </div>
            </div>
            <div class="ibox-content">
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                        <vc:i18n name='类型' namespace='addLampMachineOpenClose'></vc:i18n>
                    </label>
                    <div class="col-sm-10">
                        <select class="custom-select" v-model="addLampMachineOpenCloseInfo.type">
                            <option selected disabled value="">{{vc.i18n('必填，请选择类型','addLampMachineOpenClose')}}</option>
                            <option v-for="(item, index) in typeList" :key="index" :value="item.statusCd">
                                {{item.name}}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                        <vc:i18n name='小时' namespace='addLampMachineOpenClose'></vc:i18n>
                    </label>
                    <div class="col-sm-10">
                        <input v-model="addLampMachineOpenCloseInfo.hours" type="number"
                            :placeholder="vc.i18n('必填，请填写小时','addLampMachineOpenClose')" class="form-control">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                        <vc:i18n name='分钟' namespace='addLampMachineOpenClose'></vc:i18n>
                    </label>
                    <div class="col-sm-10">
                        <input v-model="addLampMachineOpenCloseInfo.min" type="number"
                            :placeholder="vc.i18n('必填，请填写分钟','addLampMachineOpenClose')" class="form-control">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">
                        <vc:i18n name='路灯设备' namespace='addLampMachineOpenClose'></vc:i18n>
                    </label>
                    <div class="col-sm-9">
                        <textarea v-model="lampNameOnlyView" type="text" disabled rows="10"
                            :placeholder="vc.i18n('必填，请选择设备','addLampMachineOpenClose')" class="form-control">
                        </textarea>
                    </div>
                    <div class="col-sm-1">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="selectLampMachine()">选择</button>
                    </div>
                </div>
                <div class="ibox-content">
                    <button class="btn btn-primary float-right" type="button" v-on:click="saveLampMachineOpenCloseInfo()">
                        <i class="fa fa-check"></i>&nbsp;
                        <vc:i18n name="保存"></vc:i18n>
                    </button>
                    <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" @click="vc.goBack()">
                        <vc:i18n name="取消"></vc:i18n>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
    <vc:create path="lamp/chooseLampMachine" emitChooseLampMachine="" emitLoadData=""></vc:create>
