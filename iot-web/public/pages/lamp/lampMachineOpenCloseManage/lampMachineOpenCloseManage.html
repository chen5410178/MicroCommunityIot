<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3" >
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入路灯编号','lampMachineOpenCloseManage')"
                                    v-model="lampMachineOpenCloseManageInfo.conditions.machineCode" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3" >
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入路灯名称','lampMachineOpenCloseManage')"
                                    v-model="lampMachineOpenCloseManageInfo.conditions.machineName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3" >
                            <div class="form-group">
                                <select class="custom-select" v-model="lampMachineOpenCloseManageInfo.conditions.type">
                                    <option selected disabled value="">{{vc.i18n('请选择类型','lampMachineOpenCloseManage')}}</option>
                                    <option v-for="(item, index) in lampMachineOpenCloseManageInfo.typeList" :key="index" :value="item.statusCd">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryLampMachineOpenCloseMethod()">
                                <vc:i18n name="查询"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_resetLampMachineOpenCloseMethod()">
                                <vc:i18n name="重置"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="设置路灯开关时间" namespace="lampMachineOpenCloseManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm"
                            v-on:click="vc.goBack()">
                            <vc:i18n name="返回" namespace="liftMachineFactorySpecManage"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddLampMachineOpenCloseModal()">
                            <vc:i18n name="设置" namespace="lampMachineOpenCloseManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='路灯编号' namespace='lampMachineOpenCloseManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='路灯名称' namespace='lampMachineOpenCloseManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='类型' namespace='lampMachineOpenCloseManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='小时' namespace='lampMachineOpenCloseManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='分钟' namespace='lampMachineOpenCloseManage'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="lampMachineOpenClose in lampMachineOpenCloseManageInfo.lampMachineOpenCloses">
                                <td class="text-center">{{lampMachineOpenClose.machineCode}}</td>
                                <td class="text-center">{{lampMachineOpenClose.machineName}}</td>
                                <td class="text-center">{{lampMachineOpenClose.typeName}}</td>
                                <td class="text-center">{{lampMachineOpenClose.hours}}</td>
                                <td class="text-center">{{lampMachineOpenClose.min}}</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
</div>
