<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5><span>
                    <vc:i18n name="查询条件"></vc:i18n>
                </span></h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择设备编码','telMachine')"
                            v-model="telMachineInfo.conditions.machineCode" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择设备名称','telMachine')"
                            v-model="telMachineInfo.conditions.machineName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-1">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryTelMachineMethod()">
                        <i class="glyphicon glyphicon-search"></i> <span>
                            <vc:i18n name="查询"></vc:i18n>
                        </span>
                    </button>
                </div>
            </div>



        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="话机信息" namespace="telMachine"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddTelMachineModal()">
                    <vc:i18n name="添加话机" namespace="telMachine"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">

            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='编号' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备编码' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备名称' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备IP' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备端口' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='厂家' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='创建时间' namespace='telMachine'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="telMachine in telMachineInfo.telMachines">
                        <td class="text-center">{{telMachine.machineId}}</td>
                        <td class="text-center">{{telMachine.machineCode}}</td>
                        <td class="text-center">{{telMachine.machineName}}</td>
                        <td class="text-center">{{telMachine.machineIp}}</td>
                        <td class="text-center">{{telMachine.machinePort}}</td>
                        <td class="text-center">{{telMachine.implBean == '10010'?'松饼':'其他'}}</td>
                        <td class="text-center">{{telMachine.createTime}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    @click="_openEditTelMachineModel(telMachine)">
                                        <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteTelMachineModel(telMachine)">
                                        <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>


    <vc:create path="lamp/addTelMachine"></vc:create>
    <vc:create path="lamp/editTelMachine"></vc:create>
    <vc:create path="lamp/deleteTelMachine"></vc:create>


</div>
