<div>
    <div class="row">
        <div class="col-md-2 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview attendance-staff">
                    <ul class="list-group text-center border-radius">
                        <!--  -->
                        <li class="list-group-item node-orgTree " v-for="(item,index) in dtSceneInfo.communitys"
                            :key="index" @click="swatchCommunity(item)"
                            :class="{'vc-node-selected':dtSceneInfo.conditions.communityId == item.communityId}">
                            {{item.name}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择场景名称','dtScene')"
                                            v-model="dtSceneInfo.conditions.sceneName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <select class="custom-select" v-model="dtSceneInfo.conditions.state">
                                            <option selected disabled value="">{{vc.i18n('必填，请选择状态','dtScene')}}
                                            </option>
                                            <option value="Y">{{vc.i18n('启用中','dtScene')}}</option>
                                            <option value="N">{{vc.i18n('停用中','dtScene')}}</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryDtSceneMethod()">
                                        <vc:i18n name="查询"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="场景信息" namespace="dtScene"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_openAddDtSceneModal()">
                                    <vc:i18n name="添加" namespace="dtScene"></vc:i18n>
                                </button>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='编号' namespace='dtScene'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='场景名称' namespace='dtScene'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='状态' namespace='dtScene'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='场景顺序' namespace='dtScene'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='创建时间' namespace='dtScene'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="dtScene in dtSceneInfo.dtScenes">
                                        <td class="text-center">{{dtScene.sceneId}}</td>
                                        <td class="text-center">{{dtScene.sceneName}}</td>
                                        <td class="text-center">{{dtScene.state}}</td>
                                        <td class="text-center">{{dtScene.seq}}</td>
                                        <td class="text-center">{{dtScene.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openEditDtSceneModel(dtScene)">
                                                    <vc:i18n name='修改'></vc:i18n>
                                                </button>
                                            </div>
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeleteDtSceneModel(dtScene)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="admin/addDtScene" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="admin/editDtScene"></vc:create>
    <vc:create path="admin/deleteDtScene"></vc:create>

</div>
