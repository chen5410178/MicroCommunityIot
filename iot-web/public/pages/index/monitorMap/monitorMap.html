<div>
    <div id="wlMap"></div>
    <div class="map-m-left">
        <div class="margin-top-xs">
            <div>日期</div>
            <div class="margin-top-xs">
                <input type="text" :placeholder="vc.i18n('选择日期','monitorMap')"
                    v-model="monitorMapInfo.queryDate" class=" form-control queryDate ">
            </div>
        </div>
        <div class="margin-top-xs">
            <div>人员</div>
            <div class="margin-top-xs">
                <input type="text" :placeholder="vc.i18n('人员名称','monitorMap')"
                    v-model="monitorMapInfo.personName" class=" form-control ">
            </div>
            <div class="margin-top">
               <div class="map-m-staff" :class="{'map-m-staff-active':monitorMapInfo.personId == item.personId}" @click="_changePerson(item)"
               v-for="(item,index) in monitorMapInfo.personFaces" :key="index">{{item.personName}}({{item.personLink}})</div>
            </div>
        </div>
    </div>

    <div class="map-m-right" v-if="monitorMapInfo.dispatchLogs.length>0">
        <div>布控告警</div>
        <div class="item border-radius flex justify-start" v-for="(item,index) in monitorMapInfo.dispatchLogs" :key="index">
            <div class="item-img">
                <img class="border-radius"
                    :src="item.faceUrl" @click="_viewAlterImage(item.faceUrl)"/>
            </div>
            <div >
                <div class="item-title">{{item.personName}}【{{item.score}}】</div>
                <div class="margin-left-xs">{{item.createTime}}</div>
                <div class="margin-left-xs" >{{item.remark}}</div>
            </div>

        </div>
    </div>

    <vc:create path="monitor/playMonitorVideo"></vc:create>
    <vc:create path="common/viewImage"></vc:create>

</div>
