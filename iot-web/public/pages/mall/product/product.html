<div class="coupon-market">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-5 padding-lr-0 margin-left-sm">
            <input type="text" class="form-control" placeholder="请输入商品名称" @keyup.enter="_doSearch()" v-model="conditions.prodName" />
        </div>
        <div class="col-md-1 padding-lr-0 margin-left-sm">
            <button type="button" class="form-control btn btn-primary" @click="_doSearch()">
                <span>
                    <vc:i18n name="查询"></vc:i18n>
                </span>
            </button>
        </div>
        <div class="col-md-1 padding-lr-0 margin-left-sm">
            <button type="button" class="form-control btn btn-primary" @click="_doReset()">
                <span>
                    <vc:i18n name="重置"></vc:i18n>
                </span>
            </button>
        </div>
    </div>
    <div class="row margin-top-lg margin-bottom-lg">
        <div class="col-md-3">提示:本设备由三方平台提供 ，安装部署后可以到开发者账户关闭。</div>
       <!-- <div class="col-md-5 padding-lr-0 margin-left-sm">
            <a v-for="(item, index) in productCategorys" :key="index" :value="item.statusCd" href="javascript:void(0)" @click="_queryProduct(1,10)">
                {{item.name}}
            </a>
        </div>-->
        <ul class="flex flex-start" style="color: #007bff;">
            <li style="cursor: pointer;" v-for="(item, index) in productCategorys" :key="index" href="javascript:void(0)" @click="_queryProductByCategoryId(item.statusCd)">
                &emsp;{{item.name}}
            </li>
        </ul>
    </div>
    <div class="vc-line"></div>
    <div class="row " style="margin:15px auto">
        <div v-for="(item,index) in productInfo.products" class="coupon margin padding-xs" :key="index">
            <!-- <img :src="item.url" class="border-radius"/> -->
            <a target="_blank" :href="domainName + prodDetailUri + item.productId">
                <img :src="item.coverPhoto" class="border-radius" style="width: 215px; height: 120px" />
            </a>
            <div class="title padding-xs">
                <a target="_blank" :href="domainName + prodDetailUri + item.productId">
                    <span style="display: inline-block; width: 200px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{item.prodName}}</span>
                </a>
            </div>
            <div class="row padding-xs">
                <div class="col-md-8">
                    售价：<span style="color: #ff0036">￥{{item.price}}</span>
                </div>
                <div class="col-md-4 text-right">
                    <a target="_blank" style="color: #ff0036" :href="domainName + prodDetailUri + item.productId">购买</a>
                </div>
            </div>
        </div>
    </div>
    <div v-if="productInfo.records > 1">
        <vc:create path="frame/pagination"></vc:create>
    </div>
</div>
