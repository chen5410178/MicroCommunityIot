<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择模板名称','eventTemplateManage')"
                                    v-model="eventTemplateManageInfo.conditions.templateName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="eventTemplateManageInfo.conditions.eventWay">
                                    <option selected disabled value="">{{vc.i18n('请选择通知方式','eventTemplateManage')}}</option>
                                    <option v-for="(item, index) in eventWayList" :key="index" :value="item.statusCd">
                                        {{item.name}}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryEventTemplateMethod()">
                                <vc:i18n name="查询" namespace="eventTemplateManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetEventTemplateMethod()">
                                <vc:i18n name="重置" namespace="eventTemplateManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="事件模板" namespace="eventTemplateManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddEventTemplateModal()">
                            <vc:i18n name="添加" namespace="eventTemplateManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='eventTemplateManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='模板名称' namespace='eventTemplateManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='通知方式' namespace='eventTemplateManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='eventTemplateManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='eventTemplateManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="eventTemplate in eventTemplateManageInfo.eventTemplates">
                                <td class="text-center">{{eventTemplate.templateId}}</td>
                                <td class="text-center">{{eventTemplate.templateName}}</td>
                                <td class="text-center">{{eventTemplate.eventWayName}}</td>
                                <td class="text-center">{{eventTemplate.createTime}}</td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(eventTemplate.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditEventTemplateModel(eventTemplate)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteEventTemplateModel(eventTemplate)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="event/addEventTemplate" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="event/editEventTemplate"></vc:create>
    <vc:create path="event/deleteEventTemplate"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
