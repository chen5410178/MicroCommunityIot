<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <select class="custom-select" v-model="eventPoolStaffManageInfo.conditions.state">
                                    <option selected disabled value="">{{vc.i18n('请选择事件处理状态','eventPoolStaffManage')}}</option>
                                    <option value="W">{{vc.i18n('待处理','eventPoolStaffManage')}}</option>
                                    <option value="D">{{vc.i18n('处理中','eventPoolStaffManage')}}</option>
                                    <option value="NC">{{vc.i18n('正常处理完成','eventPoolStaffManage')}}</option>
                                    <option value="TC">{{vc.i18n('超时处理完成','eventPoolStaffManage')}}</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryEventPoolStaffMethod()">
                                <vc:i18n name="查询" namespace="eventPoolStaffManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetEventPoolStaffMethod()">
                                <vc:i18n name="重置" namespace="eventPoolStaffManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="事件处理信息" namespace="eventPoolStaffManage"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='事件编号' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='事故原因' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='处理方案' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='处理时长' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='分配时间' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='eventPoolStaffManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="eventPoolStaff in eventPoolStaffManageInfo.eventPoolStaffs">
                                <td class="text-center">{{eventPoolStaff.epsId}}</td>
                                <td class="text-center">{{eventPoolStaff.eventId}}</td>
                                <td class="text-center">{{eventPoolStaff.eventReason}}</td>
                                <td class="text-center">{{eventPoolStaff.eventResult}}</td>
                                <td class="text-center">{{eventPoolStaff.eventHours}}h</td>
                                <td class="text-center">{{eventPoolStaff.createTime}}</td>
                                <td class="text-center">
                                    <label v-if="eventPoolStaff.state === 'W'">{{vc.i18n('待处理','eventPoolStaffManage')}}</label>
                                    <label v-if="eventPoolStaff.state === 'NC'">{{vc.i18n('正常处理完成','eventPoolStaffManage')}}</label>
                                    <label v-if="eventPoolStaff.state === 'TC'">{{vc.i18n('超时处理完成','eventPoolStaffManage')}}</label>
                                    <label v-if="eventPoolStaff.state === 'D'">{{vc.i18n('处理中','eventPoolStaffManage')}}</label>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" v-if="eventPoolStaff.state === 'W'">
                                        <button class="btn-white btn btn-xs" v-on:click="_acceptEvent(eventPoolStaff)">
                                            <vc:i18n name='接受分配'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
</div>
