<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>
                    <vc:i18n name="添加" namespace="addEventStaff"></vc:i18n>
                </h5>
                <div class="ibox-tools" style="top:10px;">
                    <button type="button" class="btn btn-white btn-sm" v-on:click="vc.goBack()">
                        <i class="fa fa-close"></i>返回
                    </button>
                </div>
            </div>
            <div class="ibox-content">
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">
                        <vc:i18n name='物业员工' namespace='addEventStaff'></vc:i18n>
                    </label>
                    <div class="col-sm-9">
                        <textarea v-model="staffNameOnlyView" type="text" disabled rows="10"
                            :placeholder="vc.i18n('必填，请选择员工','addEventStaff')" class="form-control">
                        </textarea>
                    </div>
                    <div class="col-sm-1">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="selectStaff()">选择</button>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">
                        <vc:i18n name='状态' namespace='addEventStaff'></vc:i18n>
                    </label>
                    <div class="col-sm-10">
                        <select class="custom-select" v-model="addEventStaffInfo.state">
                            <option selected disabled value="">{{vc.i18n('必填，请选择状态','addEventStaff')}}</option>
                            <option value="ON">{{vc.i18n('生效','addEventStaff')}}</option>
                            <option value="OFF">{{vc.i18n('失效','addEventStaff')}}</option>
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">
                        <vc:i18n name='备注' namespace='addEventStaff'></vc:i18n>
                    </label>
                    <div class="col-sm-10">
                        <input v-model="addEventStaffInfo.remark" type="text"
                            :placeholder="vc.i18n('选填，请填写备注','addEventStaff')" class="form-control">
                    </div>
                </div>
                <div class="ibox-content">
                    <button class="btn btn-primary float-right" type="button" v-on:click="saveEventStaffInfo()">
                        <i class="fa fa-check"></i>&nbsp;
                        <vc:i18n name="保存"></vc:i18n>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
    <vc:create path="event/chooseStaff" emitChooseStaff="" emitLoadData=""></vc:create>
