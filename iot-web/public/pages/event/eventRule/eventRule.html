<div>
    <div class="row ">
        <div class="col-md-2" style="padding-right:0px">
            <vc:create path="event/eventRuleDiv" callBackListener="eventRule"></vc:create>
        </div>
        <div class="col-md-10 margin-top-xs vc-org-page">
            <div class="bg-white border-radius padding">
                <h5 class="role-title">{{eventRuleInfo.curEventRule.ruleName}}</h5>
                <div class="role-context ">超时时间{{eventRuleInfo.curEventRule.limitTime}}分钟</div>
                <div class="role-context ">{{eventRuleInfo.curEventRule.remark}}</div>
                <div class="line-x margin-top"></div>
                <div class="role-menu flex justify-start">
                    <div class="item margin-right" :class="{'active':eventRuleInfo.tabName == 'eventObject'}"  @click="_changeEventRuleTab('eventObject')">事件对象
                    </div>
                    <div class="item margin-right" :class="{'active':eventRuleInfo.tabName == 'eventStaff'}"  @click="_changeEventRuleTab('eventStaff')">事件通知员工
                    </div>
                </div>
                <div v-if="eventRuleInfo.tabName == 'eventObject' ">
                    <vc:create path="event/eventObject"></vc:create>
                </div>
                <div v-if="eventRuleInfo.tabName == 'eventStaff' ">
                    <vc:create path="event/eventStaff"></vc:create>
                </div>
            </div>
        </div>
    </div>
</div>
