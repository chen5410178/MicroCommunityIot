<div>
    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件" namespace="account"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请输入账户名称','account')"
                            v-model="accountInfo.conditions.acctName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <input type="number" :placeholder="vc.i18n('请输入联系方式','account')"
                            v-model="accountInfo.conditions.link" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryAccountMethod()">
                        <vc:i18n name="查询" namespace="account"></vc:i18n>
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetAccountMethod()">
                        <vc:i18n name="重置" namespace="account"></vc:i18n>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="业主账户" namespace="account"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_prestoreAccount()">
                    <vc:i18n name="预存/维护" namespace="account"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name="账户编号" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="账户名称" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="手机号" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="账户类型" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="账户金额" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="卡号" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="创建时间" namespace="account"></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name="操作" namespace="account"></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="account in accountInfo.accounts">
                        <td class="text-center">{{account.acctId}}</td>
                        <td class="text-center">{{account.acctName}}</td>
                        <td class="text-center">{{account.link}}</td>
                        <td class="text-center">{{account.acctTypeName}}</td>
                        <td class="text-center">{{account.amount}}</td>
                        <td class="text-center">{{account.swipeCardNo}}</td>
                        <td class="text-center">{{account.createTime}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs" v-on:click="_accountDetail(account)">
                                    <vc:i18n name="账户明细" namespace="account"></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs" v-on:click="_doDeleteAccount(account)">
                                    <vc:i18n name="删除" namespace="account"></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>
    <vc:create path="owner/prestoreAccount"></vc:create>
    <vc:create path="owner/deleteAccount"></vc:create> 
</div>
