<div>
    <div class="row">
        <div class="col-md-1 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview ">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree "
                            v-for="(item,index) in liftMachineAcInfo.machines" :key="index"
                            @click="_swatchLiftMachine(item)"
                            :class="{'vc-node-selected':liftMachineAcInfo.conditions.machineId == item.machineId}">
                            {{item.machineName}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-11">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择门禁设备名称','liftMachineAc')"
                                            v-model="liftMachineAcInfo.conditions.acMachineName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择门禁设备编号','liftMachineAc')"
                                            v-model="liftMachineAcInfo.conditions.acMachineCode" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryLiftMachineAcMethod()">
                                        <i class="glyphicon glyphicon-search"></i> <span>
                                            <vc:i18n name="查询"></vc:i18n>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="电梯门禁" namespace="liftMachineAc"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_openAddLiftMachineAcModal()">
                                    <vc:i18n name="添加" namespace="liftMachineAc"></vc:i18n>
                                </button>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='电梯名称' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='电梯编号' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='门禁名称' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='门禁编号' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='门禁类型' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='创建时间' namespace='liftMachineAc'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="liftMachineAc in liftMachineAcInfo.liftMachineAcs">
                                        <td class="text-center">{{liftMachineAc.machineName}}</td>
                                        <td class="text-center">{{liftMachineAc.machineCode}}</td>
                                        <td class="text-center">{{liftMachineAc.acMachineName}}</td>
                                        <td class="text-center">{{liftMachineAc.acMachineCode}}</td>
                                        <td class="text-center">{{liftMachineAc.acType}}</td>
                                        <td class="text-center">{{liftMachineAc.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeleteLiftMachineAcModel(liftMachineAc)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="lift/addLiftMachineAc" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lift/deleteLiftMachineAc"></vc:create>
</div>
