<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入电梯名称','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.machineName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入电梯编号','liftMachineLogManage')"
                                       v-model="liftMachineLogManageInfo.conditions.machineCode" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择日志动作','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.logAction" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择状态','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.state" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择创建时间','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.createTime" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryLiftMachineLogMethod()">
                                <vc:i18n name="查询" namespace="liftMachineLogManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_resetLiftMachineLogMethod()">
                                <vc:i18n name="重置" namespace="liftMachineLogManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入开始时间','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.queryStartTime"
                                    class=" form-control queryStartTime">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入结束时间','liftMachineLogManage')"
                                    v-model="liftMachineLogManageInfo.conditions.queryEndTime"
                                    class=" form-control queryEndTime">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="电梯日志" namespace="liftMachineLogManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='日志ID' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='电梯名称' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='电梯编号' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='日志动作' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作人' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作' namespace='liftMachineLogManage'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="liftMachineLog in liftMachineLogManageInfo.liftMachineLogs">
                                <td class="text-center">{{liftMachineLog.logId}}</td>
                                <td class="text-center">{{liftMachineLog.machineName}}</td>
                                <td class="text-center">{{liftMachineLog.machineCode}}</td>
                                <td class="text-center">{{liftMachineLog.logActionName}}</td>
                                <td class="text-center">{{liftMachineLog.stateName}}</td>
                                <td class="text-center">{{liftMachineLog.personName}}</td>
                                <td class="text-center">{{liftMachineLog.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openViewLiftMachineLogModel(liftMachineLog)">
                                            <vc:i18n name='报文'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="8">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                    <vc:create path="lift/showLiftMachineLog"></vc:create>
                </div>
            </div>
        </div>
    </div>


</div>
