<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="电梯厂家规格信息" namespace="liftMachineFactorySpecManage"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_openAddLiftMachineFactorySpecModal()">
                            <i class="glyphicon glyphicon-plus"></i>
                            <span><vc:i18n name="添加电梯厂家规格" namespace="liftMachineFactorySpecManage"></vc:i18n></span>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny"
                           data-page-size="15"
                    >
                        <thead>
                        <tr>
                            <th class="text-center"><span><vc:i18n name='规格ID'
                                                                   namespace='liftMachineFactorySpecManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='规格名称'
                                                                   namespace='liftMachineFactorySpecManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='描述'
                                                                   namespace='liftMachineFactorySpecManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='操作'></vc:i18n></span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="liftMachineFactorySpec in liftMachineFactorySpecManageInfo.liftMachineFactorySpecs">
                            <td class="text-center">{{liftMachineFactorySpec.specId}}</td>
                            <td class="text-center">{{liftMachineFactorySpec.specName}}</td>
                            <td class="text-center">{{liftMachineFactorySpec.remark}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteLiftMachineFactorySpecModel(liftMachineFactorySpec)">
                                        <span><vc:i18n name='删除'></vc:i18n></span></button>
                                </div>
                            </td>

                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="7">
                                <ul class="pagination float-right"></ul>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>


    <vc:create path="lift/addLiftMachineFactorySpec"
               callBackListener=""
               callBackFunction=""
    ></vc:create>
    <vc:create path="lift/deleteLiftMachineFactorySpec"></vc:create>

</div>
