<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家ID','liftMachineFactoryManage')"
                                    v-model="liftMachineFactoryManageInfo.conditions.factoryId" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家名称','liftMachineFactoryManage')"
                                    v-model="liftMachineFactoryManageInfo.conditions.factoryName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家处理类','liftMachineFactoryManage')"
                                    v-model="liftMachineFactoryManageInfo.conditions.beanImpl" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryLiftMachineFactoryMethod()">
                                <vc:i18n name="查询" namespace="liftMachineFactoryManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_resetLiftMachineFactoryMethod()">
                                <vc:i18n name="重置" namespace="liftMachineFactoryManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="电梯厂家" namespace="liftMachineFactoryManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddLiftMachineFactoryModal()">
                            <vc:i18n name="添加" namespace="liftMachineFactoryManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='厂家ID' namespace='liftMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家名称' namespace='liftMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家处理类' namespace='liftMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='liftMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='liftMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="liftMachineFactory in liftMachineFactoryManageInfo.liftMachineFactorys">
                                <td class="text-center">{{liftMachineFactory.factoryId}}</td>
                                <td class="text-center">{{liftMachineFactory.factoryName}}</td>
                                <td class="text-center">{{liftMachineFactory.beanImpl}}</td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(liftMachineFactory.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">{{liftMachineFactory.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openLiftMachineFactorySpec(liftMachineFactory)">
                                            <vc:i18n name='厂家规格'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditLiftMachineFactoryModel(liftMachineFactory)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteLiftMachineFactoryModel(liftMachineFactory)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>


    <vc:create path="lift/addLiftMachineFactory" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lift/editLiftMachineFactory"></vc:create>
    <vc:create path="lift/deleteLiftMachineFactory"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
