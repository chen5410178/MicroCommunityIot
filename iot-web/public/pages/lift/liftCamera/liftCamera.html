<div>

    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">

            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择相机名称','liftCamera')"
                            v-model="liftCameraInfo.conditions.cameraName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择相机编号','liftCamera')"
                            v-model="liftCameraInfo.conditions.cameraCode" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请选择电梯名称','liftCamera')"
                            v-model="liftCameraInfo.conditions.liftName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-1">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryLiftCameraMethod()">
                        <i class="glyphicon glyphicon-search"></i> <span>
                            <vc:i18n name="查询"></vc:i18n>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="电梯相机" namespace="liftCamera"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddLiftCameraModal()">
                    <vc:i18n name="添加" namespace="liftCamera"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">

            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='编号' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='相机名称' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='相机编号' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='相机厂家' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='电梯名称' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='设备心跳时间' namespace='liftCamera'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="liftCamera in liftCameraInfo.liftCameras">
                        <td class="text-center">{{liftCamera.lcId}}</td>
                        <td class="text-center">{{liftCamera.cameraName}}</td>
                        <td class="text-center">{{liftCamera.cameraCode}}</td>
                        <td class="text-center">{{liftCamera.factoryId}}</td>
                        <td class="text-center">{{liftCamera.liftName}}</td>
                        <td class="text-center">{{liftCamera.heartbeatTime}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs" v-on:click="_openEditLiftCameraModel(liftCamera)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteLiftCameraModel(liftCamera)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>
    </div>

    <vc:create path="lift/addLiftCamera" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="lift/editLiftCamera"></vc:create>
    <vc:create path="lift/deleteLiftCamera"></vc:create>

</div>
