<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择厂家ID','chargeMachineFactoryManage')"
                                       v-model="chargeMachineFactoryManageInfo.conditions.factoryId"
                                       class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择厂家名称','chargeMachineFactoryManage')"
                                       v-model="chargeMachineFactoryManageInfo.conditions.factoryName"
                                       class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择厂家处理类','chargeMachineFactoryManage')"
                                       v-model="chargeMachineFactoryManageInfo.conditions.beanImpl"
                                       class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryChargeMachineFactoryMethod()">
                                <vc:i18n name="查询" namespace="chargeMachineFactoryManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetChargeMachineFactoryMethod()">
                                <vc:i18n name="重置" namespace="chargeMachineFactoryManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="充电厂家" namespace="chargeMachineFactoryManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddChargeMachineFactoryModal()">
                            <vc:i18n name="添加" namespace="chargeMachineFactoryManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='厂家ID' namespace='chargeMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家名称' namespace='chargeMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家处理类' namespace='chargeMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='chargeMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='chargeMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="chargeMachineFactory in chargeMachineFactoryManageInfo.chargeMachineFactorys">
                                <td class="text-center">{{chargeMachineFactory.factoryId}}</td>
                                <td class="text-center">{{chargeMachineFactory.factoryName}}</td>
                                <td class="text-center">{{chargeMachineFactory.beanImpl}}</td>
                                <td class="text-center">{{chargeMachineFactory.remark}}</td>
                                <td class="text-center">{{chargeMachineFactory.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openChargeMachineFactorySpec(chargeMachineFactory)">
                                            <vc:i18n name='厂家规格'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditChargeMachineFactoryModel(chargeMachineFactory)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteChargeMachineFactoryModel(chargeMachineFactory)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="charge/addChargeMachineFactory" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="charge/editChargeMachineFactory"></vc:create>
    <vc:create path="charge/deleteChargeMachineFactory"></vc:create>

</div>
