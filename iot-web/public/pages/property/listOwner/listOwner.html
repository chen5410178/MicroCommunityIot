<div>
    <div class="ibox ">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="查询条件" namespace="listOwner"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-link btn-sm" style="margin-right:10px;"
                    v-on:click="_moreCondition()">{{listOwnerInfo.moreCondition == true?'隐藏':'更多'}}
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请输入人员名称','listOwner')"
                            v-model="listOwnerInfo.conditions.name" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请填写房屋编号 格式 楼栋-单元-房屋','listOwner')"
                            v-model="listOwnerInfo.conditions.roomName" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="number" :placeholder="vc.i18n('请输入联系方式','listOwner')"
                            v-model="listOwnerInfo.conditions.link" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryOwnerMethod()">
                        <vc:i18n name="查询" namespace="listOwner"></vc:i18n>
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetOwnerMethod()">
                        <vc:i18n name="重置" namespace="listOwner"></vc:i18n>
                    </button>
                </div>
            </div>
            <div class="row" v-if="listOwnerInfo.moreCondition == true">
                <div class="col-sm-3">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请输入人员ID','listOwner')"
                            v-model="listOwnerInfo.conditions.ownerId" class=" form-control">
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <input type="text" :placeholder="vc.i18n('请输入人员身份证号','listOwner')"
                            v-model="listOwnerInfo.conditions.idCard" class=" form-control">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="人员信息" namespace="listOwner"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddOwnerModal(-1)">
                    <vc:i18n name="添加人员" namespace="listOwner"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name="人员人脸" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="姓名" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="性别" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="身份证" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="家庭住址" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="门禁卡" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="房屋数" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="人员类型" namespace="listOwner"></vc:i18n>
                        </th>
                        <th data-hide="phone" class="text-center">
                            <vc:i18n name="车辆数" namespace="listOwner"></vc:i18n>
                        </th>
                        <th v-for="(item,index) in listOwnerInfo.listColumns" class="text-center">{{item}}</th>
                        <th class="text-center">
                            <vc:i18n name="操作" namespace="listOwner"></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="owner in listOwnerInfo.owners">
                        <td class="text-center" style="white-space: nowrap;">
                            <img style="width: 60px; height: 60px;" class="border-radius" v-if="owner.url"
                                v-bind:src="owner.url" v-on:click="_viewOwnerFace(owner.url)" />
                            <img style="width: 60px; height: 60px;" class="border-radius" v-else
                                src="/img/noPhoto.jpg" />
                        </td>
                        <td class="text-center">
                            {{owner.name}}({{owner.link}})
                        </td>
                        <td class="text-center">
                            {{owner.sex == 0 ? '男' : '女'}}
                        </td>
                        <td class="text-center">
                            {{owner.idCard || '-'}}
                        </td>
                        <td class="text-center">
                            {{owner.address || '-'}}
                        </td>
                        <td class="text-center">
                            {{owner.cardNumber || '-'}}
                        </td>
                        <td class="text-center">
                            <a href="javascript:void(0)" @click="_viewOwnerRooms(owner)">
                                {{owner.roomCount || 0}}
                            </a>
                        </td>
                        <td class="text-center">
                            {{owner.ownerTypeName }}
                        </td>
                        <td class="text-center">
                            <a href="javascript:void(0)" @click="_viewOwnerCars(owner)">
                                {{owner.carCount || 0}}
                            </a>
                        </td>
                        <td v-for="item in owner.listValues" class="text-center">
                            {{item || '-'}}
                        </td>
                        <td class="text-center">

                            <div class="btn-group">
                                <button class="btn-white btn btn-xs " v-on:click="_openEditOwnerModel(owner)">
                                    <vc:i18n name="修改" namespace="listOwner"></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs " v-on:click="_openDelOwnerModel(owner)">
                                    <vc:i18n name="删除" namespace="listOwner"></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs " v-on:click="_openOwnerDetailModel(owner)">
                                    <vc:i18n name="详情" namespace="listOwner"></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>

    </div>
    <vc:create path="property/addOwner" notifyLoadDataComponentName="listOwner" componentTitle="人员"></vc:create>
    <vc:create path="property/editOwner" notifyLoadDataComponentName="listOwner" componentTitle="人员"></vc:create>
    <vc:create path="property/deleteOwner" notifyLoadDataComponentName="listOwner"></vc:create>
    <!-- <vc:create path="owner/ownerRooms"></vc:create>
    <vc:create path="owner/ownerMembers"></vc:create>
    <vc:create path="common/viewImage"></vc:create> -->
</div>
