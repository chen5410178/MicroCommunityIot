<div>
    <div class="bg-white padding-sm">
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openAddRoomFloorModal()">
            添加楼栋
        </button>
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openUpdateRoomFloorModal()">
            修改楼栋
        </button>
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openDeleteRoomFloorModal()">
            删除楼栋
        </button>
        <button type="button" class="btn btn-white btn-sm margin-left-sm" v-on:click="_openAddRoomUnitModal()">
            添加单元
        </button>
        <button type="button" class="btn btn-white btn-sm margin-left-sm" v-on:click="_openUpdateRoomUnitModal()">
            修改单元
        </button>
        <button type="button" class="btn btn-white btn-sm margin-left-sm" v-on:click="_openDeleteRoomUnitModal()">
            删除单元
        </button>
        <button type="button" class="btn btn-white btn-sm margin-left-sm" v-on:click="_openAddRoom()">
            <vc:i18n name="添加房屋" namespace="room"></vc:i18n>
        </button>
    </div>
    <div class="flex justify-start">
        <div style="padding-right:0px;width: 200px;" class="room-floor-unit-tree">
            <vc:create path="property/floorUnitTree" callBackListener="room"></vc:create>
        </div>
        <div class="margin-top-xs margin-left-sm" style="flex-grow: 1;">

            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件" namespace="room"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <!-- <button type="button" class="btn btn-link btn-sm" style="margin-right:10px;"
                                        v-on:click="_moreCondition()">{{roomInfo.moreCondition == true?'隐藏':'更多'}}
                                </button> -->
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写房屋编号  格式 楼栋-单元-房屋','room')" class="form-control form-control-sm" v-model="roomInfo.conditions.roomId">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <select class="form-control-sm form-control input-s-sm inline" v-model="roomInfo.conditions.state">
                                <option selected value="">{{vc.i18n('请选择状态','room')}}</option>
                                <option v-for="(item,index) in roomInfo.states" :key="index" :value="item.statusCd">
                                    {{item.name}}
                                </option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <select class="form-control-sm form-control input-s-sm inline" v-model="roomInfo.conditions.roomSubType">
                                <option selected value="">{{vc.i18n('必填，请选择房屋类型','room')}}</option>
                                <option :value="item.statusCd" v-for="(item,index) in roomInfo.roomSubTypes">
                                    {{item.name}}
                                </option>
                            </select>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryRoomMethod()">
                                <i class="fa fa-search"></i>
                                <span>
                                    <vc:i18n name="查询" namespace="room"></vc:i18n>
                                </span>
                            </button>
                            <button type="button" class="btn btn-info btn-sm" v-on:click="_resetRoomInfo()">
                                <vc:i18n name="重置" namespace="room"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4">
                            <select class="form-control-sm form-control input-s-sm inline" v-model="roomInfo.isAll" @change="_changeIsAll()">
                                <option value="N">当前楼栋单元</option>
                                <option value="Y">全部楼栋单元</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ibox">
                <div class="ibox-content border-radius ">
                    <div class="hc-table-div" :style="{'width':_computeTableDivWidth()}">
                        <table class="table table-stripped table-condensed" data-page-size="10">
                            <thead>
                                <tr>
                                    <th data-hide="phone" class="text-center hc-table-fix-left-td">
                                        <div class="hc-td">
                                            <vc:i18n name="房屋" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="楼层" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="业主" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="类型" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="建筑/室内面积" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="房屋状态" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="入住时间" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th data-hide="phone" class="text-center">
                                        <div class="hc-td">
                                            <vc:i18n name="住户" namespace="room"></vc:i18n>
                                        </div>
                                    </th>
                                    <th v-for="(item,index) in roomInfo.listColumns" class="text-center">
                                        <div class="hc-td">
                                            {{item}}
                                        </div>
                                    </th>
                                    <th class="text-center hc-table-fix-right-td">
                                        <vc:i18n name="操作" namespace="room"></vc:i18n>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="room in roomInfo.rooms">
                                    <!-- <td>{{room.roomId}}</td> -->
                                    <td class="text-center hc-table-fix-left-td">
                                        <div class="hc-td">
                                            {{room.floorNum}}-{{room.unitNum}}-{{room.roomNum}}
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            {{room.layer}}
                                            <span>
                                                <vc:i18n name="层" namespace="room"></vc:i18n>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-center hand" v-if="room.ownerName">
                                        <div class="hc-td">
                                            {{room.ownerName}}({{room.link}})
                                        </div>
                                    </td>
                                    <td class="text-center hand" v-else>
                                        <div class="hc-td textAuto">
                                            {{room.ownerName}}
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            {{room.roomSubTypeName}}
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            {{room.builtUpArea}}/{{room.roomArea}}
                                            <span>
                                                <vc:i18n name="平方米" namespace="room"></vc:i18n>
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            {{room.stateName}}
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            {{room.startTime}}
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <div class="hc-td">
                                            <a href="javascript:void(0)" @click="_viewOwnerMembers(room)">{{room.memberCount || 0}}</a>
                                        </div>
                                    </td>
                                    <td v-for="item in room.listValues" class="text-center">
                                        <div class="hc-td">
                                            {{item}}
                                        </div>
                                    </td>
                                    <td class="text-center hc-table-fix-right-td">

                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs" v-on:click="_openEditRoomModel(room)">
                                                <vc:i18n name="修改" namespace="room"></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs" v-on:click="_openDelRoomModel(room)">
                                                <vc:i18n name="删除" namespace="room"></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn-white btn btn-xs" v-on:click="_toRoomBindOwner(room)">
                                                <vc:i18n name="绑定人员" namespace="room"></vc:i18n>
                                            </button>
                                        </div>
                                        <div class="btn-group" v-if="room.state != '2002' && room.ownerId ">
                                            <button class="btn-white btn btn-xs" v-on:click="_toRoomUnBindOwner(room)">
                                                <vc:i18n name="解绑人员" namespace="room"></vc:i18n>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row margin-top-xs">
                        <div class="col-sm-7">

                        </div>
                        <div class="col-sm-5 float-right">
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- 删除员工权限 -->
    <vc:create path="property/editRoom"></vc:create>
    <vc:create path="property/deleteRoom"></vc:create>
    <vc:create path="property/addFloor" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="property/editFloor"></vc:create>
    <vc:create path="property/deleteFloor"></vc:create>
    <vc:create path="property/addUnit" callBackListener="" callBackFunction=""></vc:create>
    <!-- 删除员工权限 -->
    <vc:create path="property/editUnit"></vc:create>
    <vc:create path="property/deleteUnit"></vc:create>

    <vc:create path="owner/ownerRooms"></vc:create>
    <vc:create path="owner/ownerMembers"></vc:create>
    <vc:create path="owner/ownerCars"></vc:create>
</div>
