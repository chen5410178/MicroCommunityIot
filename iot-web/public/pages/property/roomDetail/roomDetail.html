<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            房屋信息
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="房屋ID：" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{roomDetailInfo.roomId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="名称：" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{roomDetailInfo.floorNum}}-{{roomDetailInfo.unitNum}}-{{roomDetailInfo.roomNum}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="楼层：" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">
                                {{roomDetailInfo.layer}}
                            </label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="房屋类型:" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{roomDetailInfo.roomSubTypeName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="建筑面积:" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{roomDetailInfo.builtUpArea}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="室内面积：" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{roomDetailInfo.roomArea}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="房屋状态" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{roomDetailInfo.stateName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                    <vc:i18n name="交房时间" namespace="roomDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{roomDetailInfo.startTime}}</label>
                        </div>
                    </div>
                </div>
                <div v-for="(item,index) in roomDetailInfo.roomAttrDtos">
                    <div class="row" v-if="index % 4 == 0">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label class="col-form-label">{{item.specName}}：</label>
                                <label class="">{{item.valueName}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < roomDetailInfo.roomAttrDtos.length-1">
                            <div class="form-group">
                                <label class="col-form-label">{{roomDetailInfo.roomAttrDtos[index+1].specName}}：</label>
                                <label class="">{{roomDetailInfo.roomAttrDtos[index+1].valueName}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < roomDetailInfo.roomAttrDtos.length-2">
                            <div class="form-group">
                                <label class="col-form-label">{{roomDetailInfo.roomAttrDtos[index+2].specName}}：</label>
                                <label class="">{{roomDetailInfo.roomAttrDtos[index+2].valueName}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < roomDetailInfo.roomAttrDtos.length-3">
                            <div class="form-group">
                                <label class="col-form-label">{{roomDetailInfo.roomAttrDtos[index+3].specName}}：</label>
                                <label class="">{{roomDetailInfo.roomAttrDtos[index+3].valueName}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailOwner'}" v-on:click="changeTab('roomDetailOwner')">
                    <vc:i18n name="人员" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailCar'}" v-on:click="changeTab('roomDetailCar')">
                    <vc:i18n name="车辆" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailAccessControl'}" v-on:click="changeTab('roomDetailAccessControl')">
                    <vc:i18n name="授权门禁" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailAccessControlLog'}" v-on:click="changeTab('roomDetailAccessControlLog')">
                    <vc:i18n name="人脸下发" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailAccessControlInout'}" v-on:click="changeTab('roomDetailAccessControlInout')">
                    <vc:i18n name="门禁开门" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailMeter'}" v-on:click="changeTab('roomDetailMeter')">
                    <vc:i18n name="水电表" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailMeterRecharge'}" v-on:click="changeTab('roomDetailMeterRecharge')">
                    <vc:i18n name="水电充值" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailLock'}" v-on:click="changeTab('roomDetailLock')">
                    <vc:i18n name="门锁" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailLockPerson'}" v-on:click="changeTab('roomDetailLockPerson')">
                    <vc:i18n name="门锁授权" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailLockLog'}" v-on:click="changeTab('roomDetailLockLog')">
                    <vc:i18n name="门锁下发" namespace="roomDetail"></vc:i18n>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:roomDetailInfo._currentTab == 'roomDetailComplaint'}" v-on:click="changeTab('roomDetailComplaint')">
                    <vc:i18n name="门锁进出" namespace="roomDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailOwner'">
        <vc:create path="property/roomDetailOwner"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailCar'">
        <vc:create path="property/roomDetailCar"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailAccessControl'">
        <vc:create path="property/roomDetailAccessControl"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailAccessControlLog'">
        <vc:create path="property/roomDetailAccessControlLog"></vc:create>
    </div>

    <div v-if="roomDetailInfo._currentTab == 'roomDetailAccessControlInout'">
        <vc:create path="property/roomDetailAccessControlInout"></vc:create>
    </div>
    
    <div v-if="roomDetailInfo._currentTab == 'roomDetailMeter'">
        <vc:create path="property/roomDetailMeter"></vc:create>
    </div>
    
    <div v-if="roomDetailInfo._currentTab == 'roomDetailMeterRecharge'">
        <vc:create path="property/roomDetailMeterRecharge"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailLock'">
        <vc:create path="property/roomDetailLock"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailLockPerson'">
        <vc:create path="property/roomDetailLockPerson"></vc:create>
    </div>
    <div v-if="roomDetailInfo._currentTab == 'roomDetailLockLog'">
        <vc:create path="property/roomDetailLockLog"></vc:create>
    </div>
    
    
</div>
