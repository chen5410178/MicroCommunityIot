<div>
    <div class="row">
        <div class="col-md-2 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview attendance-staff">
                    <ul class="list-group text-center border-radius">
                        <!--  -->
                        <li class="list-group-item node-orgTree " v-for="(item,index) in dtSceneObjScriptInfo.scenes"
                            :key="index" @click="swatchScene(item)"
                            :class="{'vc-node-selected':dtSceneObjScriptInfo.conditions.sceneId == item.sceneId}">
                            {{item.sceneName}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择模型名称','dtSceneObjScript')"
                                            v-model="dtSceneObjScriptInfo.conditions.modalName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryDtSceneObjScriptMethod()">
                                        <vc:i18n name="查询"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="对象脚本" namespace="dtSceneObjScript"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='对象名称' namespace='dtSceneObjScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='脚本名称' namespace='dtSceneObjScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='对象类型' namespace='dtSceneObjScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='创建时间' namespace='dtSceneObjScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="script in dtSceneObjScriptInfo.scripts">
                                        <td class="text-center">{{script.objName}}</td>
                                        <td class="text-center">{{script.scriptName}}</td>
                                        <td class="text-center">{{script.objTypeName}}</td>
                                        <td class="text-center">{{script.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeleteDtSceneObjScriptModel(dtSceneObjScript)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="3d/deleteObjectScript"></vc:create>

</div>
