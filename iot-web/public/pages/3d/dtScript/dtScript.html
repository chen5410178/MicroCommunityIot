<div>
    <div class="row">
        <div class="col-md-2 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview attendance-staff">
                    <ul class="list-group text-center border-radius">
                        <!--  -->
                        <li class="list-group-item node-orgTree " v-for="(item,index) in dtScriptInfo.scriptTypes"
                            :key="index" @click="swatchScriptType(item)"
                            :class="{'vc-node-selected':dtScriptInfo.conditions.scriptType == item.statusCd}">
                            {{item.name}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">

                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请选择教程名称','dtScript')"
                                            v-model="dtScriptInfo.conditions.scriptName" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-1">
                                    <button type="button" class="btn btn-primary btn-sm"
                                        v-on:click="_queryDtScriptMethod()">
                                        <vc:i18n name="查询"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="3D脚本" namespace="dtScript"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_openAddDtScriptModal()">
                                    <vc:i18n name="添加" namespace="dtScript"></vc:i18n>
                                </button>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name='编号' namespace='dtScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='名称' namespace='dtScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='脚本类型' namespace='dtScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='创建时间' namespace='dtScript'></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name='操作'></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="dtScript in dtScriptInfo.dtScripts">
                                        <td class="text-center">{{dtScript.scriptId}}</td>
                                        <td class="text-center">{{dtScript.scriptName}}</td>
                                        <td class="text-center">{{dtScript.scriptTypeName}}</td>
                                        <td class="text-center">{{dtScript.createTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openEditDtScriptModel(dtScript)">
                                                    <vc:i18n name='修改'></vc:i18n>
                                                </button>
                                            </div>
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs"
                                                    v-on:click="_openDeleteDtScriptModel(dtScript)">
                                                    <vc:i18n name='删除'></vc:i18n>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="3d/addDtScript" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="3d/editDtScript"></vc:create>
    <vc:create path="3d/deleteDtScript"></vc:create>

</div>
