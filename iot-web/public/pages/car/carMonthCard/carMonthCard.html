<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择名称','carMonthCard')"
                                    v-model="carMonthCardInfo.conditions.cardName" class=" form-control">
                            </div>
                        </div>

                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryCarMonthCardMethod()">
                                <i class="glyphicon glyphicon-search"></i> <span>
                                    <vc:i18n name="查询"></vc:i18n>
                                </span>
                            </button>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="停车月卡" namespace="carMonthCard"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddCarMonthCardModal()">
                            <vc:i18n name="添加" namespace="carMonthCard"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='名称' namespace='carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='月' namespace='carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='月价' namespace='carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace=' carMonthCard'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="carMonthCard in carMonthCardInfo.carMonthCards">
                                <td class="text-center">{{carMonthCard.cardId}}</td>
                                <td class="text-center">{{carMonthCard.cardName}}</td>
                                <td class="text-center">{{carMonthCard.cardMonth}}</td>
                                <td class="text-center">{{carMonthCard.cardPrice}}</td>
                                <td class="text-center">{{carMonthCard.communityId}}</td>
                                <td class="text-center">{{carMonthCard.remark}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditCarMonthCardModel(carMonthCard)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteCarMonthCardModel(carMonthCard)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>



    <vc:create path="car/addCarMonthCard" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="car/editCarMonthCard"></vc:create>
    <vc:create path="car/deleteCarMonthCard"></vc:create>

</div>
