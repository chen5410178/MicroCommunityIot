<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择设备编码','parkingSpaceMachine')"
                                    v-model="parkingSpaceMachineInfo.conditions.machineCode" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择设备名称','parkingSpaceMachine')"
                                    v-model="parkingSpaceMachineInfo.conditions.machineName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择门禁厂家','parkingSpaceMachine')"
                                    v-model="parkingSpaceMachineInfo.conditions.implBean" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryParkingSpaceMachineMethod()">
                                <i class="glyphicon glyphicon-search"></i> <span>
                                    <vc:i18n name="查询"></vc:i18n>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="车位地磁" namespace="parkingSpaceMachine"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                            v-on:click="_openAddParkingSpaceMachineModal()">
                            <vc:i18n name="添加" namespace="parkingSpaceMachine"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='编号' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='设备名称' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='设备编码' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='设备IP' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='设备mac' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='门禁厂家' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='车位' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='状态' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='parkingSpaceMachine'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="parkingSpaceMachine in parkingSpaceMachineInfo.parkingSpaceMachines">
                                <td class="text-center">{{parkingSpaceMachine.machineId}}</td>
                                <td class="text-center">{{parkingSpaceMachine.machineName}}</td>
                                <td class="text-center">{{parkingSpaceMachine.machineCode}}</td>
                                <td class="text-center">{{parkingSpaceMachine.machineIp}}</td>
                                <td class="text-center">{{parkingSpaceMachine.machineMac}}</td>
                                <td class="text-center">{{parkingSpaceMachine.implBeanName}}</td>
                                <td class="text-center">
                                    <div v-for="(item,index) in  parkingSpaceMachine.parkingSpaces">{{item.psName}}</div>
                                </td>
                                <td class="text-center">{{parkingSpaceMachine.stateName}}</td>
                                <td class="text-center">{{parkingSpaceMachine.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditParkingSpaceMachineModel(parkingSpaceMachine)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteParkingSpaceMachineModel(parkingSpaceMachine)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="car/deleteParkingSpaceMachine"></vc:create>

</div>
