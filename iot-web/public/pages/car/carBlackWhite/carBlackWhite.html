<div class="animated fadeInRight ecommerce">
    <div class="row">
        <div class="col-md-2 padding-r-0">
            <div class=" border-radius ">
                <div class="margin-xs-r  treeview attendance-staff">
                    <ul class="list-group text-center border-radius">
                        <li class="list-group-item node-orgTree " v-for="(item,index) in carBlackWhiteInfo.blackWhites" :key="index" @click="swatchBlackWhiteType(item)" :class="{'vc-node-selected':carBlackWhiteInfo.conditions.blackWhite == item.statusCd}">
                            {{item.name}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>
                                <vc:i18n name="查询条件" namespace="carBlackWhite"></vc:i18n>
                            </h5>
                            <div class="ibox-tools" style="top:10px;"></div>
                        </div>
                        <div class="ibox-content">
                            <div class="row">
                                <div class="col-sm-2">
                                    <div class="form-group">
                                        <input type="text" :placeholder="vc.i18n('请输入车牌号','carBlackWhite')" v-model="carBlackWhiteInfo.conditions.carNum" class=" form-control">
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryCarBlackWhiteMethod()">
                                        <vc:i18n name="查询" namespace="carBlackWhite"></vc:i18n>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>
                                <span v-if="carBlackWhiteInfo.conditions.blackWhite == '2222'">
                                    <vc:i18n name="白名单车辆" namespace="carBlackWhite"></vc:i18n>
                                </span>
                                <span v-else>
                                    <vc:i18n name="黑名单车辆" namespace="carBlackWhite"></vc:i18n>
                                </span>
                            </h5>
                            <div class="ibox-tools" style="top:10px;">
                                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddCarBlackWhiteModal()">
                                    <vc:i18n name="添加" namespace="carBlackWhite"></vc:i18n>
                                </button>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                                <thead>
                                    <tr>
                                        <th class="text-center">
                                            <vc:i18n name="名单ID" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="名单类型" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="停车场" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="车牌号" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="开始时间" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="结束时间" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                        <th class="text-center">
                                            <vc:i18n name="操作" namespace="carBlackWhite"></vc:i18n>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="carBlackWhite in carBlackWhiteInfo.carBlackWhites">
                                        <td class="text-center">{{carBlackWhite.bwId}}</td>
                                        <td class="text-center">{{carBlackWhite.blackWhiteName}}</td>
                                        <td class="text-center">{{carBlackWhite.paNum}}</td>
                                        <td class="text-center">{{carBlackWhite.carNum}}</td>
                                        <td class="text-center">{{carBlackWhite.startTime}}</td>
                                        <td class="text-center">{{carBlackWhite.endTime}}</td>
                                        <td class="text-center">
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs" v-on:click="_openEditCarBlackWhiteModel(carBlackWhite)">
                                                    <vc:i18n name="修改" namespace="carBlackWhite"></vc:i18n>
                                            </button>
                                            </div>
                                            <div class="btn-group">
                                                <button class="btn-white btn btn-xs" v-on:click="_openDeleteCarBlackWhiteModel(carBlackWhite)">
                                                    <vc:i18n name="删除" namespace="carBlackWhite"></vc:i18n>
                                            </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="7">
                                            <ul class="pagination float-right"></ul>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                            <!-- 分页 -->
                            <vc:create path="frame/pagination"></vc:create>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <vc:create path="car/addCarBlackWhite" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="car/editCarBlackWhite"></vc:create>
    <vc:create path="car/deleteCarBlackWhite"></vc:create>
</div>
