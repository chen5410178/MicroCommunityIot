<div>
    <div class="ibox">
        <div class="ibox-title">
            <h5>
                <vc:i18n name="地磁厂家" namespace="spaceMachineFactory"></vc:i18n>
            </h5>
            <div class="ibox-tools" style="top:10px;">
                <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddSpaceMachineFactoryModal()">
                    <vc:i18n name="添加" namespace="spaceMachineFactory"></vc:i18n>
                </button>
            </div>
        </div>
        <div class="ibox-content">
            <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                <thead>
                    <tr>
                        <th class="text-center">
                            <vc:i18n name='编号' namespace='spaceMachineFactory'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='厂家名称' namespace='spaceMachineFactory'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='厂家处理类' namespace='spaceMachineFactory'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='创建时间' namespace='spaceMachineFactory'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='备注' namespace='spaceMachineFactory'></vc:i18n>
                        </th>
                        <th class="text-center">
                            <vc:i18n name='操作'></vc:i18n>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="spaceMachineFactory in spaceMachineFactoryInfo.spaceMachineFactorys">
                        <td class="text-center">{{spaceMachineFactory.factoryId}}</td>
                        <td class="text-center">{{spaceMachineFactory.factoryName}}</td>
                        <td class="text-center">{{spaceMachineFactory.beanImpl}}</td>
                        <td class="text-center">{{spaceMachineFactory.createTime}}</td>
                        <td class="text-center">{{spaceMachineFactory.remark}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openEditSpaceMachineFactoryModel(spaceMachineFactory)">
                                    <vc:i18n name='修改'></vc:i18n>
                                </button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-white btn btn-xs"
                                    v-on:click="_openDeleteSpaceMachineFactoryModel(spaceMachineFactory)">
                                    <vc:i18n name='删除'></vc:i18n>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- 分页 -->
            <vc:create path="frame/pagination"></vc:create>
        </div>
    </div>
    <vc:create path="car/addSpaceMachineFactory" ></vc:create>
    <vc:create path="car/editSpaceMachineFactory"></vc:create>
    <vc:create path="car/deleteSpaceMachineFactory"></vc:create>

</div>
