<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="水电规格" namespace="meterMachineFactorySpecManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm" v-on:click="vc.goBack()">
                            <vc:i18n name="返回" namespace="meterMachineFactorySpecManage"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddMeterMachineFactorySpecModal()">
                            <i class="glyphicon glyphicon-plus"></i>
                            <vc:i18n name="添加" namespace="meterMachineFactorySpecManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='规格ID' namespace='meterMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='规格名称' namespace='meterMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='描述' namespace='meterMachineFactorySpecManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="meterMachineFactorySpec in meterMachineFactorySpecManageInfo.meterMachineFactorySpecs">
                                <td class="text-center">{{meterMachineFactorySpec.specId}}</td>
                                <td class="text-center">{{meterMachineFactorySpec.specName}}</td>
                                <td class="text-center">{{meterMachineFactorySpec.remark}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditMeterMachineFactorySpecModel(meterMachineFactorySpec)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteMeterMachineFactorySpecModel(meterMachineFactorySpec)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="meter/addMeterMachineFactorySpec" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="meter/editMeterMachineFactorySpec"></vc:create>
    <vc:create path="meter/deleteMeterMachineFactorySpec"></vc:create>

</div>
