<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家ID','instrumentFactoryManage')"
                                    v-model="instrumentFactoryManageInfo.conditions.factoryId" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家名称','instrumentFactoryManage')"
                                    v-model="instrumentFactoryManageInfo.conditions.factoryName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家处理类','instrumentFactoryManage')"
                                    v-model="instrumentFactoryManageInfo.conditions.beanImpl" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryInstrumentFactoryMethod()">
                                <vc:i18n name="查询" namespace="instrumentFactoryManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetInstrumentFactoryMethod()">
                                <vc:i18n name="重置" namespace="instrumentFactoryManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="仪表厂家" namespace="instrumentFactoryManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddInstrumentFactoryModal()">
                            <vc:i18n name="添加" namespace="instrumentFactoryManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='厂家ID' namespace='instrumentFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家名称' namespace='instrumentFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家处理类' namespace='instrumentFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='instrumentFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='instrumentFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="instrumentFactory in instrumentFactoryManageInfo.instrumentFactorys">
                                <td class="text-center">{{instrumentFactory.factoryId}}</td>
                                <td class="text-center">{{instrumentFactory.factoryName}}</td>
                                <td class="text-center">{{instrumentFactory.beanImpl}}</td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(instrumentFactory.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">{{instrumentFactory.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openInstrumentFactorySpec(instrumentFactory)">
                                            <vc:i18n name="厂家规格"></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditInstrumentFactoryModel(instrumentFactory)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteInstrumentFactoryModel(instrumentFactory)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="meter/addInstrumentFactory" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="meter/editInstrumentFactory"></vc:create>
    <vc:create path="meter/deleteInstrumentFactory"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
