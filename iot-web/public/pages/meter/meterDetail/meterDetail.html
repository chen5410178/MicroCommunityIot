<div class="white-bg padding-lg padding-top border-radius">
    <div class="flex justify-between">
        <div class="text-title">
            水电表信息
        </div>
        <div>
            <button type="button" class="btn btn-white btn-sm" style="margin-left:10px"  v-on:click="vc.goBack()">
                返回
            </button>
        </div>
    </div>
    <!-- 业主信息 -->
    <div class="margin-top">
        <div class="row" >
            <div class="col-sm-12">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="水电表ID：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineId}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="水电表名称：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="水电表号：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.address}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="厂家名称:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.implBeanName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="水电表模式：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.machineModelName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="水电表类型：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.meterTypeName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="房间:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.roomName}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="在线状态:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.stateName}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="本期读数：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.curDegrees}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="本期读数时间：" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.curReadingTime}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="预存剩余读数:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class="">{{machineDetailInfo.prestoreDegrees}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="心跳时间:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.heartbeatTime}}</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="每月抄表日:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.readDay}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="抄表小时:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.readHours}}</label>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label class="col-form-label">
                                <vc:i18n name="添加时间:" namespace="machineDetailInfo"></vc:i18n>
                            </label>
                            <label class=""> {{machineDetailInfo.createTime}}</label>
                        </div>
                    </div>
                </div>
                <div v-for="(item,index) in machineDetailInfo.specs">
                    <div class="row" v-if="index % 4 == 0">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label class="col-form-label">{{item.specName}}：</label>
                                <label class="">{{item.specValue}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.specs.length-1">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.specs[index+1].specName}}：</label>
                                <label class="">{{machineDetailInfo.specs[index+1].specValue}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.specs.length-2">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.specs[index+2].specName}}：</label>
                                <label class="">{{machineDetailInfo.specs[index+2].specValue}}</label>
                            </div>
                        </div>
                        <div class="col-sm-3" v-if="index < machineDetailInfo.specs.length-3">
                            <div class="form-group">
                                <label class="col-form-label">{{machineDetailInfo.specs[index+3].specName}}：</label>
                                <label class="">{{machineDetailInfo.specs[index+3].specValue}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vc-line-primary margin-top"></div>
    <div class="margin-top-sm">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:machineDetailInfo._currentTab == 'machineDetailRoom'}" v-on:click="changeTab('machineDetailRoom')">
                    <vc:i18n name="房屋详情" namespace="machineDetail"></vc:i18n>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" v-bind:class="{active:machineDetailInfo._currentTab == 'machineDetailMeterRead'}" v-on:click="changeTab('machineDetailMeterRead')">
                    <vc:i18n name="抄表记录" namespace="machineDetail"></vc:i18n>
                </a>
            </li>
        </ul>
    </div>
    <div v-if="machineDetailInfo._currentTab == 'machineDetailRoom'">
        <vc:create path="property/machineDetailRoom"></vc:create>
    </div>
    <div v-if="machineDetailInfo._currentTab == 'machineDetailMeterRead'">
        <vc:create path="property/machineDetailMeterRead"></vc:create>
    </div>
</div>
