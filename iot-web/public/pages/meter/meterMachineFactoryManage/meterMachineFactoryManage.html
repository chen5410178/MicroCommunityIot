<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-link btn-sm" style="margin-right:10px;" v-on:click="_moreCondition()">
                            {{meterMachineFactoryManageInfo.moreCondition == true?'隐藏':'更多'}}
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家ID','meterMachineFactoryManage')"
                                    v-model="meterMachineFactoryManageInfo.conditions.factoryId" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家名称','meterMachineFactoryManage')"
                                    v-model="meterMachineFactoryManageInfo.conditions.factoryName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入厂家处理类','meterMachineFactoryManage')"
                                    v-model="meterMachineFactoryManageInfo.conditions.beanImpl" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryMeterMachineFactoryMethod()">
                                <vc:i18n name="查询" namespace="meterMachineFactoryManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetMeterMachineFactoryMethod()">
                                <vc:i18n name="重置" namespace="meterMachineFactoryManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3" v-if="meterMachineFactoryManageInfo.moreCondition == true">
                            <div class="form-group">
                                <select class="custom-select" v-model="meterMachineFactoryManageInfo.conditions.machineModel">
                                    <option value="" disabled selected>{{vc.i18n('请选择模式','meterMachineFactoryManage')}}</option>
                                    <option value="1001">{{vc.i18n('充值模式','meterMachineFactoryManage')}}</option>
                                    <option value="2002">{{vc.i18n('抄表模式','meterMachineFactoryManage')}}</option>
                                    <option value="3003">{{vc.i18n('都支持','meterMachineFactoryManage')}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="水电厂家" namespace="meterMachineFactoryManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddMeterMachineFactoryModal()">
                            <vc:i18n name="添加" namespace="meterMachineFactoryManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='厂家ID' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家名称' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='厂家处理类' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='模式' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='meterMachineFactoryManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="meterMachineFactory in meterMachineFactoryManageInfo.meterMachineFactorys">
                                <td class="text-center">{{meterMachineFactory.factoryId}}</td>
                                <td class="text-center">{{meterMachineFactory.factoryName}}</td>
                                <td class="text-center">{{meterMachineFactory.beanImpl}}</td>
                                <td class="text-center">
                                    <label v-if="meterMachineFactory.machineModel === '1001'">
                                        {{vc.i18n('充值模式','meterMachineFactoryManage')}}
                                    </label>
                                    <label v-if="meterMachineFactory.machineModel === '2002'">
                                        {{vc.i18n('抄表模式','meterMachineFactoryManage')}}
                                    </label>
                                    <label v-if="meterMachineFactory.machineModel === '3003'">
                                        {{vc.i18n('都支持','meterMachineFactoryManage')}}
                                    </label>
                                </td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(meterMachineFactory.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">{{meterMachineFactory.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openMeterMachineFactorySpec(meterMachineFactory)">
                                            <vc:i18n name="厂家规格"></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditMeterMachineFactoryModel(meterMachineFactory)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteMeterMachineFactoryModel(meterMachineFactory)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="meter/addMeterMachineFactory" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="meter/editMeterMachineFactory"></vc:create>
    <vc:create path="meter/deleteMeterMachineFactory"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
