<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-link btn-sm" style="margin-right:10px;" v-on:click="_moreCondition()">
                            {{meterMachineDetailInfo.moreCondition == true?'隐藏':'更多'}}
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写名称','meterMachineDetail')"
                                    v-model="meterMachineDetailInfo.conditions.machineNameLike" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写表号','meterMachineDetail')"
                                    v-model="meterMachineDetailInfo.conditions.addressLike" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <select class="custom-select" v-model="meterMachineDetailInfo.conditions.state">
                                <option selected value="">{{vc.i18n('请选择充值状态','meterMachineDetail')}}</option>
                                <option value="W">{{vc.i18n('等待','meterMachineDetail')}}</option>
                                <option value="F">{{vc.i18n('失败','meterMachineDetail')}}</option>
                                <option value="C">{{vc.i18n('完成','meterMachineDetail')}}</option>
                            </select>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryMeterMachineDetailMethod()">
                                <vc:i18n name="查询"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetMeterMachineDetailMethod()">
                                <vc:i18n name="重置"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3" v-if="meterMachineDetailInfo.moreCondition == true">
                            <div class="form-group">
                                <div class="form-group">
                                    <input type="text" :placeholder="vc.i18n('请填写房屋编号 楼栋-单元-房屋','meterMachineManage')"
                                        v-model="meterMachineDetailInfo.conditions.roomNameLike" class=" form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="充值明细" namespace="meterMachineDetail"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm"
                            v-on:click="_queryMeterMachineDetailMethod()">
                            <vc:i18n name="刷新" namespace="meterMachineDetail"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='房屋' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表类型' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表名称' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表号' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值金额' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值度数' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值时间' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值状态' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='说明' namespace='meterMachineDetail'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="detail in meterMachineDetailInfo.details">
                                <td class="text-center">{{detail.roomName}}</td>
                                <td class="text-center">{{detail.machineName}}</td>
                                <td class="text-center">{{detail.typeName}}</td>
                                <td class="text-center">{{detail.address}}</td>
                                <td class="text-center">{{detail.chargeMoney}}</td>
                                <td class="text-center">{{detail.chargeDegrees}}</td>
                                <td class="text-center">{{detail.createTime}}</td>
                                <td class="text-center">
                                    <label v-if="detail.state == 'W'">等待</label>
                                    <label v-if="detail.state == 'F'">失败</label>
                                    <label v-if="detail.state == 'C'">完成</label>
                                </td>
                                <td class="text-center">{{detail.remark}}</td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

</div>
