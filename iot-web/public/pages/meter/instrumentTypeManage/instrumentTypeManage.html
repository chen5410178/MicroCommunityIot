<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入仪表类型','instrumentTypeManage')"
                                       v-model="instrumentTypeManageInfo.conditions.typeId" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入类型名称','instrumentTypeManage')"
                                       v-model="instrumentTypeManageInfo.conditions.name" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_queryInstrumentTypeMethod()">
                                <vc:i18n name="查询" namespace="instrumentTypeManage"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" v-on:click="_resetInstrumentTypeMethod()">
                                <vc:i18n name="重置" namespace="instrumentTypeManage"></vc:i18n>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="仪表组" namespace="instrumentTypeManage"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddInstrumentTypeModal()">
                            <vc:i18n name="添加" namespace="instrumentTypeManage"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='仪表类型' namespace='instrumentTypeManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='类型名称' namespace='instrumentTypeManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='备注' namespace='instrumentTypeManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='instrumentTypeManage'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='操作'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="instrumentType in instrumentTypeManageInfo.instrumentTypes">
                                <td class="text-center">{{instrumentType.typeId}}</td>
                                <td class="text-center">{{instrumentType.name}}</td>
                                <td class="text-center">
                                    <button class="btn-white btn btn-xs" v-on:click="_openModel(instrumentType.remark, '备注')">
                                        <vc:i18n name='查看'></vc:i18n>
                                    </button>
                                </td>
                                <td class="text-center">{{instrumentType.createTime}}</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openEditInstrumentTypeModel(instrumentType)">
                                            <vc:i18n name='修改'></vc:i18n>
                                        </button>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn-white btn btn-xs" v-on:click="_openDeleteInstrumentTypeModel(instrumentType)">
                                            <vc:i18n name='删除'></vc:i18n>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7">
                                    <ul class="pagination float-right"></ul>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="meter/addInstrumentType" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="meter/editInstrumentType"></vc:create>
    <vc:create path="meter/deleteInstrumentType"></vc:create>
    <vc:create path="event/viewData"></vc:create>

</div>
