<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="查询条件"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择用户名称','meterMachineLogManage')"
                                       v-model="meterMachineLogManageInfo.conditions.personName" class=" form-control">
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="放行申请信息" namespace="meterMachineLogManage"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_openAddMeterMachineLogModal()">
                            <i class="glyphicon glyphicon-plus"></i>
                            <span><vc:i18n name="添加放行申请" namespace="meterMachineLogManage"></vc:i18n></span>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny"
                           data-page-size="15"
                    >
                        <thead>
                        <tr>
                            <th class="text-center"><span><vc:i18n name='日志ID'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='用户名称'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='操作'></vc:i18n></span></th>


                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="meterMachineLog in meterMachineLogManageInfo.meterMachineLogs">
                            <td class="text-center">{{meterMachineLog.applyId}}</td>
                            <td class="text-center">{{meterMachineLog.personName}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openEditMeterMachineLogModel(meterMachineLog)"><span><vc:i18n
                                            name='修改'></vc:i18n></span></button>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openDeleteMeterMachineLogModel(meterMachineLog)"><span><vc:i18n
                                            name='删除'></vc:i18n></span></button>
                                </div>
                            </td>

                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="7">
                                <ul class="pagination float-right"></ul>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>


    <vc:create path="meterMachineLogManage/addMeterMachineLog"
               callBackListener=""
               callBackFunction=""
    ></vc:create>
    <vc:create path="meterMachineLogManage/editMeterMachineLog"></vc:create>
    <vc:create path="meterMachineLogManage/deleteMeterMachineLog"></vc:create>

</div>
