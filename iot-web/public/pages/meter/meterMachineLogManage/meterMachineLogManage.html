<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="查询条件"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请选择用户名称','meterMachineLogManage')"
                                       v-model="meterMachineLogManageInfo.conditions.personName" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-primary btn-sm"
                                    v-on:click="_queryMeterMachineLogMethod()">
                                <i class="glyphicon glyphicon-search"></i> <span>
                                    <vc:i18n name="查询"></vc:i18n>
                                </span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5><span><vc:i18n name="放行申请信息" namespace="meterMachineLogManage"></vc:i18n></span></h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">

                    <table class="footable table table-stripped toggle-arrow-tiny"
                           data-page-size="15"
                    >
                        <thead>
                        <tr>
                            <th class="text-center"><span><vc:i18n name='日志ID'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='设备ID'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='动作'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='用户名称'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='状态'
                                                                          namespace='meterMachineLogManage'></vc:i18n></span>
                        </th>
                            <th class="text-center"><span><vc:i18n name='创建时间'
                                                                   namespace='meterMachineLogManage'></vc:i18n></span>
                            </th>
                            <th class="text-center"><span><vc:i18n name='操作'></vc:i18n></span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="meterMachineLog in meterMachineLogManageInfo.meterMachineLogs">
                            <td class="text-center">{{meterMachineLog.logId}}</td>
                            <td class="text-center">{{meterMachineLog.machineId}}</td>
                            <td class="text-center">{{meterMachineLog.logAction =='1001'?'开闸':'关闸'}}</td>
                            <td class="text-center">{{meterMachineLog.personName}}</td>
                            <td class="text-center">{{meterMachineLog.state =='10001'?'请求成功':'返回异常'}}</td>
                            <td class="text-center">{{meterMachineLog.createTime}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button class="btn-white btn btn-xs"
                                            v-on:click="_openViewMeterMachineLogModal(meterMachineLog)"><span><vc:i18n
                                            name='报文'></vc:i18n></span></button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="7">
                                <ul class="pagination float-right"></ul>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

    <vc:create path="meter/showMeterMachineLog"></vc:create>
</div>
