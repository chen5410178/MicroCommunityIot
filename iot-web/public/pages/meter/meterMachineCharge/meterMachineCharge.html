<div>
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5><span>
                            <vc:i18n name="智能水电表充值明细" namespace="meterMachineCharge"></vc:i18n>
                        </span></h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm"
                                v-on:click="_queryMeterMachineChargeMethod()">
                            <vc:i18n name="刷新" namespace="meterMachineCharge"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-primary btn-sm" v-on:click="vc.goBack()">
                            <vc:i18n name="返回" namespace="meterMachineCharge"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                        <tr>
                            <th class="text-center"><span>
                                    <vc:i18n name='ID' namespace='meterMachineCharge'></vc:i18n>
                                </span></th>
                            <th class="text-center"><span>
                                    <vc:i18n name='房间号' namespace='meterMachineCharge'></vc:i18n>
                                </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='电表名称' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='机器编号' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='充值金额' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='创建时间' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='充值状态' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                            <th class="text-center"><span>
                                        <vc:i18n name='说明' namespace='meterMachineCharge'></vc:i18n>
                                    </span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="detail in meterMachineChargeInfo.details">
                            <td class="text-center">{{detail.chargeId}}</td>
                            <td class="text-center">{{detail.roomName}}</td>
                            <td class="text-center">{{detail.machineName}}</td>
                            <td class="text-center">{{detail.machineId}}</td>
                            <td class="text-center">{{detail.chargeMoney}}</td>
                            <td class="text-center">{{detail.createTime}}</td>
                            <td class="text-center">{{detail.state}}</td>
                            <td class="text-center">{{detail.remark}}</td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="7">
                                <ul class="pagination float-right"></ul>
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>
            </div>
        </div>
    </div>

</div>
