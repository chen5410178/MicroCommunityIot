<div>
    <div class="row">
        <div class="col-md-1 padding-r-0">
            <vc:create path="community/selectAdminCommunity"></vc:create>
        </div>
        <div class="col-md-11">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="查询条件"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">

                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写名称','adminMeterRecharge')"
                                    v-model="adminMeterRechargeInfo.conditions.machineNameLike" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请填写表号','adminMeterRecharge')"
                                    v-model="adminMeterRechargeInfo.conditions.addressLike" class=" form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <select class="custom-select" v-model="adminMeterRechargeInfo.conditions.state">
                                <option selected value="">{{vc.i18n('请选择充值状态','adminMeterRecharge')}}</option>
                                <option value="W">{{vc.i18n('等待','adminMeterRecharge')}}</option>
                                <option value="F">{{vc.i18n('失败','adminMeterRecharge')}}</option>
                                <option value="C">{{vc.i18n('完成','adminMeterRecharge')}}</option>
                            </select>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <div class="form-group">
                                    <input type="text" :placeholder="vc.i18n('请填写房屋编号 楼栋-单元-房屋','meterMachineManage')"
                                        v-model="adminMeterRechargeInfo.conditions.roomNameLike" class=" form-control">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_queryAdminMeterRechargeMethod()">
                                <vc:i18n name="查询"></vc:i18n>
                            </button>
                            <button type="button" class="btn btn-primary btn-sm"
                                v-on:click="_resetAdminMeterRechargeMethod()">
                                <vc:i18n name="重置"></vc:i18n>
                            </button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入开始时间','adminMeterRecharge')"
                                    v-model="adminMeterRechargeInfo.conditions.queryStartTime"
                                    class=" form-control queryStartTime">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <input type="text" :placeholder="vc.i18n('请输入结束时间','adminMeterRecharge')"
                                    v-model="adminMeterRechargeInfo.conditions.queryEndTime"
                                    class=" form-control queryEndTime">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="ibox">
                <div class="ibox-title">
                    <h5>
                        <vc:i18n name="充值明细" namespace="adminMeterRecharge"></vc:i18n>
                    </h5>
                    <div class="ibox-tools" style="top:10px;">
                        <button type="button" class="btn btn-white btn-sm"
                            v-on:click="_queryAdminMeterRechargeMethod()">
                            <vc:i18n name="刷新" namespace="adminMeterRecharge"></vc:i18n>
                        </button>
                    </div>
                </div>
                <div class="ibox-content">
                    <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <vc:i18n name='小区名称' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='房屋' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表类型' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表名称' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='表号' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值金额' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值度数' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值时间' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='充值状态' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='说明' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                                <th class="text-center">
                                    <vc:i18n name='创建时间' namespace='adminMeterRecharge'></vc:i18n>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="detail in adminMeterRechargeInfo.details">
                                <td class="text-center">{{detail.communityName}}</td>
                                <td class="text-center">{{detail.roomName}}</td>
                                <td class="text-center">{{detail.typeName}}</td>
                                <td class="text-center">{{detail.machineName}}</td>
                                <td class="text-center">{{detail.address}}</td>
                                <td class="text-center">{{detail.chargeMoney}}</td>
                                <td class="text-center">{{detail.chargeDegrees}}</td>
                                <td class="text-center">{{detail.createTime}}</td>
                                <td class="text-center">
                                    <label v-if="detail.state == 'W'">等待</label>
                                    <label v-if="detail.state == 'F'">失败</label>
                                    <label v-if="detail.state == 'C'">完成</label>
                                </td>
                                <td class="text-center">{{detail.remark || '-'}}</td>
                                <td class="text-center">{{detail.createTime}}</td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- 分页 -->
                    <vc:create path="frame/pagination"></vc:create>
                </div>

            </div>
        </div>

    </div>

</div>
