<div id="editTelTtsModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editTelTts"></vc:i18n>
        </h3>
        <div class="ibox-content">

          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='类型' namespace='editTelTts'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editTelTtsInfo.ttsType">
                <option selected disabled value="">{{vc.i18n('必填，请选择类型' ,'editTelTts')}}</option>
                <option value="OWE_FEE">{{vc.i18n('欠费催缴' ,'editTelTts')}} </option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='语音名称' namespace='editTelTts'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editTelTtsInfo.ttsName" type="text" :placeholder="vc.i18n('必填，请填写语音名称','editTelTts')"
                class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='语音地址' namespace='editTelTts'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <vc:create path="frame/uploadFile" callBackListener="editTelTts" callBackFunction="notifyTts"
                namespace="editTelTts">
              </vc:create>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='editTelTts'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="editTelTtsInfo.remark" :placeholder="vc.i18n('选填，请填写备注','editTelTts')"
                class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editTelTts()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
