<div id="addTelMachineUserModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加客服" namespace="addTelMachineUser"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='客服' namespace='addTelMachineUser'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addTelMachineUserInfo.staffId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择操作人','addTelMachineUser')}}
                                </option>
                                <option :value="item.userId" v-for="(item,index) in addTelMachineUserInfo.staffs">{{item.userName}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='默认客服' namespace='addTelMachineUser'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addTelMachineUserInfo.masterFlag">
                                <option selected disabled value="">{{vc.i18n('必填，请选择默认客服','addTelMachineUser')}}
                                </option>
                                <option value="Y">{{vc.i18n('是','addTelMachineUser')}}</option>
                                <option value="N">{{vc.i18n('否','addTelMachineUser')}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" @click="saveTelMachineUserInfo()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
