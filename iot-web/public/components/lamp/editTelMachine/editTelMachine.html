<div id="editTelMachineModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改话机" namespace="editTelMachine"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='设备编码' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editTelMachineInfo.machineCode" type="text"
                :placeholder="vc.i18n('必填，请填写设备编码','editTelMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='设备名称' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editTelMachineInfo.machineName" type="text"
                :placeholder="vc.i18n('必填，请填写设备名称','editTelMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='设备IP' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editTelMachineInfo.machineIp" type="text"
                :placeholder="vc.i18n('必填，请填写设备IP','editTelMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='设备端口' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editTelMachineInfo.machinePort" type="text"
                :placeholder="vc.i18n('必填，请填写设备端口','editTelMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='厂家' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editTelMachineInfo.implBean">
                <option selected disabled value="">{{vc.i18n('请选择厂家','editTelMachine')}}</option>
                <option value="10010">松饼厂家</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='接听提示语' namespace='editTelMachine'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <textarea v-model="editTelMachineInfo.successPrompt"
                :placeholder="vc.i18n('必填，请填写接听提示语','editTelMachine')" class="form-control"></textarea>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='未接听提示语' namespace='editTelMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="editTelMachineInfo.failPrompt" :placeholder="vc.i18n('必填，请填写未接听提示语','editTelMachine')"
                class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editTelMachine()"><i
                class="fa fa-check"></i>&nbsp;<span>
                <vc:i18n name="保存"></vc:i18n>
              </span></button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</div>
