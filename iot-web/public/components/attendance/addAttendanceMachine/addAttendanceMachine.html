<div id="addAttendanceMachineModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="添加" namespace="addAttendanceMachine"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备编码' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAttendanceMachineInfo.machineCode" type="text"
                :placeholder="vc.i18n('必填，请填写设备编码','addAttendanceMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备名称' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAttendanceMachineInfo.machineName" type="text"
                :placeholder="vc.i18n('必填，请填写设备名称','addAttendanceMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备IP' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAttendanceMachineInfo.machineIp" type="text"
                :placeholder="vc.i18n('选填，请填写设备IP','addAttendanceMachine')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='门禁厂家' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addAttendanceMachineInfo.implBean">
                <option selected disabled value="">{{vc.i18n('必填，请选择门禁厂家','addAttendanceMachine')}}</option>
                <option :value="item.hmId" v-for="(item,index) in  addAttendanceMachineInfo.hms">
                  {{item.hmName}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='班组ID' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAttendanceMachineInfo.classesId" type="text"
                :placeholder="vc.i18n('必填，请填写班组ID','addAttendanceMachine')" class="form-control">
              <span>在物业系统OA下的考勤班组中获取</span>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='班组名称' namespace='addAttendanceMachine'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAttendanceMachineInfo.classesName" type="text"
                :placeholder="vc.i18n('必填，请填写班组名称','addAttendanceMachine')" class="form-control">
              <span>在物业系统OA下的考勤班组中获取</span>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="saveAttendanceMachineInfo()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
