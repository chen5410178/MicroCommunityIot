<div id="showAttendanceMachineLogModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="门禁日志" namespace="showAttendanceMachineLog"></vc:i18n>
                </h3>
                <div class="ibox-content">

                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='请求报文' namespace='showAttendanceMachineLog'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="10">{{showAttendanceMachineLogInfo.reqParam}}</textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='返回报文' namespace='showAttendanceMachineLog'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="10">{{showAttendanceMachineLogInfo.resParam}}</textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
