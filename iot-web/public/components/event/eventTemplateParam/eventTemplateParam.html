<div class="margin-top">
    <div class="row margin-top-lg">
        <div class="col-lg-2 padding-right-xs padding-right-xl ">
            <button type="button" class="btn btn-primary btn-sm" style="margin-left:10px" v-on:click="_queryEventTemplateParamMethod()">
                查询
            </button>
            <button type="button" class="btn btn-primary btn-sm" v-on:click="_openAddEventTemplateParamModal()">
                <i class="glyphicon glyphicon-plus"></i>
                <vc:i18n name="添加" namespace="eventTemplateParamManage"></vc:i18n>
            </button>
        </div>
    </div>
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='编号' namespace='eventTemplateParamManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='参数规格' namespace='eventTemplateParamManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='参数值' namespace='eventTemplateParamManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='操作'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="eventTemplateParam in eventTemplateParamInfo.eventTemplateParams">
                    <td class="text-center">{{eventTemplateParam.paramId}}</td>
                    <td class="text-center">{{eventTemplateParam.specCd}}</td>
                    <td class="text-center">{{eventTemplateParam.paramValue}}</td>
                    <td class="text-center">
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs"
                                v-on:click="_openEditEventTemplateParamModel(eventTemplateParam)">
                                <vc:i18n name='修改'></vc:i18n>
                            </button>
                        </div>
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs"
                                v-on:click="_openDeleteEventTemplateParamModel(eventTemplateParam)">
                                <vc:i18n name='删除'></vc:i18n>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="7">
                        <ul class="pagination float-right"></ul>
                    </td>
                </tr>
            </tfoot>
        </table>
        <!-- 分页 -->
        <vc:create path="frame/paginationPlus" namespace="eventTemplateParam"></vc:create>
    </div>

    <vc:create path="event/addEventTemplateParam" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="event/editEventTemplateParam"></vc:create>
    <vc:create path="event/deleteEventTemplateParam"></vc:create>
</div>
