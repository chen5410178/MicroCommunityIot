<div id="viewEventPoolStaffInfoModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="事件处理信息" namespace="viewEventPoolStaffInfo"></vc:i18n>
                </h3>
                <div class="ibox-tools" style="top:10px;">
                    <button type="button" class="btn btn-white btn-sm" style="margin-right:20px;" data-dismiss="modal">
                        <vc:i18n name="返回"></vc:i18n>
                    </button>
                </div>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理员工' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="viewEventPoolStaffInfo.staffName" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='添加时间' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="viewEventPoolStaffInfo.createTime" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理进度' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="viewEventPoolStaffInfo.stateName" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row" v-if="viewEventPoolStaffInfo.state !== 'W'">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='事故原因' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="viewEventPoolStaffInfo.eventReason" class="form-control" disabled rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row"  v-if="viewEventPoolStaffInfo.state !== 'W'">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理方案' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="viewEventPoolStaffInfo.eventResult" class="form-control" disabled rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row" v-if="viewEventPoolStaffInfo.state === 'NC' || viewEventPoolStaffInfo.state === 'TC'">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理时长' namespace='viewEventPoolStaffInfo'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="viewEventPoolStaffInfo.eventHours + 'min'" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="ibox-content" v-if="viewEventPoolStaffInfo.state === 'W'">
                                <button class="btn btn-danger float-right" type="button" v-on:click="cancelEventPoolStaff()">
                                    <vc:i18n name="取消分配"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
