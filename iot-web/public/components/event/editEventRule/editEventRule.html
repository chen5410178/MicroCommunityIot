<div id="editEventRuleModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editEventRule"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row text-right">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name='规则名称' namespace='editEventRule'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editEventRuleInfo.ruleName" type="text"
                                        :placeholder="vc.i18n('必填，请填写规则名称','editEventRule')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row text-right">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name='超时时间' namespace='editEventRule'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editEventRuleInfo.limitTime" type="number"
                                           :placeholder="vc.i18n('必填，请填写超时时间(min)','editEventRule')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row text-right">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name='通知模板' namespace='editEventRule'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editEventRuleInfo.templateId">
                                        <option selected disabled value="">{{vc.i18n('必填，请选择通知模板','editEventRule')}}</option>
                                        <option v-for="(item, index) in eventTemplateList" :key="index" :value="item.templateId">
                                            {{item.templateName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row text-right">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name='备注' namespace='editEventRule'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="editEventRuleInfo.remark" :placeholder="vc.i18n('选填，请填写备注','editEventRule')" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="editEventRule()">
                                    <i class="fa fa-check"></i>
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
