<div id="eventDetailModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="处理事件" namespace="eventDetail"></vc:i18n>
                </h3>
                <div class="ibox-tools" style="top:10px;">
                    <button type="button" class="btn btn-white btn-sm" style="margin-right:20px;" data-dismiss="modal">
                        <vc:i18n name="返回"></vc:i18n>
                    </button>
                </div>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='事件类型' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="event.eventTypeName" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='事件描述' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="event.eventMsg" class="form-control" disabled rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='对象类型' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="event.objTypeName" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='对象名称' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="event.objectName" class="form-control" disabled>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='事故原因' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="eventPoolStaff.eventReason" class="form-control" disabled rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理方案' namespace='eventDetail'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="eventPoolStaff.eventResult" class="form-control" disabled rows="5"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
