<div id="addEventPoolStaffModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="分配事件处理员工" namespace="addEventPoolStaff"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理员工' namespace='addEventPoolStaff'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="addEventPoolStaffInfo.staffId">
                                        <option selected disabled value="">{{vc.i18n('必填，请选择处理员工','addEventPoolStaff')}}</option>
                                        <option v-for="(item, index) in staffList" :key="index" :value="item.userId">
                                            {{item.name}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='事故原因' namespace='addEventPoolStaff'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="addEventPoolStaffInfo.eventReason" :placeholder="vc.i18n('选填，请填写事故原因','addEventPoolStaff')" class="form-control" rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理方案' namespace='addEventPoolStaff'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="addEventPoolStaffInfo.eventResult" :placeholder="vc.i18n('选填，请填写处理方案','addEventPoolStaff')" class="form-control" rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='处理时长' namespace='addEventPoolStaff'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addEventPoolStaffInfo.eventHours" type="number" :placeholder="vc.i18n('必填，请输入处理时长(单位:小时)','addEventPoolStaff')" class="form-control">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button"
                                        v-on:click="saveEventPoolStaffInfo()"><i class="fa fa-check"></i>&nbsp;
                                    <span><vc:i18n name="保存"></vc:i18n></span>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                                        data-dismiss="modal">
                                    <span><vc:i18n name="取消"></vc:i18n></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
