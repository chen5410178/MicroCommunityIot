<div id="viewEventTemplateParam" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">模板参数</h3>
                <div class="ibox-content">
                    <div class="form-group row text-right" v-for="(param, index) in viewEventTemplateParamInfo.paramList">
                        <label class="col-sm-2 col-form-label">
                            {{param.specName}}
                        </label>
                        <div class="col-sm-10">
                            <input v-model="param.paramValue" type="text" class="form-control" disabled>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button type="button" class="btn btn-white float-right"  data-dismiss="modal">
                            <vc:i18n name="关闭" ></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
