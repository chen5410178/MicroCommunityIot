<div class="bg-white margin-top-xs padding border-radius">
    <div class=" ">
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openAddEventTemplateModal()">
            添加
        </button>
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openEditEventTemplateModel()">
            修改
        </button>
        <button type="button" class="btn btn-white btn-sm" v-on:click="_openDeleteEventTemplateModel()" >
            删除
        </button>
    </div>
    <div class="vc-org margin-top">
        <ul>
            <li v-for="(item,index) in eventTemplateDivInfo.eventTemplateList" @click="_switchEventTemplate(item)"
                :class="{'active':item.templateId == eventTemplateDivInfo.curEventTemplate.templateId}">{{item.templateName}}
            </li>
        </ul>
    </div>
    <vc:create path="event/addEventTemplate" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="event/editEventTemplate"></vc:create>
    <vc:create path="event/deleteEventTemplate"></vc:create>
</div>
