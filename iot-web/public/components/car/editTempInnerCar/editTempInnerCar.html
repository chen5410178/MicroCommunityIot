<div id="editTempInnerCarModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <span><vc:i18n name="修改临时内部车" namespace="editTempInnerCar"></vc:i18n></span>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <span><vc:i18n name="车牌号" namespace="editTempInnerCar"></vc:i18n></span>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editTempInnerCarInfo.carNum" type="text"
                                           :placeholder="vc.i18n('必填，请填写车牌号','editTempInnerCar')"
                                           class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <span><vc:i18n name="开始时间" namespace="editTempInnerCar"></vc:i18n></span>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editTempInnerCarInfo.startTime" type="text"
                                           :placeholder="vc.i18n('必填，请填写开始时间','editTempInnerCar')"
                                           class="form-control editTempInnerCarStartTime">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <span><vc:i18n name="结束时间" namespace="editTempInnerCar"></vc:i18n></span>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editTempInnerCarInfo.endTime" type="text"
                                           :placeholder="vc.i18n('必填，请填写结束时间','editTempInnerCar')"
                                           class="form-control editTempInnerCarEndTime">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <span><vc:i18n name="说明" namespace="editTempInnerCar"></vc:i18n></span>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="editTempInnerCarInfo.remark" :placeholder="vc.i18n('请输入说明','editTempInnerCar')" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button"
                                        v-on:click="editTempInnerCar()">
                                    <i class="fa fa-check"></i>&nbsp;保存
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                                        data-dismiss="modal">
                                    <span><vc:i18n name="取消" namespace="editTempInnerCar"></vc:i18n></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
