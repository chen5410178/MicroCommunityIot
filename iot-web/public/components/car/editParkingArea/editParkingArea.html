<div id="editParkingAreaModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editParkingArea"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><vc:i18n name='停车场编号' namespace='editParkingArea'></vc:i18n></label>
                                <div class="col-sm-10">
                                    <input v-model="editParkingAreaInfo.num" type="text" :placeholder="vc.i18n('必填，请填写停车场编号','editParkingArea')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><vc:i18n name='类型' namespace='editParkingArea'></vc:i18n> </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editParkingAreaInfo.typeCd">
                                        <option selected  disabled value="">{{vc.i18n('必填，请选择类型' ,'editParkingArea')}}</option>
                                        <option  value="1001">{{vc.i18n('地上停车场' ,'editParkingArea')}} </option>
                                       <option  value="2002">{{vc.i18n('地下停车场' ,'editParkingArea')}} </option>
                                  </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><span><vc:i18n name='三方ID' namespace='editParkingArea'></vc:i18n></span> </label>
                                <div class="col-sm-10">
                                    <input v-model="editParkingAreaInfo.extPaId" type="text" :placeholder="vc.i18n('选填，请填写三方停车场ID','editParkingArea')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label"><span><vc:i18n name='备注' namespace='editParkingArea'></vc:i18n></span> </label>
                                <div class="col-sm-10">
                                    <textarea v-model="editParkingAreaInfo.remark" :placeholder="vc.i18n('选填，请填写备注','editParkingArea')" class="form-control"></textarea>
                                </div>
                            </div>

                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="editParkingArea()"><i class="fa fa-check"></i>&nbsp;<span><vc:i18n name="保存"></vc:i18n></span></button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal"><span><vc:i18n name="取消"></vc:i18n></span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
