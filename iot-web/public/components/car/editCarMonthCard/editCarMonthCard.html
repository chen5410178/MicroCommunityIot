<div id="editCarMonthCardModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editCarMonthCard"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='名称' namespace='editCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editCarMonthCardInfo.cardName" type="text"
                :placeholder="vc.i18n('必填，请填写名称','editCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='月' namespace='editCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editCarMonthCardInfo.cardMonth" type="number"
                :placeholder="vc.i18n('必填，请填写月','editCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='月价' namespace='editCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editCarMonthCardInfo.cardPrice" type="number"
                :placeholder="vc.i18n('必填，请填写月价','editCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace=' editCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="editCarMonthCardInfo.remark" :placeholder="vc.i18n('选填，请填写备注','editCarMonthCard')"
                class="form-control"></textarea>
            </div>
          </div>
          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editCarMonthCard()"><i
                class="fa fa-check"></i>&nbsp;<span>
                <vc:i18n name="保存"></vc:i18n>
              </span></button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
              data-dismiss="modal"><span>
                <vc:i18n name="取消"></vc:i18n>
              </span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
