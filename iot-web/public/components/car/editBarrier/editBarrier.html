<div id="editBarrierModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editBarrier"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备编码' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editBarrierInfo.machineCode" type="text"
                :placeholder="vc.i18n('必填，请填写设备编码','editBarrier')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备名称' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editBarrierInfo.machineName" type="text"
                :placeholder="vc.i18n('必填，请填写设备名称','editBarrier')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备IP' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editBarrierInfo.machineIp" type="text" :placeholder="vc.i18n('必填，请填写设备IP','editBarrier')"
                class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='设备方向' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editBarrierInfo.direction">
                <option selected disabled value="">{{vc.i18n('必填，请选择设备方向' ,'editBarrier')}}</option>
                <option value="3306">{{vc.i18n('进' ,'editBarrier')}} </option>
                <option value="3307">{{vc.i18n('出' ,'editBarrier')}} </option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='道闸厂家' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editBarrierInfo.implBean">
                <option selected disabled value="">{{vc.i18n('必填，请选择道闸厂家' ,'editBarrier')}}</option>
                <option  :value="item.hmId" v-for="(item,index) in  editBarrierInfo.hms">{{item.hmName}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='岗亭ID' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editBarrierInfo.boxId">
                <option selected disabled value="">{{vc.i18n('必填，请选择岗亭ID' ,'editBarrier')}}</option>
                <option  :value="item.boxId" v-for="(item,index) in  editBarrierInfo.parkingBoxs">{{item.boxName}}</option>

              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label ">
              <vc:i18n name='监控视频' namespace='editBarrier'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editBarrierInfo.monitorId">
                <option selected disabled value="">{{vc.i18n('选填，请选择监控视频','editBarrier')}}</option>
                <option value="-1">{{vc.i18n('没有监控','editBarrier')}}</option>
                <option :value="item.machineId" v-for="(item,index) in  editBarrierInfo.monitors">
                  {{item.machineName}}</option>
              </select>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editBarrier()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
