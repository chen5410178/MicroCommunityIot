<div id="addParkingSpaceModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addParkingSpace"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='车位编号' namespace='addParkingSpace'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addParkingSpaceInfo.num" type="text"
                                :placeholder="vc.i18n('必填，请填写车位编号','addParkingSpace')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='停车场' namespace='addParkingSpace'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addParkingSpaceInfo.paId" @change="_queryAddParkingRegions()">
                                <option selected value="">请选择停车场</option>
                                <option :value="item.paId" v-for="(item,index) in  addParkingSpaceInfo.parkingAreas">
                                    {{item.num}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='停车区域' namespace='addParkingSpace'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addParkingSpaceInfo.prId">
                                <option selected value="">选填，请选择停车区域</option>
                                <option :value="item.prId" v-for="(item,index) in  addParkingSpaceInfo.parkingRegions">
                                    {{item.regionCode}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='车位类型' namespace='addParkingSpace'></vc:i18n>
                            </span></label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addParkingSpaceInfo.parkingType">
                                <option selected disabled value="">{{vc.i18n('必填，请选择车位类型','addParkingSpace')}}</option>
                                <option value="1">{{vc.i18n('普通车位','addParkingSpace')}}</option>
                                <option value="2">{{vc.i18n('子母车位','addParkingSpace')}}</option>
                                <option value="3">{{vc.i18n('豪华车位','addParkingSpace')}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='备注' namespace='addParkingSpace'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="addParkingSpaceInfo.remark"
                                :placeholder="vc.i18n('必填，请填写备注','addParkingSpace')" class="form-control"></textarea>
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="saveParkingSpaceInfo()">
                                <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                                <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
