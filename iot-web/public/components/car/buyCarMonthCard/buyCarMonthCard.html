<div id="buyCarMonthCardModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="购买月卡" namespace="buyCarMonthCard"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='车牌号' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="buyCarMonthCardInfo.carNum" type="text" @blue="_queryOwnerCar()"
                :placeholder="vc.i18n('必填，请填写车牌号','buyCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='月卡' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="buyCarMonthCardInfo.cardId" @change="_changeCard()">
                <option selected disabled value="">
                  {{vc.i18n('必填，请选择月卡','addChargeMonthOrder')}}
                </option>
                <option v-for="(item,index) in buyCarMonthCardInfo.cards" :key="index" v-bind:value="item.cardId">
                  {{item.cardName}}({{item.cardMonth}}月)
                </option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='支付方式' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="buyCarMonthCardInfo.primeRate">
                <option selected disabled value="">{{vc.i18n('必填，请选择支付方式','buyCarMonthCard')}}
                </option>
                <option v-for="(item,index) in buyCarMonthCardInfo.primeRates" :key="index"
                  v-if="item.statusCd != '5' && item.statusCd != '6'" :value="item.statusCd">
                  {{item.name}}
                </option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='应收金额' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="buyCarMonthCardInfo.receivableAmount" type="text" disabled
                :placeholder="vc.i18n('必填，请填写应收金额','buyCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='实收金额' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="buyCarMonthCardInfo.receivedAmount" type="number"
                :placeholder="vc.i18n('必填，请填写实收金额','buyCarMonthCard')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='buyCarMonthCard'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="buyCarMonthCardInfo.remark" :placeholder="vc.i18n('必填，请填写备注','buyCarMonthCard')"
                class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="saveCarMonthOrderInfo()">
              <vc:i18n name="提交"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
