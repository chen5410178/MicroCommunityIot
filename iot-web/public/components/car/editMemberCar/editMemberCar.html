<div id="editMemberCarModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editMemberCar"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='车牌号' namespace='editMemberCar'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editMemberCarInfo.carNum" type="text" :placeholder="vc.i18n('必填，请填写车牌号','editMemberCar')"
                class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='车类型' namespace='editMemberCar'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editMemberCarInfo.carType">
                <option selected disabled value="">
                  {{vc.i18n('必填，请选择车辆类型','hireParkingSpace')}}
                </option>
                <option v-for="carType in editMemberCarInfo.carTypes" :key="carType.statusCd"
                  v-bind:value="carType.statusCd">{{carType.name}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='editMemberCar'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="editMemberCarInfo.remark" :placeholder="vc.i18n('选填，请填写备注','editMemberCar')"
                class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editMemberCar()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
