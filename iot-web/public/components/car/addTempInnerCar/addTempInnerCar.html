<div id="addTempInnerCarModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加临时内部车" namespace="addTempInnerCar"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name="收费名称" namespace="addTempInnerCar"></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addTempInnerCarInfo.feeName" type="text" readonly class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name="车牌号" namespace="addTempInnerCar"></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addTempInnerCarInfo.carNum" type="text" :placeholder="vc.i18n('必填，请填写车牌号','addTempInnerCar')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name="开始时间" namespace="addTempInnerCar"></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addTempInnerCarInfo.startTime" type="text" :placeholder="vc.i18n('必填，请填写开始时间','addTempInnerCar')" class="form-control addTempInnerCarStartTime">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name="结束时间" namespace="addTempInnerCar"></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addTempInnerCarInfo.endTime" type="text" :placeholder="vc.i18n('必填，请填写结束时间','addTempInnerCar')" class="form-control addTempInnerCarEndTime">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label">
                                    <vc:i18n name="说明" namespace="addTempInnerCar"></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="addTempInnerCarInfo.remark" :placeholder="vc.i18n('请输入说明','addTempInnerCar')" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="saveTempInnerCarInfo()">
                                    <i class="fa fa-check"></i>&nbsp;保存
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <span><vc:i18n name="取消" namespace="addTempInnerCar"></vc:i18n></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
