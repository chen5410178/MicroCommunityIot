<div id="authAppUserModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="审核" namespace="authAppUser"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='人员名称' namespace='authAppUser'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="authAppUserInfo.ownerName" type="text" disabled
                :placeholder="vc.i18n('必填，请填写人员名称','authAppUser')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='联系人手机号' namespace='authAppUser'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="authAppUserInfo.link" type="text" disabled
                :placeholder="vc.i18n('必填，请填写联系人手机号','authAppUser')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='房屋名称' namespace='authAppUser'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="authAppUserInfo.roomName" type="text" disabled
                :placeholder="vc.i18n('必填，请填写房屋名称','authAppUser')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='状态类型' namespace='authAppUser'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="authAppUserInfo.state">
                <option selected disabled value="">{{vc.i18n('必填，请选择状态类型' ,'authAppUser')}}</option>
                <option value="12000">{{vc.i18n('审核成功' ,'authAppUser')}} </option>
                <option value="13000">{{vc.i18n('审核失败' ,'authAppUser')}} </option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='审核说明' namespace='authAppUser'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="authAppUserInfo.stateMsg" :placeholder="vc.i18n('选填，请填写审核说明','authAppUser')"
                class="form-control"></textarea>
            </div>
          </div>
          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="_authAppUser()">
              <vc:i18n name="提交"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
