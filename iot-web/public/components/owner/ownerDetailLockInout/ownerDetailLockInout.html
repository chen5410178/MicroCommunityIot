    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='进出编号' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='门锁名称' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='门锁编码' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='业主名称' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='业主手机号' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='开门方式' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='开门状态' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='创建时间' namespace='ownerDetailLockInout'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="lockInout in ownerDetailLockInoutInfo.inouts">
                    <td class="text-center">{{lockInout.inoutId}}</td>
                    <td class="text-center">{{lockInout.machineName}}</td>
                    <td class="text-center">{{lockInout.machineCode}}</td>
                    <td class="text-center">{{lockInout.userName}}</td>
                    <td class="text-center">{{lockInout.tel}}</td>
                    <td class="text-center">
                        <label v-if="lockInout.openTypeCd === '1001'">
                            {{vc.i18n('密码开锁','ownerDetailLockInout')}}
                        </label>
                        <label v-if="lockInout.openTypeCd === '2002'">
                            {{vc.i18n('蓝牙开锁','ownerDetailLockInout')}}
                        </label>
                    </td>
                    <td class="text-center">
                        <label v-if="lockInout.state === 'C'">
                            {{vc.i18n('开门成功','ownerDetailLockInout')}}
                        </label>
                        <label v-if="lockInout.state === 'F'">
                            {{vc.i18n('开门失败','ownerDetailLockInout')}}
                        </label>
                    </td>
                    <td class="text-center">{{lockInout.createTime}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="ownerDetailLockInout" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
