<div class="margin-top">
    <div class="row margin-top-lg">
        <div class="col-lg-2 padding-right-xs padding-right-xl ">
            <button type="button" class="btn btn-primary btn-sm" style="margin-left:10px"
                v-on:click="_queryChargeRuleFeeMethod()">
                查询
            </button>
            <button type="button" class="btn btn-primary btn-sm" v-if="chargeRuleFeeInfo.chargeRuleFees.length < 1" v-on:click="_openAddChargeRuleFeeModal()">
                    <vc:i18n name="添加" namespace="marketTextManage"></vc:i18n>
            </button>
        </div>
    </div>
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='编号' namespace='chargeRuleFee'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='最大功率' namespace='chargeRuleFee'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='电费单价' namespace='chargeRuleFee'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='服务费单价' namespace='chargeRuleFee'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='备注' namespace='chargeRuleFee'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='操作'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="chargeRuleFee in chargeRuleFeeInfo.chargeRuleFees">
                    <td class="text-center">{{chargeRuleFee.crfId}}</td>
                    <td  class="text-center">
                        {{chargeRuleFee.maxEnergyPrice}}
                    </td> 
                    <td class="text-center">{{chargeRuleFee.durationPrice}}</td>
                    <td class="text-center">{{chargeRuleFee.servicePrice}}</td>
                    <td class="text-center">{{chargeRuleFee.remark}}</td>
                    <td class="text-center">
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs"
                                v-on:click="_openEditChargeRuleFeeModel(chargeRuleFee)">
                                    <vc:i18n name='修改'></vc:i18n>
                            </button>
                        </div>
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs"
                                v-on:click="_openDeleteChargeRuleFeeModel(chargeRuleFee)">
                                    <vc:i18n name='删除'></vc:i18n>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <vc:create path="frame/paginationPlus" namespace="chargeRuleFee"></vc:create>
    </div>

    <vc:create path="charge/addChargeRuleFee" callBackListener="" callBackFunction=""></vc:create>
    <vc:create path="charge/editChargeRuleFee"></vc:create>
    <vc:create path="charge/deleteChargeRuleFee"></vc:create>
</div>
