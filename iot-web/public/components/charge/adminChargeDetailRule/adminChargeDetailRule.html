<div class="margin-top">
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='规则' namespace='adminChargeDetailRule'></vc:i18n>
                    </th>
                    <th v-if="adminChargeDetailRuleInfo.chargeType == '1001'" class="text-center">
                        <vc:i18n name='功率' namespace='adminChargeDetailRule'></vc:i18n>
                    </th>
                    <th v-if="adminChargeDetailRuleInfo.chargeType == '1002'" class="text-center">
                        <vc:i18n name='时段' namespace='adminChargeDetailRule'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='小时电价' namespace='adminChargeDetailRule'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="chargeRuleFee in adminChargeDetailRuleInfo.rules">
                    <td class="text-center">{{chargeRuleFee.ruleName}}</td>
                    <td v-if="adminChargeDetailRuleInfo.chargeType == '1001'" class="text-center">{{chargeRuleFee.minEnergyPrice}}~<br/>
                        {{chargeRuleFee.maxEnergyPrice}}
                    </td>
                    <td v-if="adminChargeDetailRuleInfo.chargeType == '1002'" class="text-center">{{chargeRuleFee.startTime}}~<br/>
                        {{chargeRuleFee.endTime}}
                    </td>
                    <td class="text-center">{{chargeRuleFee.durationPrice}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="adminChargeDetailRule" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
