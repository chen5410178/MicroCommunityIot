<div id="returnChargeMoneyModel" class="modal" role="dialog" aria-labelledby="exampleModalLabel">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b "><span>
                        <vc:i18n name="订单退款" namespace="returnChargeMoney"></vc:i18n>
                    </span></h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='订单编号' namespace='returnChargeMoney'></vc:i18n>
                            </span> </label>
                        <div class="col-sm-10" style="margin-top: 7px;">
                            {{returnChargeMoneyInfo.conditions.orderId}}
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='总扣款' namespace='returnChargeMoney'></vc:i18n>
                            </span> </label>
                        <div class="col-sm-10" style="margin-top: 7px;">
                            {{returnChargeMoneyInfo.totalMoney}} 元
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='充电时间' namespace='returnChargeMoney'></vc:i18n>
                            </span> </label>
                        <div class="col-sm-10" style="margin-top: 7px;">
                            <div v-for="(acct, index) in returnChargeMoneyInfo.chargeMachineOrderAcctss">
                                <div v-if="index === 0">{{acct.startTime}}~{{acct.endTime}}</div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='本次退款' namespace='returnChargeMoney'></vc:i18n>
                            </span> </label>
                        <div class="col-sm-6">
                            <input v-model="returnChargeMoneyInfo.returnMoney" type="number"
                                   :placeholder="vc.i18n('必填，请输入退款金额','returnChargeMoney')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label"><span>
                                <vc:i18n name='备注' namespace='returnChargeMoney'></vc:i18n>
                            </span> </label>
                        <div class="col-sm-10">
                            <textarea v-model="returnChargeMoneyInfo.remark"
                                :placeholder="vc.i18n('必填，请填写退款原因','returnChargeMoney')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="returnChargeMoney()"><i
                                class="fa fa-check"></i>&nbsp;<span>
                                <vc:i18n name="保存"></vc:i18n>
                            </span></button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal"><span>
                                <vc:i18n name="取消"></vc:i18n>
                            </span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
