<div id="worklicenseWhiteLineModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="设置通话白名单" namespace="worklicenseWhiteLine"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='号码1' namespace='worklicenseWhiteLine'></vc:i18n>
                        </label>
                        <div class="col-sm-6">
                            <input v-model="worklicenseWhiteLineInfo.tel1" type="number"
                                   :placeholder="vc.i18n('必填，请填写手机号','worklicenseWhiteLine')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='号码2' namespace='worklicenseWhiteLine'></vc:i18n>
                        </label>
                        <div class="col-sm-6">
                            <input v-model="worklicenseWhiteLineInfo.tel2" type="number"
                                   :placeholder="vc.i18n('请填写手机号','worklicenseWhiteLine')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='号码3' namespace='worklicenseWhiteLine'></vc:i18n>
                        </label>
                        <div class="col-sm-6">
                            <input v-model="worklicenseWhiteLineInfo.tel3" type="number"
                                   :placeholder="vc.i18n('请填写手机号','worklicenseWhiteLine')" class="form-control">
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button"
                            v-on:click="_saveWhiteList()">
                                <vc:i18n name="提交"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
