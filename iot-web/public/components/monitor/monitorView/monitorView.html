<div class="monitorView" v-if="monitorViewInfo.datas.length>0">
    <div class="flex justify-start" >
        <div class="monitorView-1">
            <div class="item" :class="monitorViewInfo.datas[0].active" @click="_changeSelectCameraView(1)">
                <div id="monitor-channel-1" class="i">通道1</div>
            </div>
        </div>
        <div class="monitorView-2">
            <div class="item " :class="monitorViewInfo.datas[1].active" @click="_changeSelectCameraView(2)">
                <div id="monitor-channel-2" class="i">通道2</div>
            </div>
            <div  class="item" :class="monitorViewInfo.datas[2].active"
                @click="_changeSelectCameraView(3)">
                <div id="monitor-channel-3" class="i">通道3</div>
            </div>
            <div  class="item" :class="monitorViewInfo.datas[3].active"
                @click="_changeSelectCameraView(4)">
                <div id="monitor-channel-4" class="i">通道4</div>
            </div>
        </div>
    </div>
    <div class="flex justify-start monitorView-3">
        <div  class="item" :class="monitorViewInfo.datas[4].active"
            @click="_changeSelectCameraView(5)">
            <div id="monitor-channel-5" class="i">通道5</div>
        </div>
        <div class="item" :class="monitorViewInfo.datas[5].active"
            @click="_changeSelectCameraView(6)">
            <div id="monitor-channel-6"  class="i">通道6</div>
        </div>
        <div class="item" :class="monitorViewInfo.datas[6].active"
            @click="_changeSelectCameraView(7)" style="padding-right: 0px;">
            <div id="monitor-channel-7" class="i">通道7</div>
        </div>
        <div class="item" :class="monitorViewInfo.datas[7].active"
            @click="_changeSelectCameraView(8)" style="padding-right: 0px;padding-left: 5px;">
            <div id="monitor-channel-8" class="i">通道8</div>
        </div>
    </div>

    <div class="flex justify-between monitorView-4">
        <div class="fex justify-start">
            <img src="/img/1-camera.png" @click="toScreenPage(1)"/>
            <img src="/img/4-camera.png" @click="toScreenPage(4)"/>
            <img src="/img/8s-camera.png" @click="toScreenPage(8)"/>
            <img src="/img/9-camera.png" @click="toScreenPage(9)"/>
        </div>
        <div>数据来源于MVideo监控平台</div>
    </div>

</div>
