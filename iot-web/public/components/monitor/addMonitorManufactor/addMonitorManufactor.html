<div id="addMonitorManufactorModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="添加" namespace="addMonitorManufactor"></vc:i18n>
        </h3>
        <div class="ibox-content">

          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='厂家名称' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addMonitorManufactorInfo.mmName" type="text"
                :placeholder="vc.i18n('必填，请填写厂家名称','addMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='系统地址' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addMonitorManufactorInfo.mmUrl" type="text"
                :placeholder="vc.i18n('必填，请填写厂家系统地址','addMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='厂家类型' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addMonitorManufactorInfo.mmBean">
                <option selected disabled value="">{{vc.i18n('必填，请选择厂家类型','addMonitorManufactor')}}</option>
                <option :value="item.statusCd" v-for="(item,index) in addMonitorManufactorInfo.mmBeans">{{item.name}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='APP_ID' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addMonitorManufactorInfo.appId" type="text"
                :placeholder="vc.i18n('必填，请填写APP_ID','addMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='秘钥' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addMonitorManufactorInfo.appSecure" type="text"
                :placeholder="vc.i18n('必填，请填写秘钥','addMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='addMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="addMonitorManufactorInfo.remark"
                :placeholder="vc.i18n('选填，请填写备注','addMonitorManufactor')" class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="saveMonitorManufactorInfo()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
