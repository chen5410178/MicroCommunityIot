<div id="addMonitorMachinePersonModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addMonitorMachinePerson"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='监控用户' namespace='addMonitorMachinePerson'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachinePersonInfo.mmuId" type="text"
                                :placeholder="vc.i18n('必填，请填写监控用户','addMonitorMachinePerson')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='名称' namespace='addMonitorMachinePerson'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachinePersonInfo.machineName" type="text"
                                :placeholder="vc.i18n('必填，请填写名称','addMonitorMachinePerson')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='人员类型' namespace='addMonitorMachinePerson'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachinePersonInfo.personType" type="text"
                                :placeholder="vc.i18n('必填，请填写人员类型','addMonitorMachinePerson')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='人员' namespace='addMonitorMachinePerson'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachinePersonInfo.personName" type="text"
                                :placeholder="vc.i18n('必填，请填写人员','addMonitorMachinePerson')" class="form-control">
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button"
                            v-on:click="saveMonitorMachinePersonInfo()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
