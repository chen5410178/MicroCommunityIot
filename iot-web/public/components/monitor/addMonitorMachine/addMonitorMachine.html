<div id="addMonitorMachineModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addMonitorMachine"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控名称' namespace='addMonitorMachine'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachineInfo.machineName" type="text"
                                :placeholder="vc.i18n('必填，请填写监控名称','addMonitorMachine')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控编号' namespace='addMonitorMachine'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachineInfo.machineCode" type="text"
                                :placeholder="vc.i18n('必填，请填写监控编号','addMonitorMachine')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控位置' namespace='addMonitorMachine'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addMonitorMachineInfo.locationName" type="text"
                                :placeholder="vc.i18n('必填，请填写监控位置','addMonitorMachine')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控区域' namespace='addMonitorMachine'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addMonitorMachineInfo.maId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择监控区域','addMonitorMachine')}}
                                </option>
                                <option v-for="(item, index) in monitorAreaList" :key="index" :value="item.maId">
                                    {{item.maName}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控平台' namespace='addMonitorMachine'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addMonitorMachineInfo.mmId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择监控平台','addMonitorMachine')}}
                                </option>
                                <option v-for="(item, index) in addMonitorMachineInfo.manufactors" :key="index" :value="item.mmId">
                                    {{item.mmName}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="saveMonitorMachineInfo()">
                            <i class="fa fa-check"></i>
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
