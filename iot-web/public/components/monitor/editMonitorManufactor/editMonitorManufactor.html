<div id="editMonitorManufactorModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editMonitorManufactor"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='厂家名称' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editMonitorManufactorInfo.mmName" type="text"
                :placeholder="vc.i18n('必填，请填写厂家名称','editMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='系统地址' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editMonitorManufactorInfo.mmUrl" type="text"
                :placeholder="vc.i18n('必填，请填写厂家系统地址','editMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='厂家类型' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editMonitorManufactorInfo.mmBean">
                <option selected disabled value="">{{vc.i18n('必填，请选择厂家类型','editMonitorManufactor')}}</option>
                <option :value="item.statusCd" v-for="(item,index) in editMonitorManufactorInfo.mmBeans">{{item.name}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='APP_ID' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editMonitorManufactorInfo.appId" type="text"
                :placeholder="vc.i18n('必填，请填写APP_ID','editMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='秘钥' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="editMonitorManufactorInfo.appSecure" type="text"
                :placeholder="vc.i18n('必填，请填写秘钥','editMonitorManufactor')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='editMonitorManufactor'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="editMonitorManufactorInfo.remark"
                :placeholder="vc.i18n('选填，请填写备注','editMonitorManufactor')" class="form-control"></textarea>
                
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editMonitorManufactor()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
