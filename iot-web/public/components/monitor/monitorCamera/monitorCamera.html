<div class="monitorCamera">
    <div class="big-title">
        <span class="fa fa-th-large"></span>
        <span>设备列表</span>
    </div>
    <div class="big-content">
        <div>
            <vc:create path="monitor/videoTree"></vc:create>
        </div>
    </div>
    <div class="big-title margin-top-xs">
        <span class="fa fa-folder"></span>
        <span>收藏视频</span>
    </div>
    <div class="big-content-last">
        <div>
            <div v-for="(item,index) in monitorCameraInfo.collects" class="margin-bottom item" :key="index" @click="_selectCollectVideo(item)">
                <span class="fa fa-camera"></span>
                {{item.machineName}}</div>
        </div>
    </div>
  
</div>
