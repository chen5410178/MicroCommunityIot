<div class="monitorView" v-if="monitorViewFourInfo.datas.length>0">
    <div class="monitorViewFour-1 flex justify-start flex-wrap">
        <div class="padding-xs" style="width: 50%;" v-for="(item,index) in monitorViewFourInfo.datas" :key="index">
            <div class="item" :class="item.active" @click="_changeSelectCameraFourView(index+1)">
                <div :id="'monitor-channel-'+(index+1)" class="i">通道{{index+1}}</div>
            </div>
        </div>
    </div>
    <div class="flex justify-between monitorView-4">
        <div class="fex justify-start">
            <img src="/img/1-camera.png" @click="toScreenPage(1)" />
            <img src="/img/4s-camera.png" @click="toScreenPage(4)" />
            <img src="/img/8-camera.png" @click="toScreenPage(8)" />
            <img src="/img/9-camera.png" @click="toScreenPage(9)" />
        </div>
        <div>数据来源于MVideo监控平台</div>
    </div>

</div>
