<div class="slider-verify-compact">
  <div class="slider-bar" v-bind:class="{ verified: verified }" v-on:mousedown="openDialog" v-on:touchstart="openDialog">
    <div class="slider-btn"></div>
    <span class="slider-text">{{ verified ? '验证通过' : '请按住滑块拖动' }}</span>
  </div>

  <div class="slider-dialog-overlay" v-if="showDialog">
    <div class="slider-dialog">
      <div class="slider-dialog-header">
        <span>请完成安全验证</span>
        <span class="slider-dialog-close" v-on:click="closeDialog">&times;</span>
      </div>
      <div class="slider-bg-wrap">
        <img v-bind:src="bgImage" class="slider-bg" />
        <img v-bind:src="sliderImage" class="slider-block" v-bind:style="{ top: sliderY + 'px', left: currentX + 'px' }" />
      </div>
      <div class="slider-dialog-bar">
        <div class="slider-dialog-btn" v-on:mousedown="onDialogDragStart" v-on:touchstart="onDialogDragStart"></div>
        <span class="slider-text">{{ dialogSliderText }}</span>
      </div>
      <div class="slider-dialog-tip">拖动滑块完成拼图</div>
    </div>
  </div>
</div>
