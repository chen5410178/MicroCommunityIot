<div id="visitAuthModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b "><span><vc:i18n name="审核" namespace="visitAuth"></vc:i18n></span></h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='姓名' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editVisitInfo.name" type="text" disabled
                                :placeholder="vc.i18n('必填，请填写姓名','visitAuth')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='性别' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editVisitInfo.visitGender" disabled>
                                <option selected disabled value="">{{vc.i18n('必填，请选择性别','visitAuth')}}</option>
                                <option value="0">男</option>
                                <option value="1">女</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='电话号码' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editVisitInfo.phoneNumber" type="text" disabled
                                :placeholder="vc.i18n('必填，请填写电话号码','visitAuth')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='访客类型' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editVisitInfo.typeId" disabled>
                                <option selected disabled value="">{{vc.i18n('必填，请选择访客类型','visitAuth')}}</option>
                                <option v-for="(item, index) in visitTypeList" :key="index" :value="item.typeId">
                                    {{item.name}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='拜访房屋' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editVisitInfo.roomName" type="text"
                                disabled :placeholder="vc.i18n('必填，请选择拜访房屋','visitAuth')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='拜访业主' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-3">
                            <input v-model="editVisitInfo.ownerName" disabled type="text"
                                :placeholder="vc.i18n('选填，请选择业主','visitAuth')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='拜访时间' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editVisitInfo.visitTime" type="text" disabled
                                :placeholder="vc.i18n('选填，请选择开始时间','visitAuth')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='离开时间' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editVisitInfo.departureTime" type="text" disabled
                                :placeholder="vc.i18n('选填，请选择离开时间','visitAuth')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='拜访事由' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="editVisitInfo.visitCase" type="text" rows="5" disabled
                                :placeholder="vc.i18n('选填，请填写拜访事由','visitAuth')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='审核状态' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="editVisitInfo.state">
                                <option v-for="(item, index) in stateList" :key="index" :value="item.statusCd">
                                    {{item.name}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='审核备注' namespace='visitAuth'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="editVisitInfo.msg" type="text" rows="5"
                                :placeholder="vc.i18n('选填，请填写审核备注','visitAuth')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="visitAuth()">
                            <i class="fa fa-check"></i>&nbsp;
                            <vc:i18n name="提交"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
