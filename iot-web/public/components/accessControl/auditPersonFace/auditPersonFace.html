<div id="auditPersonFaceModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="人脸审核" namespace="auditPersonFace"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='房屋名称' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-4">
              <input v-model="auditPersonFaceInfo.roomName" disabled type="text" class="form-control">
            </div>
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='人员名称' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-4">
              <input v-model="auditPersonFaceInfo.personName" disabled type="text"
                :placeholder="vc.i18n('必填，请填写人员名称','auditPersonFace')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='人员电话' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-4">
              <input v-model="auditPersonFaceInfo.personTel" disabled type="text"
                :placeholder="vc.i18n('必填，请填写人员电话','auditPersonFace')" class="form-control">
            </div>
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='人员类型' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-4">
              <input v-model="auditPersonFaceInfo.ownerTypeCdName" disabled type="text"
                :placeholder="vc.i18n('必填，请填写人员类型','auditPersonFace')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='人脸' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <img :src="auditPersonFaceInfo.faceUrl" style="width: 60px;height: 60px;border-radius: 5px;">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='审核' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-10">
                <select class="custom-select" v-model="auditPersonFaceInfo.state">
                  <option disabled selected value="">{{vc.i18n('必填，请选择','addVisitType')}}</option>
                  <option value="C">同意</option>
                  <option value="F">决绝</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='审核说明' namespace='auditPersonFace'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="auditPersonFaceInfo.remark" :placeholder="vc.i18n('必填，请填写审核说明','auditPersonFace')"
                class="form-control"></textarea>
            </div>
          </div>
          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="auditPersonFace()">
              <vc:i18n name="提交"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
