<div id="addAccessControlModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addAccessControl"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁名称' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="addAccessControlInfo.machineName" type="text"
                                :placeholder="vc.i18n('必填，请填写门禁名称','addAccessControl')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁编码' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="addAccessControlInfo.machineCode" type="text"
                                :placeholder="vc.i18n('必填，请填写门禁编码','addAccessControl')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='IP' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="addAccessControlInfo.machineIp" type="text"
                                :placeholder="vc.i18n('选填，请填写门禁IP','addAccessControl')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='Mac' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="addAccessControlInfo.machineMac" type="text"
                                :placeholder="vc.i18n('选填，请填写门禁mac','addAccessControl')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='方向' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.direction">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁方向','addAccessControl')}}</option>
                                <option value="3306">{{vc.i18n('进','addAccessControl')}}</option>
                                <option value="3307">{{vc.i18n('出','addAccessControl')}}</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='位置' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.locationId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择位置','addAccessControl')}}</option>
                                <option :value="item.locationId"
                                    v-for="(item,index) in  addAccessControlInfo.locations">{{item.locationName}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁厂家' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.implBean">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁厂家','addAccessControl')}}</option>
                                <option :value="item.hmId" v-for="(item,index) in  addAccessControlInfo.hms">
                                    {{item.hmName}}</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='监控视频' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.monitorId">
                                <option selected disabled value="">{{vc.i18n('选填，请选择监控视频','addAccessControl')}}</option>
                                <option value="-1">{{vc.i18n('没有监控','addAccessControl')}}</option>
                                <option :value="item.machineId" v-for="(item,index) in  addAccessControlInfo.monitors">
                                    {{item.machineName}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='开门提示' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.promptSwitch">
                                <option selected disabled value="">{{vc.i18n('必填，请选择开门提示','addAccessControl')}}</option>
                                <option value="ON">{{vc.i18n('是','addAccessControl')}}</option>
                                <option value="OFF">{{vc.i18n('否','addAccessControl')}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='呼叫平台' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="addAccessControlInfo.platformId">
                                <option selected disabled value="">{{vc.i18n('选填，请选择平台','addAccessControl')}}</option>
                                <option :value="item.platformId"
                                        v-for="(item,index) in  accessControlManageInfo.callingPlatforms">{{item.platformName}}
                                </option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='呼叫号码' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="addAccessControlInfo.callingNum" type="text"
                                   :placeholder="vc.i18n('选填，请填写呼叫号码','addAccessControl')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row" v-if="addAccessControlInfo.promptSwitch == 'ON'">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='正常提示' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="addAccessControlInfo.normalPrompt" 
                                :placeholder="vc.i18n('必填，请填写正常提示','addAccessControl')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="form-group row" v-if="addAccessControlInfo.promptSwitch == 'ON'">
                       
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='欠费提示' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10 ">
                            <textarea v-model="addAccessControlInfo.owePrompt"
                                :placeholder="vc.i18n('必填，请填写欠费提示','addAccessControl')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">

                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='备注' namespace='addAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10 ">
                            <textarea v-model="addAccessControlInfo.remark"
                                      :placeholder="vc.i18n('选填','addAccessControl')" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="saveAccessControlInfo()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
