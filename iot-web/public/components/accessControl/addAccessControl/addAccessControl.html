<div id = "addAccessControlModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true" >
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b "><span><vc:i18n name="添加门禁" namespace="addAccessControl"></vc:i18n></span></h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='设备编码' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.machineCode"                   type="text" :placeholder="vc.i18n('必填，请填写设备编码','addAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='设备名称' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.machineName"                   type="text" :placeholder="vc.i18n('必填，请填写设备名称','addAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='设备IP' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.machineIp"                   type="text" :placeholder="vc.i18n('必填，请填写设备IP','addAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='设备mac' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.machineMac"                   type="text" :placeholder="vc.i18n('必填，请填写设备mac','addAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='设备方向进出' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
<select class="custom-select" v-model="addAccessControlInfo.direction">
         <option selected  disabled value="">{{vc.i18n('必填，请选择设备方向进出','addAccessControl')}}</option>
         <option  value="3306">{{vc.i18n('进','addAccessControl')}}</option>
<option  value="3307">{{vc.i18n('出','addAccessControl')}}</option>
  </select>         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='门禁厂家' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
<select class="custom-select" v-model="addAccessControlInfo.implBean">
         <option selected  disabled value="">{{vc.i18n('必填，请选择门禁厂家','addAccessControl')}}</option>
         <option  value="xx">{{vc.i18n('xx','addAccessControl')}}</option>
<option  value="oo">{{vc.i18n('oo','addAccessControl')}}</option>
  </select>         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='位置ID' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.locationId"                   type="text" :placeholder="vc.i18n('必填，请填写位置ID','addAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
         <label class="col-sm-2 col-form-label"><span><vc:i18n name='位置名称'' namespace='addAccessControl'></vc:i18n></span></label>
         <div class="col-sm-10">
           <input v-model="addAccessControlInfo.locationName"                   type="text" :placeholder="vc.i18n('必填，请填写位置名称'','addAccessControl')" class="form-control">
         </div>
</div>

                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="saveAccessControlInfo()" ><i class="fa fa-check"></i>&nbsp;
                                    <span><vc:i18n name="保存"></vc:i18n></span>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <span><vc:i18n name="取消"></vc:i18n></span>
                                    </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
