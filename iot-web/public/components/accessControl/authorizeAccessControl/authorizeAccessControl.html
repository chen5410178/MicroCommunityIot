<div id="authorizeAccessControlModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="授权门禁" namespace="authorizeAccessControl"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁设备' namespace='authorizeAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10 col-form-label">
                            <label class="margin-right" v-for="(item,index) in authorizeAccessControlInfo.machines">
                                <input type="checkbox" v-model="authorizeAccessControlInfo.machineIds"
                                    :value="item.machineId"> {{item.machineName}}
                            </label>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name="开始时间" namespace="authorizeAccessControl"></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="authorizeAccessControlInfo.startDate" type="text"
                                :placeholder="vc.i18n('必填，请选择开始时间','authorizeAccessControl')"
                                class="form-control startDate">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name="结束时间" namespace="authorizeAccessControl"></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="authorizeAccessControlInfo.endDate" type="text"
                                :placeholder="vc.i18n('必填，请选择结束时间','authorizeAccessControl')"
                                class="form-control endDate">
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button"
                            v-on:click="_authorizeAccessControl()">
                            <vc:i18n name="授权"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
