<div id="addHardwareManufacturerModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

                <div class="ibox-content">
                    <div>

                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">

                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addHardwareManufacturerInfo.hmName" type="text"

                                </div>
                            </div>
                            <div class="form-group row">

                                    <vc:i18n name='厂商协议版本号' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">

                                    <vc:i18n name='协议实现' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addHardwareManufacturerInfo.protocolImpl" type="text"
                                        :placeholder="vc.i18n('必填，请填写协议实现','addHardwareManufacturer')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='该协议开发者' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">

                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='开发者联系方式' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addHardwareManufacturerInfo.link" type="text"
                                        :placeholder="vc.i18n('必填，请填写开发者联系方式','addHardwareManufacturer')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='该协议许可' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="addHardwareManufacturerInfo.license" :placeholder="vc.i18n('必填，请填写该协议许可','addHardwareManufacturer')"
                                        class="form-control" rows="5"></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='产品官网' namespace='addHardwareManufacturer'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addHardwareManufacturerInfo.prodUrl" type="text"
                                        :placeholder="vc.i18n('必填，请填写产品官网','addHardwareManufacturer')" class="form-control">
                                </div>
                            </div>

                                <label class="col-sm-2 col-form-label text-right">

                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="addHardwareManufacturerInfo.defaultProtocol">
                                        <option selected disabled value="">{{vc.i18n('必填，请选择是否启用该协议','addHardwareManufacturer')}}</option>
                                        <option value="T">{{vc.i18n('是','addHardwareManufacturer')}}</option>
                                        <option value="F">{{vc.i18n('否','addHardwareManufacturer')}}</option>
                                    </select>
                                </div>
                            </div>-->
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="saveHardwareManufacturerInfo()">
                                    <i class="fa fa-check"></i>&nbsp;
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
