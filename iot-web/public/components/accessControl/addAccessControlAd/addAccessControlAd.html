<div id="addAccessControlAdModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="添加" namespace="addAccessControlAd"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='广告名称' namespace='addAccessControlAd'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addAccessControlAdInfo.adName" type="text"
                :placeholder="vc.i18n('必填，请填写广告名称','addAccessControlAd')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='状态' namespace='addAccessControlAd'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addAccessControlAdInfo.state">
                <option selected disabled value="">{{vc.i18n('必填，请选择状态','addAccessControlAd')}}</option>
                <option value="Y">{{vc.i18n('在用','addAccessControlAd')}}</option>
                <option value="N">{{vc.i18n('停用','addAccessControlAd')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='广告类型' namespace='addAccessControlAd'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addAccessControlAdInfo.adType">
                <option selected disabled value="">{{vc.i18n('必填，请选择广告类型','addAccessControlAd')}}</option>
                <option value="IMG">{{vc.i18n('图片','addAccessControlAd')}}</option>
                <option value="VIDEO">{{vc.i18n('视频','addAccessControlAd')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='广告地址' namespace='addAccessControlAd'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <vc:create path="frame/uploadFile" callBackListener="addAccessControlAd" callBackFunction="notifyUrl"
                namespace="addAccessControlAd">
              </vc:create>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='备注' namespace='addAccessControlAd'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="addAccessControlAdInfo.remark" :placeholder="vc.i18n('必填，请填写备注','addAccessControlAd')"
                class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="saveAccessControlAdInfo()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
