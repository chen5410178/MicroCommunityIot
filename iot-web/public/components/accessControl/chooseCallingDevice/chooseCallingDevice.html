<div id="chooseCallingDeviceModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="chooseCallingDeviceModelLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="chooseCallingDeviceModelLabel">
                    <span><vc:i18n name="选择设备" namespace="chooseCallingDevice"></vc:i18n></span>
                </h3>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class=" row">
                    <div class="col-lg-12">
                        <div class="ibox ">
                            <div class="row">
                                <div class="col-sm-7 m-b-xs">
                                </div>
                                <div class="col-sm-5">
                                    <div class="input-group">
                                        <input :placeholder="vc.i18n('输入设备名称','chooseCallingDevice')" type="text"
                                               v-model="chooseCallingDeviceInfo._currentDeviceName"
                                               class="form-control form-control-sm">
                                        <span class="input-group-Deviceend">
                                                <button type="button" class="btn btn-sm btn-primary"
                                                        v-on:click="queryDevices()">
                                                    <span><vc:i18n name="查询" namespace="chooseCallingDevice"></vc:i18n></span>
                                                </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive" style="margin-top:15px">
                                <table class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th>
                                            <span><vc:i18n name="设备id" namespace="chooseCallingDevice"></vc:i18n></span>Id
                                        </th>
                                        <th>
                                            <span><vc:i18n name="设备名称" namespace="chooseCallingDevice"></vc:i18n></span>
                                        </th>
                                        <th>
                                            <span><vc:i18n name="呼叫号码" namespace="chooseCallingDevice"></vc:i18n></span>
                                        </th>
                                        <th>
                                            <span><vc:i18n name="平台名称" namespace="chooseCallingDevice"></vc:i18n></span>
                                        </th>
                                        <th>
                                            <span><vc:i18n name="操作" namespace="chooseCallingDevice"></vc:i18n></span>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr v-for="device in chooseCallingDeviceInfo.devices">
                                        <td>{{device.deviceId}}</td>
                                        <td>{{device.deviceName	}}</td>
                                        <td>{{device.callingNum}}</td>
                                        <td>{{device.platformName}}</td>
                                        <td>
                                            <button class="btn btn-primary btn-xs" v-on:click="chooseCallingDevice(device)">
                                                <span><vc:i18n name="选择" namespace="chooseCallingDevice"></vc:i18n></span>
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                                <!-- 分页 -->
                                <vc:create namespace="chooseCallingDevice" path="frame/paginationPlus"></vc:create>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
