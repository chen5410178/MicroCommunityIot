<div id="editCallingPlatformModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editCallingPlatform"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='平台名称' namespace='editCallingPlatform'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="editCallingPlatformInfo.platformName" type="text"
                                :placeholder="vc.i18n('必填，请填写平台名称','editCallingPlatform')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='平台IP地址' namespace='editCallingPlatform'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="editCallingPlatformInfo.ipAddr" type="text"
                                :placeholder="vc.i18n('必填，请填写平台IP地址','editCallingPlatform')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='端口' namespace='editCallingPlatform'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="editCallingPlatformInfo.port" type="text"
                                :placeholder="vc.i18n('必填，请填写端口','editCallingPlatform')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='备注' namespace='editCallingPlatform'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea :placeholder="vc.i18n('必填，请填写备注','editCallingPlatform')" class="form-control"
                                v-model="editCallingPlatformInfo.remark"></textarea>
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="editCallingPlatform()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
