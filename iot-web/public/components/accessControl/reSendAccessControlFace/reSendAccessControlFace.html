<div class="modal fade" id="reSendAccessControlFaceModel" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">
                    <vc:i18n name="请确认您的操作!"></vc:i18n>
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <tr align="center">
                    <th>
                        <vc:i18n name="重新全量下发人脸，下发前请您清理设备中的人脸" namespace="reSendAccessControlFace"></vc:i18n>
                    </th>
                </tr>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal"
                    v-on:click="closeDeleteAccessControlModel()">
                    <vc:i18n name="点错了"></vc:i18n>
                </button>
                <button type="button" class="btn btn-primary" v-on:click="reSendAccessControlFace()">
                    <vc:i18n name="确认下发!"></vc:i18n>
                </button>
            </div>
        </div>
    </div>
</div>
