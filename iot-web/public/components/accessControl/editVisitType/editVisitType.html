<div id="editVisitTypeModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editVisitType"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='类型名称' namespace='editVisitType'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editVisitTypeInfo.name" type="text"
                                        :placeholder="vc.i18n('必填，请填写类型名称','editVisitType')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='通行方式' namespace='editVisitType'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editVisitTypeInfo.visitWay">
                                        <option disabled selected value="">{{vc.i18n('必填，请选择通行方式','editVisitType')}}</option>
                                        <option v-for="(item, index) in visitWayList" :key="index" :value="item.statusCd">
                                            {{item.name}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='审核方式' namespace='editVisitType'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editVisitTypeInfo.auditWay">
                                        <option disabled selected value="">{{vc.i18n('必填，请选择审核方式','editVisitType')}}</option>
                                        <option v-for="(item, index) in auditWayList" :key="index" :value="item.statusCd">
                                            {{item.name}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='拜访天数' namespace='editVisitType'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editVisitTypeInfo.visitDay" type="number"
                                        :placeholder="vc.i18n('选填，请填写拜访天数','editVisitType')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='备注' namespace='editVisitType'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editVisitTypeInfo.remark" type="text"
                                        :placeholder="vc.i18n('选填，请填写备注','editVisitType')" class="form-control">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="editVisitType()">
                                    <i class="fa fa-check"></i>&nbsp;
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
