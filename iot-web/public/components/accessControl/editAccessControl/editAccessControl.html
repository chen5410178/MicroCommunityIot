<div id = "editAccessControlModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true" >
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b "><span><vc:i18n name="修改门禁" namespace="editAccessControl"></vc:i18n></span></h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='设备编码' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.machineCode"                   type="text" :placeholder="vc.i18n('必填，请填写设备编码','editAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='设备名称' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.machineName"                   type="text" :placeholder="vc.i18n('必填，请填写设备名称','editAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='设备IP' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.machineIp"                   type="text" :placeholder="vc.i18n('必填，请填写设备IP','editAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='设备mac' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.machineMac"                   type="text" :placeholder="vc.i18n('必填，请填写设备mac','editAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='设备方向进出' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
<select class="custom-select" v-model="editAccessControlInfo.direction">
         <option selected  disabled value="">{{vc.i18n('必填，请选择设备方向进出' ,'editAccessControl')}}</option>
         <option  value="3306">{{vc.i18n('进' ,'editAccessControl')}} </option>
<option  value="3307">{{vc.i18n('出' ,'editAccessControl')}} </option>
  </select>         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='门禁厂家' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
<select class="custom-select" v-model="editAccessControlInfo.implBean">
         <option selected  disabled value="">{{vc.i18n('必填，请选择门禁厂家' ,'editAccessControl')}}</option>
         <option  value="xx">{{vc.i18n('xx' ,'editAccessControl')}} </option>
<option  value="oo">{{vc.i18n('oo' ,'editAccessControl')}} </option>
  </select>         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='位置ID' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.locationId"                   type="text" :placeholder="vc.i18n('必填，请填写位置ID','editAccessControl')" class="form-control">
         </div>
</div>
<div class="form-group row">
<label class="col-sm-2 col-form-label"><span><vc:i18n name='位置名称'' namespace='editAccessControl'></vc:i18n></span> </label>
         <div class="col-sm-10">
           <input v-model="editAccessControlInfo.locationName"                   type="text" :placeholder="vc.i18n('必填，请填写位置名称'','editAccessControl')" class="form-control">
         </div>
</div>

                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="editAccessControl()" ><i class="fa fa-check"></i>&nbsp;<span><vc:i18n name="保存"></vc:i18n></span></button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal"><span><vc:i18n name="取消"></vc:i18n></span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
