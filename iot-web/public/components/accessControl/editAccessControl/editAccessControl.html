<div id="editAccessControlModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editAccessControl"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁名称' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editAccessControlInfo.machineName" type="text"
                                :placeholder="vc.i18n('必填，请填写门禁名称','editAccessControl')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁编码' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editAccessControlInfo.machineCode" type="text"
                                :placeholder="vc.i18n('必填，请填写门禁编码','editAccessControl')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='IP' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editAccessControlInfo.machineIp" type="text"
                                :placeholder="vc.i18n('选填，请填写门禁IP','editAccessControl')" class="form-control">
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='Mac' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <input v-model="editAccessControlInfo.machineMac" type="text"
                                :placeholder="vc.i18n('选填，请填写门禁mac','editAccessControl')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='方向' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editAccessControlInfo.direction">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁方向','editAccessControl')}}
                                </option>
                                <option value="3306">{{vc.i18n('进','editAccessControl')}}</option>
                                <option value="3307">{{vc.i18n('出','editAccessControl')}}</option>

                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='位置' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editAccessControlInfo.locationId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择位置','editAccessControl')}}</option>
                                <option :value="item.locationId"
                                    v-for="(item,index) in  editAccessControlInfo.locations">{{item.locationName}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='门禁厂家' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editAccessControlInfo.implBean">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁厂家','editAccessControl')}}
                                </option>
                                <option :value="item.hmId" v-for="(item,index) in  editAccessControlInfo.hms">
                                    {{item.hmName}}</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='开门提示' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-4">
                            <select class="custom-select" v-model="editAccessControlInfo.promptSwitch">
                                <option selected disabled value="">{{vc.i18n('必填，请选择开门提示','editAccessControl')}}
                                </option>
                                <option value="ON">{{vc.i18n('是','editAccessControl')}}</option>
                                <option value="OFF">{{vc.i18n('否','editAccessControl')}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row" v-if="editAccessControlInfo.promptSwitch == 'ON'">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='正常提示' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="editAccessControlInfo.normalPrompt"
                                :placeholder="vc.i18n('必填，请填写正常提示','editAccessControl')"
                                class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="form-group row" v-if="editAccessControlInfo.promptSwitch == 'ON'">
                        <label class="col-sm-2 col-form-label text-right">
                            <vc:i18n name='欠费提示' namespace='editAccessControl'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="editAccessControlInfo.owePrompt"
                                :placeholder="vc.i18n('必填，请填写欠费提示','editAccessControl')"
                                class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="_editAccessControl()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
