<div id="addPassQrcodeSettingModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="添加" namespace="addPassQrcodeSetting"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='名称' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addPassQrcodeSettingInfo.qrcodeName" type="text"
                :placeholder="vc.i18n('必填，请填写名称','addPassQrcodeSetting')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='验证' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addPassQrcodeSettingInfo.smsValidate">
                <option selected disabled value="">{{vc.i18n('必填，请选择验证','addPassQrcodeSetting')}}</option>
                <option value="ON">{{vc.i18n('是','addPassQrcodeSetting')}}</option>
                <option value="OFF">{{vc.i18n('否','addPassQrcodeSetting')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='审核' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addPassQrcodeSettingInfo.audit">
                <option selected disabled value="">{{vc.i18n('必填，请选择审核','addPassQrcodeSetting')}}</option>
                <option value="ON">{{vc.i18n('是','addPassQrcodeSetting')}}</option>
                <option value="OFF">{{vc.i18n('否','addPassQrcodeSetting')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='失效时间' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addPassQrcodeSettingInfo.expired" type="number"
                :placeholder="vc.i18n('必填，请填写失效时间','addPassQrcodeSetting')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='状态' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addPassQrcodeSettingInfo.state">
                <option selected disabled value="">{{vc.i18n('必填，请选择状态','addPassQrcodeSetting')}}</option>
                <option value="ON">{{vc.i18n('启用','addPassQrcodeSetting')}}</option>
                <option value="OFF">{{vc.i18n('停用','addPassQrcodeSetting')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='说明' namespace='addPassQrcodeSetting'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <textarea v-model="addPassQrcodeSettingInfo.remark"
                :placeholder="vc.i18n('选填，请填写说明','addPassQrcodeSetting')" class="form-control"></textarea>
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="savePassQrcodeSettingInfo()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
