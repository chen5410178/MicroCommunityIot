<div id="addLiftMachineAcModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addLiftMachineAc"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='电梯' namespace='addLiftMachineAc'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="addLiftMachineAcInfo.machineName" disabled type="text" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='门禁设备' namespace='addLiftMachineAc'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addLiftMachineAcInfo.acMachineId">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁设备','addLiftMachineAc')}}
                                </option>
                                <option :value="item.machineId" v-for="(item,index) in addLiftMachineAcInfo.acMachines">{{item.machineName}}</option>
                            </select>
                            <span>请先到门禁下门禁设备中添加门禁</span>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='门禁类型' namespace='addLiftMachineAc'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="addLiftMachineAcInfo.acType">
                                <option selected disabled value="">{{vc.i18n('必填，请选择门禁类型','addLiftMachineAc')}}
                                </option>
                                <option value="1001">{{vc.i18n('人脸机','addLiftMachineAc')}}</option>
                                <option value="2002">{{vc.i18n('刷卡机','addLiftMachineAc')}}</option>
                                <option value="3003">{{vc.i18n('二维码机','addLiftMachineAc')}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="saveLiftMachineAcInfo()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
