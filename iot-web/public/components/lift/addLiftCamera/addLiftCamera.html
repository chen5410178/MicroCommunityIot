<div id="addLiftCameraModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="添加" namespace="addLiftCamera"></vc:i18n>
        </h3>
        <div class="ibox-content">
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='相机名称' namespace='addLiftCamera'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addLiftCameraInfo.cameraName" type="text"
                :placeholder="vc.i18n('必填，请填写相机名称','addLiftCamera')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='相机编号' namespace='addLiftCamera'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <input v-model="addLiftCameraInfo.cameraCode" type="text"
                :placeholder="vc.i18n('必填，请填写相机编号','addLiftCamera')" class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='相机厂家' namespace='addLiftCamera'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addLiftCameraInfo.factoryId">
                <option selected disabled value="">{{vc.i18n('必填，请选择相机厂家','addLiftCamera')}}</option>
                <option value="sbLiftCamera">{{vc.i18n('松饼相机','addLiftCamera')}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label">
              <vc:i18n name='电梯名称' namespace='addLiftCamera'></vc:i18n>
            </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="addLiftCameraInfo.liftName">
                <option selected disabled value="">{{vc.i18n('必填，请选择电梯名称','addLiftCamera')}}</option>
                <option :value="item.machineId" v-for="(item,index) in addLiftCameraInfo.lifts">{{item.machineName}}</option>
              </select>
            </div>
          </div>
          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="saveLiftCameraInfo()">
              <vc:i18n name="保存"></vc:i18n>
            </button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
              <vc:i18n name="取消"></vc:i18n>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
