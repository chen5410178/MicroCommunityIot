<div class="margin-top">
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='房屋ID' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='名称' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='楼层' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='房屋类型' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='业主' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='建筑/室内面积' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='房屋状态' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='交房时间' namespace='adminMeterDetailRoom'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="room in adminMeterDetailRoomInfo.rooms">
                    <td class="text-center">{{room.roomId}}</td>
                    <td class="text-center">{{room.floorNum}}-{{room.unitNum}}-{{room.roomNum}}</td>
                    <td class="text-center">{{room.layer}}</td>
                    <td class="text-center">{{room.roomSubTypeName}}</td>
                    <td class="text-center">{{room.ownerName}}</td>
                    <td class="text-center">{{room.builtUpArea}}/{{room.roomArea}} 平方米</td>
                    <td class="text-center">{{room.stateName}}</td>
                    <td class="text-center">{{room.startTime}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="adminMeterDetailRoom" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
