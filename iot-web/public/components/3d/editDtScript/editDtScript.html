<div id="editDtScriptModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editDtScript"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='脚本名称' namespace='editDtScript'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="editDtScriptInfo.scriptName" type="text"
                                :placeholder="vc.i18n('必填，请填写脚本名称','editDtScript')" class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='脚本类型' namespace='editDtScript'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <select class="custom-select" v-model="editDtScriptInfo.scriptType">
                                <option selected disabled value="">{{vc.i18n('必填，请选择脚本类型' ,'editDtScript')}}
                                </option>
                                <option value="10001">{{vc.i18n('小区文化' ,'editDtScript')}} </option>
                                <option value="10002">{{vc.i18n('其他' ,'editDtScript')}} </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='脚本' namespace='editDtScript'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="editDtScriptInfo.jsContent" type="text"
                                :placeholder="vc.i18n('必填，请填写脚本','editDtScript')" class="form-control">
                        </div>
                    </div>

                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="editDtScript()">
                            <vc:i18n name="保存"></vc:i18n>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
