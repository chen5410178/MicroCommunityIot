<div id="editDtModalModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="m-t-none m-b ">
          <vc:i18n name="修改" namespace="editDtModal"></vc:i18n>
        </h3>
        <div class="ibox-content">

          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='模型名称' namespace='editDtModal'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editDtModalInfo.modalName" type="text" :placeholder="vc.i18n('必填，请填写模型名称','editDtModal')"
                class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='模型类型' namespace='editDtModal'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <select class="custom-select" v-model="editDtModalInfo.modalType">
                <option selected disabled value="">{{vc.i18n('必填，请选择模型类型' ,'editDtModal')}}</option>
                <option :value="item.statusCd" v-for="(item,index) in editDtModalInfo.modalTypes">{{item.name}}</option>
              </select>
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='模型实现' namespace='editDtModal'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editDtModalInfo.modalBean" type="text" :placeholder="vc.i18n('必填，请填写模型实现','editDtModal')"
                class="form-control">
            </div>
          </div>
          <div class="form-group row">
            <label class="col-sm-2 col-form-label"><span>
                <vc:i18n name='模型存放地址' namespace='editDtModal'></vc:i18n>
              </span> </label>
            <div class="col-sm-10">
              <input v-model="editDtModalInfo.path" type="text" :placeholder="vc.i18n('必填，请填写模型存放地址','editDtModal')"
                class="form-control">
            </div>
          </div>

          <div class="ibox-content">
            <button class="btn btn-primary float-right" type="button" v-on:click="editDtModal()"><i
                class="fa fa-check"></i>&nbsp;<span>
                <vc:i18n name="保存"></vc:i18n>
              </span></button>
            <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
              data-dismiss="modal"><span>
                <vc:i18n name="取消"></vc:i18n>
              </span></button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
