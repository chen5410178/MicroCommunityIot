<div id = "chooseMeterMachineLogModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="chooseMeterMachineLogModelLabel" aria-hidden="true" >
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="chooseMeterMachineLogModelLabel"> <span><vc:i18n name="选择放行申请" namespace="chooseMeterMachineLog"></vc:i18n></span></h3>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class=" row">
                    <div class="col-lg-12">
                        <div class="ibox ">
                            <div class="row">

                                <div class="col-sm-7 m-b-xs">
                                </div>
                                <div class="col-sm-5">
                                    <div class="input-group">
                                        <input :placeholder="vc.i18n('输入放行申请名称','chooseMeterMachineLog')" type="text" v-model="chooseMeterMachineLogInfo._currentMeterMachineLogName" class="form-control form-control-sm">
                                        <span class="input-group-append">
                                                <button type="button" class="btn btn-sm btn-primary" v-on:click="queryMeterMachineLogs()">
                                                    <span><vc:i18n name="查询"></vc:i18n></span></button>
                                            </span>
                                    </div>
                                </div>
                            </div>
                            <div class="table-responsive" style="margin-top:15px">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                                                        <th class="text-center"><span><vc:i18n name='日志ID' namespace='choosemeterMachineLog'></vc:i18n></span></th>
                            <th class="text-center"><span><vc:i18n name='用户名称' namespace='choosemeterMachineLog'></vc:i18n></span> </th>
                            <th class="text-center"><span><vc:i18n name='操作'></vc:i18n></span></th>

                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="meterMachineLog in chooseMeterMachineLogInfo.meterMachineLogs">
                                                                        <td class="text-center">{{meterMachineLog.applyId}}</td>
                            <td class="text-center">{{meterMachineLog.personName}}</td>

                                            <td>
                                                <button class="btn btn-primary btn-xs" v-on:click="chooseMeterMachineLog(meterMachineLog)">
                                                    <span><vc:i18n name="选择"></vc:i18n></span>
                                                    </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
