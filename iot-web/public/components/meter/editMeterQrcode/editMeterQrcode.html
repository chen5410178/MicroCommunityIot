<div id="editMeterQrcodeModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="修改" namespace="editMeterQrcode"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='名称' namespace='editMeterQrcode'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="editMeterQrcodeInfo.qrcodeName" type="text"
                                        :placeholder="vc.i18n('必填，请填写名称','editMeterQrcode')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='查询方式' namespace='editMeterQrcode'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editMeterQrcodeInfo.queryWay">
                                        <option disabled selected value="">{{vc.i18n('必填，请选择查询方式','editMeterQrcode')}}</option>
                                        <option v-for="(item, index) in queryWayList" :key="index" :value="item.statusCd">
                                            {{item.name}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='状态' namespace='editMeterQrcode'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="editMeterQrcodeInfo.state">
                                        <option disabled selected value="">{{vc.i18n('必填，请选择状态','editMeterQrcode')}}</option>
                                        <option value="ON">{{vc.i18n('启用','editMeterQrcode')}}</option>
                                        <option value="OFF">{{vc.i18n('停用','editMeterQrcode')}}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='说明' namespace='editMeterQrcode'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <textarea v-model="editMeterQrcodeInfo.remark" rows="3" class="form-control"
                                        :placeholder="vc.i18n('选填，请填写说明','editMeterQrcode')" ></textarea>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="editMeterQrcode()">
                                    <i class="fa fa-check"></i>&nbsp;
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
