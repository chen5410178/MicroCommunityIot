<div id="chargeMeterModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="充值" namespace="chargeMeter"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='房屋' namespace='chargeMeter'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="chargeMeterInfo.roomName" type="text" disabled
                            class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='表号' namespace='chargeMeter'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="chargeMeterInfo.address" type="text" disabled
                            class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='充值金额' namespace='chargeMeter'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <input v-model="chargeMeterInfo.chargeMoney" placeholder="必填，请输入充值金额" type="text"
                            class="form-control">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='说明' namespace='chargeMeter'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea v-model="chargeMeterInfo.remark"  placeholder="输入说明"
                            class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button class="btn btn-primary float-right" type="button" v-on:click="_settingRead()"><i
                                class="fa fa-check"></i>&nbsp;
                            <span>
                                <vc:i18n name="提交"></vc:i18n>
                            </span>
                        </button>
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;"
                            data-dismiss="modal">
                            <vc:i18n name="取消"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
