<div id="addMeterMachineFactoryModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addMeterMachineFactory"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='厂家名称' namespace='addMeterMachineFactory'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addMeterMachineFactoryInfo.factoryName" type="text"
                                        :placeholder="vc.i18n('必填，请填写厂家名称','addMeterMachineFactory')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='厂家处理类' namespace='addMeterMachineFactory'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addMeterMachineFactoryInfo.beanImpl" type="text"
                                        :placeholder="vc.i18n('必填，请填写厂家处理类','addMeterMachineFactory')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='模式' namespace='addMeterMachineFactory'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="addMeterMachineFactoryInfo.machineModel">
                                        <option value="" disabled selected>{{vc.i18n('必填，请选择模式','addMeterMachineFactory')}}</option>
                                        <option value="1001">{{vc.i18n('充值模式','addMeterMachineFactory')}}</option>
                                        <option value="2002">{{vc.i18n('抄表模式','addMeterMachineFactory')}}</option>
                                        <option value="3003">{{vc.i18n('都支持','addMeterMachineFactory')}}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='备注' namespace='addMeterMachineFactory'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addMeterMachineFactoryInfo.remark" type="text"
                                        :placeholder="vc.i18n('选填，请填写备注','addMeterMachineFactory')" class="form-control">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="saveMeterMachineFactoryInfo()">
                                    <i class="fa fa-check"></i>&nbsp;
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
