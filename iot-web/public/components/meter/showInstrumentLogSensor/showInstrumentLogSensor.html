<div id="showInstrumentLogSensorModel" class="modal fade" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="传感器上报" namespace="showInstrumentLogSensor"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">
                            <vc:i18n name='传感器值' namespace='showInstrumentLogSensor'></vc:i18n>
                        </label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="3">{{showInstrumentLogSensorInfo.sensorValue}}</textarea>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                            <vc:i18n name="返回"></vc:i18n>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
