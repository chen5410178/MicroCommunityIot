<div id="renewalLockPersonModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="续期" namespace="renewalLockPerson"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name="续期开始时间" namespace="renewalLockPerson"></vc:i18n>
                                </label>
                                <div class="col-sm-9">
                                    <input v-model="renewalLockPersonInfo.startTime" type="text" :placeholder="vc.i18n('必填，请选择续期开始时间','renewalLockPerson')" class="form-control renewalStartTime">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name="续期结束时间" namespace="renewalLockPerson"></vc:i18n>
                                </label>
                                <div class="col-sm-9">
                                    <input v-model="renewalLockPersonInfo.endTime" type="text" :placeholder="vc.i18n('必填，请选择续期结束时间','renewalLockPerson')" class="form-control renewalEndTime">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="renewalLockPerson()">
                                    <i class="fa fa-check"></i>
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
