<div id="resetLockPwdModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="重置密码" namespace="resetLockPwd"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name="新密码" namespace="resetLockPwd"></vc:i18n>
                                </label>
                                <div class="col-sm-9">
                                    <input v-model="resetLockPwdInfo.cardNumber" type="text" :placeholder="vc.i18n('必填，请输入新密码','resetLockPwd')" class="form-control">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="resetLockPwd()">
                                    <i class="fa fa-check"></i>
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
