<div id="unlockMachineModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="开锁" namespace="unlockMachine"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name="开锁方式" namespace="unlockMachine"></vc:i18n>
                                </label>
                                <div class="col-sm-9">
                                    <select class="custom-select" v-model="unlockMachineInfo.openTypeCd">
                                        <option selected disabled value="">{{vc.i18n('必填，请选择开锁方式','unlockMachine')}}</option>
                                        <option value="1001">{{vc.i18n('密码开锁','unlockMachine')}}</option>
                                        <option value="2002">{{vc.i18n('蓝牙开锁','unlockMachine')}}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row" v-if="unlockMachineInfo.openTypeCd === '1001'">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name="密码" namespace="unlockMachine"></vc:i18n>
                                </label>
                                <div class="col-sm-9">
                                    <input v-model="unlockMachineInfo.password" type="text"
                                        :placeholder="vc.i18n('必填，请输入密码','unlockMachine')" class="form-control">
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="unlockMachine()">
                                    <i class="fa fa-check"></i>
                                    <vc:i18n name="开锁"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
