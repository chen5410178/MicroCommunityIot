<div id="addLockMachineModel" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <h3 class="m-t-none m-b ">
                    <vc:i18n name="添加" namespace="addLockMachine"></vc:i18n>
                </h3>
                <div class="ibox-content">
                    <div>
                        <div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='门禁厂家' namespace='addLockMachine'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <select class="custom-select" v-model="addLockMachineInfo.implBean" @change="_selectLockMachineFactory()">
                                        <option selected disabled value="">{{vc.i18n('必填，请选择门禁厂家','addLockMachine')}}</option>
                                        <option v-for="(item, index) in lockMachineFactoryList" :key="index" :value="item.factoryId">
                                            {{item.factoryName}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row" v-for="(item, index) in addLockMachineInfo.lockMachineFactorySpecList" :key="index">
                                <label class="col-sm-2 col-form-label text-right">
                                    {{item.specName}}
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="item.value" type="text" :placeholder="item.remark" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='门锁名称' namespace='addLockMachine'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addLockMachineInfo.machineName" type="text"
                                        :placeholder="vc.i18n('必填，请填写门锁名称','addLockMachine')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='门锁编号' namespace='addLockMachine'></vc:i18n>
                                </label>
                                <div class="col-sm-10">
                                    <input v-model="addLockMachineInfo.machineCode" type="text"
                                        :placeholder="vc.i18n('必填，请填写门锁编号','addLockMachine')" class="form-control">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label text-right">
                                    <vc:i18n name='房屋' namespace='addLockMachine'></vc:i18n>
                                </label>
                                <div class="col-sm-7">
                                    <input v-model="addLockMachineInfo.roomName" type="text" disabled
                                        :placeholder="vc.i18n('必填，请选择房屋','addLockMachine')" class="form-control">
                                </div>
                                <div class="col-sm-3">
                                    <button type="button" class="btn btn-primary btn-sm" v-on:click="_selectRoom()">选择</button>
                                </div>
                            </div>
                            <div class="ibox-content">
                                <button class="btn btn-primary float-right" type="button" v-on:click="saveLockMachineInfo()">
                                    <i class="fa fa-check"></i>&nbsp;
                                    <vc:i18n name="保存"></vc:i18n>
                                </button>
                                <button type="button" class="btn btn-warning float-right" style="margin-right:20px;" data-dismiss="modal">
                                    <vc:i18n name="取消"></vc:i18n>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
