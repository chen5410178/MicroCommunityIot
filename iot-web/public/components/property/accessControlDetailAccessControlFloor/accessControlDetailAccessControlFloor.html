<div class="margin-top">
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th data-hide="phone" class="text-center ">
                        <vc:i18n name="楼栋" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                    <th data-hide="phone" class="text-center ">
                        <vc:i18n name="单元" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                    <th data-hide="phone" class="text-center ">
                        <vc:i18n name="门禁名称" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                    <th data-hide="phone" class="text-center">
                        <vc:i18n name="门禁编号" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                    <th data-hide="phone" class="text-center">
                        <vc:i18n name="人员数" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                    <th data-hide="phone" class="text-center">
                        <vc:i18n name="授权时间" namespace="accessControlDetailAccessControlFloor"></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="accessControl in accessControlDetailAccessControlFloorInfo.accessControlFloors">
                    <td class="text-center">
                        {{accessControl.floorNum}}
                    </td>
                    <td class="text-center">
                        {{accessControl.unitNum}}
                    </td>
                    <td class="text-center">
                        {{accessControl.machineName}}
                    </td>
                    <td class="text-center">
                        {{accessControl.machineCode}}
                    </td>
                    <td class="text-center">
                        {{accessControl.personCount || 0}}
                    </td>
                    <td class="text-center">
                        {{accessControl.createTime}}
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="accessControlDetailAccessControlFloor" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
