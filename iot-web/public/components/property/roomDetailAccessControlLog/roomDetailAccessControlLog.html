    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='编号' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='设备名称' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='设备编码' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='日志动作' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='用户ID' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='用户名称' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='状态' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='下发时间' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='报文' namespace='roomDetailAccessControlLog'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="log in roomDetailAccessControlLogInfo.logs">
                    <td class="text-center">{{log.logId}}</td>
                    <td class="text-center">{{log.machineName}}</td>
                    <td class="text-center">{{log.machineCode}}</td>
                    <td class="text-center">{{log.logAction}}</td>
                    <td class="text-center">{{log.userId}}</td>
                    <td class="text-center">{{log.userName}}</td>
                    <td class="text-center">{{log.stateName}}</td>
                    <td class="text-center">{{log.createTime}}</td>

                    <td class="text-center">
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs"
                                v-on:click="_openViewAccessControlLogModel(log)">
                                <vc:i18n name='报文'></vc:i18n>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="roomDetailAccessControlLog" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
    


    <vc:create path="accessControl/showAccessControlLog"></vc:create>
</div>
