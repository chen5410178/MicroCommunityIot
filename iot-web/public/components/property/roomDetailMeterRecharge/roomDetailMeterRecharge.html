    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='房屋' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='表类型' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='表名称' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='表号' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='剩余读数' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='充值时间' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='说明' namespace='meterMachineDetail'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="detail in roomDetailMeterRechargeInfo.details">
                    <td class="text-center">{{detail.roomName}}</td>
                    <td class="text-center">{{detail.machineName}}</td>
                    <td class="text-center">{{detail.typeName}}</td>
                    <td class="text-center">{{detail.address}}</td>
                    <td class="text-center" >{{detail.prestoreDegrees}}</td>
                    <td class="text-center">{{detail.createTime}}</td>
                    <td class="text-center">{{detail.remark}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">
                
            </div>
            <div class="col-sm-8">
                <vc:create namespace="roomDetailMeterRecharge" path="frame/paginationPlus"></vc:create>
