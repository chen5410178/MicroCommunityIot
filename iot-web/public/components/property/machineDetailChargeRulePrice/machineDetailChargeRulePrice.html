<div class="margin-top">
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='编号' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='时段开始时间' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='时段结束时间' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='价格策略' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='电价' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='服务单价' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>

                    <th class="text-center">
                        <vc:i18n name='备注' namespace='machineDetailChargeRulePrice'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="price in machineDetailChargeRulePriceInfo.rules">
                    <td class="text-center">{{price.crpId}}</td>
                    <td class="text-center">{{price.startTime}}</td>
                    <td class="text-center">{{price.endTime}}</td>
                    <td class="text-center">{{price.cpaTypeName}}</td>
                    <td class="text-center">{{price.price}}</td>
                    <td class="text-center">{{price.servicePrice}}</td>
                    <td class="text-center">{{price.remark}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="machineDetailChargeRulePrice" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
