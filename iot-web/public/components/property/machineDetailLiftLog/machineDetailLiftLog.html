    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='日志ID' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='电梯名称' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='电梯编号' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='日志动作' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='状态' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='操作人' namespace='liftMachineLog'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='创建时间' namespace='liftMachineLog'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="liftMachineLog in machineDetailLiftLogInfo.logs">
                    <td class="text-center">{{liftMachineLog.logId}}</td>
                    <td class="text-center">{{liftMachineLog.machineName}}</td>
                    <td class="text-center">{{liftMachineLog.machineCode}}</td>
                    <td class="text-center">{{liftMachineLog.logActionName}}</td>
                    <td class="text-center">{{liftMachineLog.stateName}}</td>
                    <td class="text-center">{{liftMachineLog.personName}}</td>
                    <td class="text-center">{{liftMachineLog.createTime}}</td>
                    <td class="text-center">
                        <div class="btn-group">
                            <button class="btn-white btn btn-xs" v-on:click="_openViewLiftMachineLogModel(liftMachineLog)">
                                <vc:i18n name='报文'></vc:i18n>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
                <vc:create namespace="machineDetailLiftLog" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
    <vc:create path="lock/showLockLog"></vc:create>
</div>
