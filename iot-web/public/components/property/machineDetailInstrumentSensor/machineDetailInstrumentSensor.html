    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='传感器ID' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='传感器类型' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='最小值' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='最大值' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='单位' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='创建时间' namespace='instrumentSensorManage'></vc:i18n>
                    </th>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="instrumentSensor in machineDetailInstrumentSensorInfo.sensors">
                    <td class="text-center">{{instrumentSensor.sensorId}}</td>
                    <td class="text-center">{{instrumentSensor.sensorTypeName}}</td>
                    <td class="text-center">{{instrumentSensor.minValue}}</td>
                    <td class="text-center">{{instrumentSensor.maxValue}}</td>
                    <td class="text-center">{{instrumentSensor.units}}</td>
                    <td class="text-center">{{instrumentSensor.createTime}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">

            </div>
            <div class="col-sm-8">
