<div class="margin-top">
    <div class="margin-top">
        <table class="footable table table-stripped toggle-arrow-tiny" data-page-size="15">
            <thead>
                <tr>
                    <th class="text-center">
                        <vc:i18n name='电梯名称' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='电梯编号' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='门禁名称' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='门禁编号' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='门禁类型' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                    <th class="text-center">
                        <vc:i18n name='创建时间' namespace='machineDetailLiftAc'></vc:i18n>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="machineDetailLiftAc in machineDetailLiftAcInfo.reservations">
                    <td class="text-center">{{machineDetailLiftAc.machineName}}</td>
                    <td class="text-center">{{machineDetailLiftAc.machineCode}}</td>
                    <td class="text-center">{{machineDetailLiftAc.acMachineName}}</td>
                    <td class="text-center">{{machineDetailLiftAc.acMachineCode}}</td>
                    <td class="text-center" v-if="machineDetailLiftAc.acType='1001'">人脸机</td>
                    <td class="text-center" v-else-if="machineDetailLiftAc.acType='2002'">刷卡机</td>
                    <td class="text-center" v-else>二维码机</td>
                    <td class="text-center">{{machineDetailLiftAc.createTime}}</td>
                </tr>
            </tbody>
        </table>
        <!-- 分页 -->
        <div class="row">
            <div class="col-sm-4">
            </div>
            <div class="col-sm-8">
                <vc:create namespace="machineDetailLiftAc" path="frame/paginationPlus"></vc:create>
            </div>
        </div>
    </div>
</div>
